  </g>

  <g>
    <rect x="366" y="146" width="330" height="140" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="386" y="172" font-size="12.5" font-weight="600" fill="#0b0b0b">ドル円相場（7/28）</text>
    <text x="386" y="212" font-size="26" font-weight="700" fill="#2a78d6">163円台後半</text>
    <text x="386" y="234" font-size="12" fill="#52514e">米・イラン攻撃停止後の原油安でやや落ち着き</text>
    <text x="386" y="254" font-size="11" fill="#898781">FOMC・日銀の据置観測が中心</text>
  </g>

  <text x="24" y="312" font-size="12" fill="#52514e">役員と話すときの要点: 「震源地の違う2つのリスクが同じ週に重なった。株と為替のボラティリティは高止まり」</text>
