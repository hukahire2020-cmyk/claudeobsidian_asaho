  <text x="24" y="322" font-size="12" fill="#52514e">🕰 2月〜: イスラエル・米の軍事作戦　→　8/24: 軍事から金融包囲網への戦略転換</text>
  <rect x="24" y="336" width="672" height="4" rx="2" fill="#e1e0d9"/>
  <rect x="24" y="336" width="480" height="4" rx="2" fill="#2a78d6"/>
  <text x="24" y="362" font-size="11" fill="#898781">出典：Bloomberg / 日本経済新聞 / NHKニュース（各8月24日・25日）</text>
