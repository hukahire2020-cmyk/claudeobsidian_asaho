    <rect x="164" y="82" width="128" height="86" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="228" y="118" text-anchor="middle" font-size="24" fill="#d03b3b">💻</text>
    <text x="228" y="150" text-anchor="middle">テクノロジー</text>

    <rect x="304" y="82" width="128" height="86" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="368" y="118" text-anchor="middle" font-size="24" fill="#d03b3b">🥇</text>
