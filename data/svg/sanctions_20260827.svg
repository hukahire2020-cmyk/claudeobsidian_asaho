  <line x1="24" y1="190" x2="696" y2="190" stroke="#e1e0d9"/>

  <text x="24" y="224" font-size="14" font-weight="700" fill="#0b0b0b">対象の広さ：イランと取引する第三国も制裁対象</text>
  <rect x="24" y="240" width="672" height="46" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
