<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">中村留精密工業: bellSalesAI導入で商談記録の入力時間を80%削減</text>
  <text x="24" y="54" font-size="12" fill="#898781">2026年7月22日発表（ベルフェイス公式）</text>

  <!-- before/after stat tiles -->
  <rect x="60" y="80" width="260" height="140" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="190" y="108" font-size="12" fill="#898781" text-anchor="middle">導入前：1案件あたり</text>
  <text x="190" y="160" font-size="44" fill="#0b0b0b" text-anchor="middle" font-weight="700">30分</text>
  <text x="190" y="195" font-size="11" fill="#52514e" text-anchor="middle">担当者ごとの入力ばらつき</text>

  <text x="360" y="155" font-size="28" fill="#c3c2b7" text-anchor="middle">→</text>

  <rect x="400" y="80" width="260" height="140" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="530" y="108" font-size="12" fill="#898781" text-anchor="middle">導入後：1案件あたり</text>
  <text x="530" y="160" font-size="44" fill="#2a78d6" text-anchor="middle" font-weight="700">5分</text>
  <text x="530" y="195" font-size="11" fill="#52514e" text-anchor="middle">AIが会話から自動抽出・構造化</text>

