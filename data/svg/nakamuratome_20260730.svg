  <text x="360" y="278" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700">約80%削減</text>

  <text x="24" y="326" font-size="10" fill="#898781">出典: ベルフェイス公式プレスリリース(7/22)</text>
