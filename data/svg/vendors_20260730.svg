<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="318" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">KDDI × Google AI Futures Fund：国内スタートアップ支援プログラム</text>
  <text x="24" y="54" font-size="12" fill="#898781">2026年7月28日発表</text>

  <!-- center hub -->
  <rect x="280" y="80" width="160" height="60" rx="8" fill="#2a78d6"/>
  <text x="360" y="105" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">日本のAI</text>
  <text x="360" y="123" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">スタートアップ</text>

  <!-- four support boxes around -->
  <g>
    <rect x="60" y="170" width="150" height="70" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="135" y="195" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">協調投資</text>
    <text x="135" y="213" font-size="10" fill="#52514e" text-anchor="middle">KDDI 300億円規模枠</text>
  </g>
  <g>
    <rect x="225" y="170" width="150" height="70" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="300" y="195" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">早期アクセス</text>
    <text x="300" y="213" font-size="10" fill="#52514e" text-anchor="middle">Gemini等DeepMindモデル</text>
  </g>
  <g>
    <rect x="390" y="170" width="150" height="70" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="465" y="195" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">インフラ提供</text>
    <text x="465" y="213" font-size="10" fill="#52514e" text-anchor="middle">KDDI GPU Cloud等</text>
  </g>
  <g>
    <rect x="555" y="170" width="150" height="70" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="630" y="195" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">専門家支援</text>
    <text x="630" y="213" font-size="10" fill="#52514e" text-anchor="middle">技術・事業の両輪</text>
  </g>

  <line x1="135" y1="170" x2="360" y2="140" stroke="#c3c2b7" stroke-width="1.5"/>
  <line x1="300" y1="170" x2="360" y2="140" stroke="#c3c2b7" stroke-width="1.5"/>
  <line x1="465" y1="170" x2="360" y2="140" stroke="#c3c2b7" stroke-width="1.5"/>
  <line x1="630" y1="170" x2="360" y2="140" stroke="#c3c2b7" stroke-width="1.5"/>

  <text x="24" y="280" font-size="11" fill="#52514e">通信キャリア×海外AI大手ファンドの協調支援モデル。「日本発の次世代AIサービス創出」を掲げる</text>

  <text x="24" y="305" font-size="10" fill="#898781">出典: KDDI公式(7/28)</text>
</svg>
