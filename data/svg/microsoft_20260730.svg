<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">Microsoft自社6.2万人営業組織：AI Sales Agent定着率</text>
  <text x="24" y="54" font-size="12" fill="#898781">2026年7月7日公式ブログ（導入から2年時点）</text>

  <!-- stat tiles -->
  <rect x="50" y="80" width="190" height="150" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="145" y="108" font-size="12" fill="#898781" text-anchor="middle">対象営業組織</text>
  <text x="145" y="160" font-size="34" fill="#0b0b0b" text-anchor="middle" font-weight="700">6.2万人</text>
  <text x="145" y="185" font-size="11" fill="#52514e" text-anchor="middle">Customer and Partner</text>
  <text x="145" y="200" font-size="11" fill="#52514e" text-anchor="middle">Solutions部門</text>

  <rect x="265" y="80" width="190" height="150" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="108" font-size="12" fill="#898781" text-anchor="middle">日次利用率</text>
  <text x="360" y="160" font-size="34" fill="#2a78d6" text-anchor="middle" font-weight="700">60%超</text>
  <text x="360" y="185" font-size="11" fill="#52514e" text-anchor="middle">導入2年時点</text>

  <rect x="480" y="80" width="190" height="150" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="575" y="108" font-size="12" fill="#898781" text-anchor="middle">月次利用率</text>
  <text x="575" y="160" font-size="34" fill="#008300" text-anchor="middle" font-weight="700">98%超</text>
  <text x="575" y="185" font-size="11" fill="#52514e" text-anchor="middle">組織にほぼ完全定着</text>

  <rect x="50" y="250" width="620" height="60" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="70" y="275" font-size="12" fill="#0b0b0b" font-weight="700">Gartner(2026)引用: AIの「次の一手」提案を営業に示す組織は</text>
  <text x="70" y="295" font-size="12" fill="#2a78d6" font-weight="700">売上成長を達成する可能性が2.6倍</text>

  <text x="24" y="326" font-size="10" fill="#898781">出典: Microsoft Dynamics 365公式ブログ(7/7)</text>
