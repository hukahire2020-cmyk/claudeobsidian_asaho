<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="318" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">アセンド：整備費請求書処理をAI-OCRが代行</text>

  <!-- before/after bar -->
  <text x="24" y="80" font-size="12" fill="#52514e">データ入力工数（従来比）</text>
  <text x="150" y="105" font-size="11" fill="#0b0b0b" text-anchor="end">従来</text>
  <rect x="160" y="92" width="420" height="24" fill="#c3c2b7"/>
  <text x="590" y="109" font-size="12" fill="#0b0b0b">100%</text>

  <text x="150" y="145" font-size="11" fill="#0b0b0b" text-anchor="end">AI-OCR</text>
  <rect x="160" y="132" width="126" height="24" fill="#2a78d6"/>
  <text x="296" y="149" font-size="12" font-weight="700" fill="#2a78d6">最大70%減</text>

  <rect x="24" y="190" width="672" height="106" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="216" font-size="12" fill="#0b0b0b" font-weight="700">2026年8月20日発表（運送業向けSaaS「ロジックス」機能追加）</text>
  <text x="44" y="240" font-size="12" fill="#52514e">整備工場からの請求書・明細を生成AI（LLM）が読み取り、自動で仕訳・入力</text>
  <text x="44" y="262" font-size="12" fill="#52514e">車両台数が多いほど膨らんできた経理・事務負担を軽減</text>
  <text x="44" y="284" font-size="11" fill="#898781">出典: アセンド株式会社 公式プレスリリース</text>
</svg>
