<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">令和8年熊本地震（M7.1）—— 半導体拠点への影響</text>
  <text x="24" y="54" font-size="12" fill="#898781">2026年7月28日16時27分発生・最大震度7（宇城市・氷川町）</text>

  <!-- casualty stat tiles -->
  <rect x="24" y="72" width="150" height="80" rx="8" fill="#f9f9f7" stroke="#d03b3b"/>
  <text x="99" y="96" font-size="11" fill="#898781" text-anchor="middle">死者（7/30時点）</text>
  <text x="99" y="132" font-size="32" fill="#d03b3b" text-anchor="middle" font-weight="700">34人</text>

  <rect x="184" y="72" width="150" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="259" y="96" font-size="11" fill="#898781" text-anchor="middle">避難者数</text>
  <text x="259" y="132" font-size="32" fill="#0b0b0b" text-anchor="middle" font-weight="700">約1万人</text>

  <rect x="344" y="72" width="170" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="429" y="96" font-size="11" fill="#898781" text-anchor="middle">イオンモール熊本</text>
  <text x="429" y="132" font-size="24" fill="#0b0b0b" text-anchor="middle" font-weight="700">7人死亡・5人負傷</text>

  <rect x="524" y="72" width="172" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="610" y="96" font-size="11" fill="#898781" text-anchor="middle">断水・停電</text>
  <text x="610" y="132" font-size="20" fill="#0b0b0b" text-anchor="middle" font-weight="700">3日目も継続</text>

  <!-- semiconductor impact table -->
  <text x="24" y="182" font-size="13" font-weight="700" fill="#0b0b0b">半導体関連企業の状況</text>

  <rect x="24" y="196" width="672" height="42" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="40" y="222" font-size="12" fill="#0b0b0b" font-weight="700">TSMC（JASM）</text>
  <text x="220" y="222" font-size="12" fill="#52514e">建屋の構造安全を確認、生産ラインを段階的に復旧／隣接地の新工場建設は一部中断</text>

  <rect x="24" y="242" width="672" height="42" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="40" y="268" font-size="12" fill="#0b0b0b" font-weight="700">ソニーセミコンダクタ</text>
  <text x="240" y="268" font-size="12" fill="#52514e">熊本テクノロジーセンターの操業を停止</text>

  <rect x="24" y="288" width="672" height="42" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="40" y="314" font-size="12" fill="#0b0b0b" font-weight="700">ルネサスエレクトロニクス</text>
  <text x="250" y="314" font-size="12" fill="#52514e">天井パネル落下・壁のひび割れを確認した2工場を停止</text>

  <rect x="24" y="334" width="672" height="42" rx="6" fill="#f9f9f7" stroke="#d03b3b"/>
  <text x="40" y="360" font-size="12" fill="#0b0b0b" font-weight="700">東京エレクトロン九州</text>
  <text x="250" y="360" font-size="12" fill="#d03b3b" font-weight="700">コータ・デベロッパー装置 世界シェア91% ／ 7/29に全面稼働停止</text>

  <text x="24" y="392" font-size="10" fill="#898781">出典: 気象庁(7/28) / 時事通信・NHK(7/30) / TrendForce・ITmedia(7/29)</text>
</svg>
