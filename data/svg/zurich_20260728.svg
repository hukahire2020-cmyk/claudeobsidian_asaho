<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="258" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">チューリッヒ生命「New Business 2.0」の中身</text>
  <text x="24" y="54" font-size="11" fill="#898781">生命保険業界初、12体のAIエージェントが並列稼働する新契約査定システム（2026年7月1日導入）</text>

  <g>
    <rect x="30" y="76" width="200" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="130" y="118" font-size="34" font-weight="700" fill="#2a78d6" text-anchor="middle">60%</text>
    <text x="130" y="140" font-size="11.5" fill="#52514e" text-anchor="middle">自動査定率に向上</text>
    <text x="130" y="156" font-size="10.5" fill="#898781" text-anchor="middle">（従来より上昇）</text>
  </g>

  <g>
    <rect x="248" y="76" width="220" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="358" y="118" font-size="34" font-weight="700" fill="#008300" text-anchor="middle">77%削減</text>
    <text x="358" y="140" font-size="11.5" fill="#52514e" text-anchor="middle">手動査定に要する時間（目標値）</text>
    <text x="358" y="156" font-size="10.5" fill="#898781" text-anchor="middle">※導入直後の目標。実績は今後公表</text>
  </g>

  <g>
    <rect x="484" y="76" width="206" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="587" y="118" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="middle">12体</text>
    <text x="587" y="140" font-size="11.5" fill="#52514e" text-anchor="middle">医務・環境・モラル査定などに</text>
    <text x="587" y="156" font-size="11.5" fill="#52514e" text-anchor="middle">特化したAIエージェント</text>
  </g>

  <text x="24" y="224" font-size="12" fill="#0b0b0b">7月17日、"Insurance Asia Awards 2026" で "AI Initiative of the Year" を受賞</text>
  <text x="24" y="244" font-size="10.5" fill="#898781">出典: ★チューリッヒ生命保険公式(PR TIMES 7/17)</text>
</svg>
