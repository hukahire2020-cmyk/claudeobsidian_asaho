<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="258" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">プーチン大統領、北方領土・択捉島を初訪問（2026年8月13日）</text>
  <text x="24" y="54" font-size="12" fill="#52514e">大統領による北方領土訪問はロシア史上初</text>

  <!-- timeline -->
  <line x1="60" y1="120" x2="660" y2="120" stroke="#c3c2b7" stroke-width="2"/>

  <!-- point 1 -->
  <circle cx="120" cy="120" r="6" fill="#898781"/>
  <text x="120" y="100" font-size="12" fill="#52514e" text-anchor="middle">これまで</text>
  <text x="120" y="145" font-size="11.5" fill="#0b0b0b" text-anchor="middle">実効支配継続</text>
  <text x="120" y="161" font-size="11.5" fill="#0b0b0b" text-anchor="middle">軍備・インフラ増強</text>

  <!-- point 2 -->
  <circle cx="330" cy="120" r="6" fill="#898781"/>
  <text x="330" y="100" font-size="12" fill="#52514e" text-anchor="middle">2022年〜</text>
  <text x="330" y="145" font-size="11.5" fill="#0b0b0b" text-anchor="middle">ウクライナ侵攻</text>
  <text x="330" y="161" font-size="11.5" fill="#0b0b0b" text-anchor="middle">日本、対ロ制裁継続</text>

  <!-- point 3 (today, highlighted) -->
  <circle cx="560" cy="120" r="8" fill="#d03b3b"/>
  <text x="560" y="96" font-size="12.5" font-weight="700" fill="#d03b3b" text-anchor="middle">8月13日（今回）</text>
  <text x="560" y="145" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">択捉島を初訪問</text>
  <text x="560" y="161" font-size="11.5" fill="#0b0b0b" text-anchor="middle">水産加工場・病院を視察</text>

  <!-- info panel -->
  <rect x="24" y="190" width="672" height="52" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="40" y="212" font-size="12" fill="#52514e">同行: サハリン州 リマレンコ知事</text>
  <text x="40" y="230" font-size="12" fill="#52514e">狙い: 対日けん制・実効支配の内外へのアピール</text>
  <text x="400" y="212" font-size="12" fill="#0b0b0b" font-weight="700">日本政府の対応</text>
  <text x="400" y="230" font-size="12" fill="#52514e">外交ルートを通じ抗議</text>
</svg>
