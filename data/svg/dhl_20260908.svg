<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="278" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0b0b0b">DHL: AIエージェントが調整業務を代替</text>
  <text x="28" y="58" font-size="12" fill="#52514e">HappyRobotのAIエージェントを複数地域・複数用途に展開（2025/11/11発表）</text>

  <rect x="24" y="82" width="326" height="86" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="187" y="108" font-size="12" fill="#52514e" text-anchor="middle">年間の対応メール件数</text>
  <text x="187" y="144" font-size="24" font-weight="700" fill="#2a78d6" text-anchor="middle">数十万件規模</text>

  <rect x="368" y="82" width="328" height="86" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="532" y="108" font-size="12" fill="#52514e" text-anchor="middle">年間の対応通話時間</text>
  <text x="532" y="144" font-size="24" font-weight="700" fill="#2a78d6" text-anchor="middle">数百万分規模</text>

  <rect x="24" y="184" width="672" height="60" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="42" y="206" font-size="12.5" font-weight="700" fill="#0b0b0b">用途</text>
  <text x="42" y="228" font-size="11.5" fill="#0b0b0b">配送予約の調整／ドライバーへのフォローアップ連絡／優先度の高い庫内連携の調整——電話・メール対応を自律的に処理</text>

  <text x="28" y="266" font-size="11" fill="#898781">出典: ★DHL Group公式 (2025/11/11、二次報道経由で内容確認・原典再確認推奨)</text>
</svg>
