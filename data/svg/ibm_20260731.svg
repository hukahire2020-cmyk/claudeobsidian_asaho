<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="318" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">IBM CEOスタディ2026——日本のCAIO設置率</text>
  <text x="24" y="54" font-size="12" fill="#898781">2026年7月28日発表・世界33カ国・地域のCEO等2,000人調査</text>

  <!-- donut gauge: before -->
  <g transform="translate(180,150)">
    <circle r="80" fill="none" stroke="#e1e0d9" stroke-width="24"/>
    <circle r="80" fill="none" stroke="#c3c2b7" stroke-width="24"
      stroke-dasharray="171 502" stroke-dashoffset="0" transform="rotate(-90)"/>
    <text y="-5" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="middle">34%</text>
    <text y="20" font-size="12" fill="#898781" text-anchor="middle">2025年時点</text>
  </g>
  <text x="180" y="270" font-size="12" fill="#52514e" text-anchor="middle">日本のCAIO設置率（前年）</text>

  <text x="360" y="155" font-size="26" fill="#c3c2b7" text-anchor="middle">→</text>

  <!-- donut gauge: after -->
  <g transform="translate(540,150)">
    <circle r="80" fill="none" stroke="#e1e0d9" stroke-width="24"/>
    <circle r="80" fill="none" stroke="#2a78d6" stroke-width="24"
      stroke-dasharray="421 502" stroke-dashoffset="0" transform="rotate(-90)"/>
    <text y="-5" font-size="34" font-weight="700" fill="#2a78d6" text-anchor="middle">84%</text>
    <text y="20" font-size="12" fill="#898781" text-anchor="middle">2026年時点</text>
  </g>
  <text x="540" y="270" font-size="12" fill="#52514e" text-anchor="middle">日本のCAIO設置率（今年）</text>

  <rect x="24" y="286" width="672" height="0" fill="none"/>
  <text x="360" y="300" font-size="11" fill="#898781" text-anchor="middle">世界平均は26%→76%　／　出典: 日本IBM公式(7/28)</text>
</svg>
