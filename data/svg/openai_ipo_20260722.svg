<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="278" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#0b0b0b">OpenAI、IPO延期を検討 — SpaceX上場が教訓に</text>
  <!-- left: SpaceX stock drop bar -->
  <rect x="28" y="60" width="330" height="192" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="48" y="86" font-size="13" font-weight="700" fill="#0b0b0b">SpaceX株価（上場1週間）</text>
  <text x="48" y="120" font-size="11.5" fill="#52514e">上場直後（6/12）</text>
  <rect x="48" y="130" width="280" height="26" rx="4" fill="#c3c2b7"/>
  <text x="320" y="148" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="end">225ドル</text>
  <text x="48" y="186" font-size="11.5" fill="#52514e">1週間後</text>
  <rect x="48" y="196" width="190" height="26" rx="4" fill="#d03b3b"/>
  <text x="230" y="214" font-size="12" font-weight="700" fill="#fff" text-anchor="end">153ドル</text>
  <text x="48" y="240" font-size="12.5" font-weight="700" fill="#d03b3b">約32%急落</text>
  <!-- right: timeline -->
  <rect x="374" y="60" width="318" height="192" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="394" y="86" font-size="13" font-weight="700" fill="#0b0b0b">OpenAI IPOの計画変化</text>
  <line x1="406" y1="98" x2="406" y2="228" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="406" cy="104" r="4" fill="#2a78d6"/>
  <text x="420" y="108" font-size="11.5" fill="#0b0b0b">当初: 9月上場目標</text>
  <text x="420" y="122" font-size="10.5" fill="#898781">企業価値730〜850億ドル目標</text>
  <circle cx="406" cy="150" r="4" fill="#898781"/>
  <text x="420" y="154" font-size="11.5" fill="#0b0b0b">6/12 SpaceX上場・急落</text>
  <circle cx="406" cy="182" r="4.5" fill="#d03b3b"/>
  <text x="420" y="186" font-size="11.5" font-weight="700" fill="#d03b3b">6/25 2027年へ延期検討と報道</text>
  <text x="420" y="200" font-size="10.5" fill="#898781">Altman氏は評価額1兆ドルに固執</text>
  <text x="420" y="220" font-size="10.5" fill="#898781">前年: 収益130億ドル・損失210億ドル</text>
</svg>
