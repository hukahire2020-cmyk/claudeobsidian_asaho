<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="36" font-size="17" font-weight="700" fill="#0b0b0b">OpenAI vs Anthropic 上場（IPO）レース</text>
  <text x="24" y="56" font-size="12" fill="#52514e">非公開のS-1提出まで進行、年内上場の視野に</text>

  <!-- table-like two columns -->
  <g>
    <rect x="24" y="76" width="330" height="230" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="44" y="102" font-size="14" font-weight="700" fill="#0b0b0b">OpenAI</text>
    <text x="44" y="128" font-size="11.5" fill="#52514e">非公開S-1提出</text>
    <text x="320" y="128" font-size="11.5" fill="#0b0b0b" text-anchor="end">5月22日</text>
    <text x="44" y="152" font-size="11.5" fill="#52514e">公表</text>
    <text x="320" y="152" font-size="11.5" fill="#0b0b0b" text-anchor="end">6月8日</text>
    <text x="44" y="176" font-size="11.5" fill="#52514e">主幹事</text>
    <text x="320" y="176" font-size="11.5" fill="#0b0b0b" text-anchor="end">ゴールドマン・モルガンS</text>
    <text x="44" y="200" font-size="11.5" fill="#52514e">上場目標</text>
    <text x="320" y="200" font-size="11.5" fill="#0b0b0b" text-anchor="end">早ければ9月</text>
    <text x="44" y="224" font-size="11.5" fill="#52514e">直近評価額</text>
    <text x="320" y="224" font-size="11.5" fill="#0b0b0b" text-anchor="end">8,520億ドル（3月時点）</text>
    <text x="44" y="256" font-size="11.5" fill="#52514e">ARR主張（相手側の反論）</text>
    <text x="44" y="278" font-size="20" font-weight="700" fill="#2a78d6">約220億ドル</text>
    <text x="44" y="296" font-size="10.5" fill="#898781">Anthropic側の粗収益ベース主張への反論</text>
  </g>

  <g>
    <rect x="366" y="76" width="330" height="230" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="386" y="102" font-size="14" font-weight="700" fill="#0b0b0b">Anthropic</text>
    <text x="386" y="128" font-size="11.5" fill="#52514e">非公開IPO申請</text>
    <text x="662" y="128" font-size="11.5" fill="#0b0b0b" text-anchor="end">6月1日</text>
    <text x="386" y="152" font-size="11.5" fill="#52514e">上場市場</text>
    <text x="662" y="152" font-size="11.5" fill="#0b0b0b" text-anchor="end">ナスダック</text>
    <text x="386" y="176" font-size="11.5" fill="#52514e">主幹事</text>
    <text x="662" y="176" font-size="11.5" fill="#0b0b0b" text-anchor="end">ゴールドマン・JPモルガン等</text>
    <text x="386" y="200" font-size="11.5" fill="#52514e">上場目標</text>
    <text x="662" y="200" font-size="11.5" fill="#0b0b0b" text-anchor="end">10月・600億ドル超調達</text>
    <text x="386" y="224" font-size="11.5" fill="#52514e">ARR成長率</text>
    <text x="662" y="224" font-size="11.5" fill="#0b0b0b" text-anchor="end">前年比約1,400%増</text>
    <text x="386" y="256" font-size="11.5" fill="#52514e">ARR主張（自社発表）</text>
    <text x="386" y="278" font-size="20" font-weight="700" fill="#2a78d6">300億ドル突破</text>
    <text x="386" y="296" font-size="10.5" fill="#898781">2026年4月時点、クラウド経由売上を含む</text>
  </g>

  <text x="24" y="336" font-size="12.5" fill="#52514e">論点: 上場は、非公開のまま拡大してきた評価額・収益構造が初めて市場の検証にさらされる転換点。</text>
  <text x="24" y="358" font-size="12.5" fill="#52514e">「ARRをどう数えるか」自体が両社の競争の火種になっている。</text>

  <text x="24" y="386" font-size="10.5" fill="#898781">出典: Bloomberg(6/8)・CNBC(6/8)。ARR数値はOpenAI・Anthropic公式発表での確認を推奨</text>
</svg>
