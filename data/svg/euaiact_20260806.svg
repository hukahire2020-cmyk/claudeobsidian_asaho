<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0b0b0b">EU AI Act — 透明性義務が8/2発効（日本企業も域外適用の対象）</text>

  <rect x="28" y="58" width="205" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="130" y="82" font-size="12" fill="#52514e" text-anchor="middle">発効日</text>
  <text x="130" y="124" font-size="28" font-weight="700" fill="#2a78d6" text-anchor="middle">2026/8/2</text>
  <text x="130" y="144" font-size="10.5" fill="#898781" text-anchor="middle">第50条・透明性義務</text>

  <rect x="245" y="58" width="205" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="347" y="82" font-size="12" fill="#52514e" text-anchor="middle">違反時の制裁金</text>
  <text x="347" y="124" font-size="22" font-weight="700" fill="#d03b3b" text-anchor="middle">1,500万€ or 3%</text>
  <text x="347" y="144" font-size="10.5" fill="#898781" text-anchor="middle">世界売上高との高い方</text>

  <rect x="462" y="58" width="230" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="577" y="82" font-size="12" fill="#52514e" text-anchor="middle">実務指針への賛同</text>
  <text x="577" y="124" font-size="28" font-weight="700" fill="#2a78d6" text-anchor="middle">約190社</text>
  <text x="577" y="144" font-size="10.5" fill="#898781" text-anchor="middle">Code of Practice署名（7月末時点）</text>

  <text x="28" y="188" font-size="13" font-weight="700" fill="#0b0b0b">新たに求められる表示義務</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="28" y="200" width="205" height="42" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="130" y="225" fill="#0b0b0b">チャットボット「AIですと開示」</text>
    <rect x="245" y="200" width="205" height="42" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="347" y="225" fill="#0b0b0b">ディープフェイクの表示義務</text>
    <rect x="462" y="200" width="230" height="42" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="577" y="225" fill="#2a78d6" font-weight="700">AI生成物に機械可読マーク</text>
  </g>

  <rect x="28" y="256" width="664" height="30" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="42" y="275" font-size="11" fill="#898781">出典: European Commission公式（digital-strategy.ec.europa.eu, 2026/8/2）</text>
</svg>
