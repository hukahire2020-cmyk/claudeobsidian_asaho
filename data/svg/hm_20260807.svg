<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0b0b0b">H&amp;M、自社モデルの「AIデジタルツイン」30体を展開へ</text>

  <rect x="28" y="60" width="200" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="128" y="86" font-size="12" fill="#52514e" text-anchor="middle">制作するデジタルツイン</text>
  <text x="128" y="140" font-size="40" font-weight="700" fill="#2a78d6" text-anchor="middle">30体</text>
  <text x="128" y="164" font-size="11" fill="#898781" text-anchor="middle">自社専属モデルの肖像から生成</text>

  <rect x="240" y="60" width="452" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="466" y="86" font-size="12" fill="#52514e" text-anchor="middle">権利設計のポイント</text>
  <text x="260" y="116" font-size="12.5" fill="#0b0b0b">✓ 著作権はモデル本人に帰属</text>
  <text x="260" y="140" font-size="12.5" fill="#0b0b0b">✓ 使用料は従来と同じ契約枠で支払い</text>
  <text x="260" y="164" font-size="12.5" fill="#0b0b0b">✓ 初期はSNSで「AI生成」を明示タグ付け</text>

  <text x="28" y="222" font-size="12.5" fill="#0b0b0b">📍 モデル本人の許諾が前提。他ブランド広告への同一デジタルツインの活用も認める方針。</text>
  <rect x="28" y="240" width="664" height="24" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="42" y="256" font-size="11" fill="#898781">出典: CNN.co.jp</text>
</svg>
