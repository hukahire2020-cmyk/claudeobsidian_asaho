<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="34" font-size="17" font-weight="700" fill="#0b0b0b">Meta「Muse Glimmer」——オープンウェイトで無償公開</text>

  <rect x="28" y="54" width="200" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="128" y="94" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="middle">300億</text>
  <text x="128" y="116" font-size="11.5" fill="#52514e" text-anchor="middle">パラメータ規模</text>
  <text x="128" y="134" font-size="10.5" fill="#898781" text-anchor="middle">ノートPC上で直接動作</text>

  <rect x="260" y="54" width="200" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="94" font-size="20" font-weight="700" fill="#008300" text-anchor="middle">無償</text>
  <text x="360" y="116" font-size="11.5" fill="#52514e" text-anchor="middle">Apache License 2.0</text>
  <text x="360" y="134" font-size="10.5" fill="#898781" text-anchor="middle">商用利用も可能</text>

  <rect x="492" y="54" width="200" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="592" y="94" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">2026/8/10</text>
