  <text x="592" y="134" font-size="10.5" fill="#898781" text-anchor="middle">Zuckerberg CEOが表明</text>

  <line x1="28" y1="176" x2="692" y2="176" stroke="#c3c2b7"/>

  <text x="28" y="200" font-size="12" font-weight="700" fill="#0b0b0b">戦略の対比</text>
  <text x="28" y="224" font-size="11.5" fill="#52514e">OpenAI・Anthropic：最先端モデルを有料APIで提供</text>
  <text x="28" y="244" font-size="11.5" fill="#2a78d6">Meta：オープンウェイトモデルを無償公開し普及速度で対抗</text>
  <text x="28" y="270" font-size="11" fill="#898781">出典: ITmedia（8/11）／ビジネス+IT（8/11）</text>
