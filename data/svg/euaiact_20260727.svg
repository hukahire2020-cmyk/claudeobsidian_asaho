<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="258" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">EU AI法 透明性義務（第50条）の適用スケジュール</text>

  <line x1="50" y1="90" x2="670" y2="90" stroke="#c3c2b7" stroke-width="2"/>

  <circle cx="110" cy="90" r="6" fill="#2a78d6"/>
  <text x="110" y="70" font-size="11" fill="#52514e" text-anchor="middle">6月</text>
  <text x="110" y="112" font-size="11.5" fill="#0b0b0b" text-anchor="middle">AI生成コンテンツの</text>
  <text x="110" y="126" font-size="11.5" fill="#0b0b0b" text-anchor="middle">表示・行動規範を公表</text>

  <circle cx="330" cy="90" r="6" fill="#2a78d6"/>
  <text x="330" y="70" font-size="11" fill="#52514e" text-anchor="middle">7/20</text>
  <text x="330" y="112" font-size="11.5" fill="#0b0b0b" text-anchor="middle">遵守ガイドライン</text>
  <text x="330" y="126" font-size="11.5" fill="#0b0b0b" text-anchor="middle">（51頁）を発行</text>

  <circle cx="560" cy="90" r="7" fill="#d03b3b"/>
  <text x="560" y="70" font-size="11" fill="#52514e" text-anchor="middle">8/2</text>
  <text x="560" y="112" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">透明性義務 適用開始</text>
  <text x="560" y="126" font-size="11.5" fill="#0b0b0b" text-anchor="middle">（ラベル表示が法的義務に）</text>

  <rect x="24" y="160" width="672" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="48" y="188" font-size="12" fill="#52514e">対象：ChatGPT・Gemini・Claude・Midjourney・Runway等の提供／導入事業者</text>
  <text x="48" y="216" font-size="20" font-weight="700" fill="#d03b3b">最大1,500万ユーロ or 全世界売上高の3%</text>
</svg>
