<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#0b0b0b">Google、検索とGeminiに学習支援機能を追加</text>
  <text x="24" y="60" font-size="12" fill="#52514e">2026年8月19日発表 — 新学期（北半球）に合わせた一斉投入</text>

  <text x="24" y="92" font-size="12.5" font-weight="700" fill="#2a78d6">Search</text>
  <g font-size="11" fill="#0b0b0b">
    <rect x="24" y="102" width="672" height="30" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="40" y="122">複雑なテーマをインタラクティブな図解・シミュレーションで説明</text>

    <rect x="24" y="138" width="672" height="30" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="40" y="158">アップロード資料から要点をまとめた「1枚もの」学習ノートを自動生成</text>

    <rect x="24" y="174" width="672" height="30" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="40" y="194">4社の試験対策会社と共同で、標準試験9種の練習問題を用意</text>
  </g>

  <text x="24" y="228" font-size="12.5" font-weight="700" fill="#008300">Gemini</text>
  <g font-size="11" fill="#0b0b0b">
    <rect x="24" y="238" width="330" height="30" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="40" y="258">バックグラウンド調査「マルチステップ・リサーチ」</text>

    <rect x="366" y="238" width="330" height="30" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="382" y="258">回転・拡大できる3Dシミュレーション生成</text>

    <rect x="24" y="274" width="330" height="30" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="40" y="294">学習ノート・単語帳を束ねる「学習ハブ」</text>
  </g>

  <text x="24" y="322" font-size="10.5" fill="#898781">出典: Google公式ブログ(8/19) / TechCrunch(8/19)</text>
</svg>
