<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0b0b0b">Sakana AI「Namazu」——日本語特化AIが商用APIとして本格始動</text>

  <rect x="28" y="58" width="310" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="82" font-size="12" font-weight="700" fill="#0b0b0b">Sakana Namazu（8/3提供開始）</text>
  <text x="44" y="106" font-size="11" fill="#52514e">・ベースはオープンモデル「Kimi K2.6」</text>
  <text x="44" y="126" font-size="11" fill="#52514e">・独自データで日本語・商習慣に適応</text>
  <text x="44" y="146" font-size="11" fill="#52514e">・OpenAI互換API、接続先変更だけで移行可</text>
  <text x="44" y="170" font-size="11" fill="#0b0b0b" font-weight="700">入力$0.95／出力$4.00（100万トークン）</text>

  <rect x="366" y="58" width="326" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="382" y="82" font-size="12" font-weight="700" fill="#0b0b0b">ベンチマーク（対Kimi K2.6）</text>

  <text x="382" y="108" font-size="11" fill="#52514e">JFBench（日本語指示理解）</text>
  <rect x="382" y="116" width="280" height="16" rx="3" fill="#e1e0d9"/>
  <rect x="382" y="116" width="30" height="16" rx="3" fill="#2a78d6"/>
  <text x="668" y="129" font-size="11" fill="#0b0b0b" font-weight="700">+1.5%</text>

  <text x="382" y="150" font-size="11" fill="#52514e">FairPoliticsQA（政治的中立性）</text>
  <rect x="382" y="158" width="280" height="16" rx="3" fill="#e1e0d9"/>
  <rect x="382" y="158" width="140" height="16" rx="3" fill="#008300"/>
  <text x="668" y="171" font-size="11" fill="#0b0b0b" font-weight="700">+22.2%</text>

  <rect x="28" y="204" width="664" height="72" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="228" font-size="12" fill="#52514e">位置づけ：海外の汎用モデルに日本語の追加学習を重ねる従来型ではなく、日本の文化的文脈・政治的中立性を</text>
  <text x="44" y="248" font-size="12" fill="#52514e">最初から設計に組み込む「主権AI」の商用化第一弾。海外モデルへの依存を減らしたい企業の選択肢になる。</text>
</svg>
