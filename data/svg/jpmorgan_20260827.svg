  <text x="24" y="104" font-size="12" fill="#52514e">2025年</text>
  <rect x="140" y="90" width="392" height="24" rx="4" fill="#c3c2b7"/>
  <text x="540" y="107" font-size="13" font-weight="700" fill="#0b0b0b">約178億ドル</text>

  <text x="24" y="144" font-size="12" fill="#52514e">2026年</text>
  <rect x="140" y="130" width="436" height="24" rx="4" fill="#2a78d6"/>
