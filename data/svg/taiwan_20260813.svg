<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="318" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="34" font-size="17" font-weight="700" fill="#0b0b0b">中国・インドネシア海軍、台湾東方海域で合同演習へ</text>

  <!-- timeline -->
  <line x1="50" y1="90" x2="670" y2="90" stroke="#c3c2b7" stroke-width="2"/>

  <circle cx="90" cy="90" r="6" fill="#2a78d6"/>
  <text x="90" y="70" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">8月11日</text>
  <text x="90" y="112" font-size="11" fill="#52514e" text-anchor="middle">中国国防省が</text>
  <text x="90" y="128" font-size="11" fill="#52514e" text-anchor="middle">合同演習を発表</text>

  <circle cx="330" cy="90" r="6" fill="#d03b3b"/>
  <text x="330" y="70" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">8月11日（同日）</text>
  <text x="330" y="112" font-size="11" fill="#52514e" text-anchor="middle">台湾・大陸委員会が</text>
  <text x="330" y="128" font-size="11" fill="#d03b3b" text-anchor="middle">「軍事的挑発」と非難</text>

  <circle cx="600" cy="90" r="6" fill="#898781"/>
  <text x="600" y="70" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">8月中旬</text>
  <text x="600" y="112" font-size="11" fill="#52514e" text-anchor="middle">通信訓練・洋上補給の</text>
  <text x="600" y="128" font-size="11" fill="#52514e" text-anchor="middle">合同演習を実施予定</text>

  <line x1="28" y1="160" x2="692" y2="160" stroke="#c3c2b7"/>

  <rect x="28" y="176" width="320" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="200" font-size="12" font-weight="700" fill="#0b0b0b">演習の内容</text>
  <text x="44" y="222" font-size="11.5" fill="#52514e">・中国海軍とインドネシア海軍の合同演習</text>
  <text x="44" y="242" font-size="11.5" fill="#52514e">・重点は通信訓練と洋上補給</text>
  <text x="44" y="262" font-size="11.5" fill="#52514e">・海域は台湾東方沖、日比の海洋境界</text>
  <text x="44" y="280" font-size="11.5" fill="#52514e">　画定交渉の対象海域とも重なる</text>

  <rect x="372" y="176" width="320" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="388" y="200" font-size="12" font-weight="700" fill="#0b0b0b">台湾側の反応</text>
  <text x="388" y="222" font-size="11.5" fill="#52514e">・大陸委員会が「軍事的挑発行為」</text>
  <text x="388" y="242" font-size="11.5" fill="#52514e">　と強く非難</text>
  <text x="388" y="262" font-size="11.5" fill="#52514e">・北京に危険な行為の即時停止を要求</text>
  <text x="388" y="280" font-size="11.5" fill="#d03b3b">・地域の緊張が改めて上昇</text>
</svg>
