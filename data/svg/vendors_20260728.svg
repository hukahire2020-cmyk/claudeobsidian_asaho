  <text x="525" y="188" font-size="10.5" fill="#898781" text-anchor="middle">2026年7月15日発表・保険金サービス等で活用開始</text>

  <text x="24" y="228" font-size="10.5" fill="#898781">出典: ★NTTデータ公式(7月)／★損保ジャパン公式(7/15)</text>
