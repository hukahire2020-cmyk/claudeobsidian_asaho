  <rect x="30" y="76" width="310" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="185" y="102" font-size="12" fill="#52514e" text-anchor="middle">NTTデータ（食品・飲料・消費財向け）</text>
  <text x="185" y="148" font-size="30" font-weight="700" fill="#2a78d6" text-anchor="middle">約150秒</text>
