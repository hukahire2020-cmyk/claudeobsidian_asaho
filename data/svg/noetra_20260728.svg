<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="278" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">国産AI連合「Noetra」に日立も参画</text>
  <text x="24" y="54" font-size="11" fill="#898781">フィジカルAI向け国産マルチモーダル基盤モデルを官民で開発</text>

  <!-- stat tiles -->
  <g>
    <rect x="30" y="76" width="150" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="105" y="118" font-size="30" font-weight="700" fill="#2a78d6" text-anchor="middle">44社</text>
    <text x="105" y="140" font-size="11" fill="#52514e" text-anchor="middle">が出資</text>
  </g>
  <g>
    <rect x="192" y="76" width="150" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="267" y="112" font-size="24" font-weight="700" fill="#2a78d6" text-anchor="middle">3,873億円</text>
    <text x="267" y="140" font-size="11" fill="#52514e" text-anchor="middle">経産省が2026年度に拠出</text>
  </g>
  <g>
    <rect x="354" y="76" width="150" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="429" y="118" font-size="30" font-weight="700" fill="#008300" text-anchor="middle">1兆円</text>
    <text x="429" y="140" font-size="11" fill="#52514e" text-anchor="middle">2030年度までの総支援規模</text>
  </g>
  <g>
    <rect x="516" y="76" width="174" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="603" y="112" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">中核4社＋日立</text>
    <text x="603" y="132" font-size="10.5" fill="#52514e" text-anchor="middle">ソニー・ソフトバンク</text>
    <text x="603" y="146" font-size="10.5" fill="#52514e" text-anchor="middle">NEC・ホンダ（7/16始動）</text>
    <text x="603" y="160" font-size="10.5" fill="#52514e" text-anchor="middle">＋ 日立が7/17出資参画</text>
  </g>

  <text x="24" y="196" font-size="12.5" fill="#0b0b0b" font-weight="700">経済産業省・NEDO主導「AIロボット・フィジカルAIを見据えたマルチモーダル基盤モデル開発事業」</text>
  <text x="24" y="216" font-size="11" fill="#52514e">産業技術総合研究所（産総研）と共同開発。学習済みモデルの重みは国内の開発者・利活用事業者へ広く提供する方針</text>
  <text x="24" y="252" font-size="10.5" fill="#898781">出典: 経済産業省(6/30)／Noetra公式(7/16)／日立製作所公式(7/17)</text>
</svg>
