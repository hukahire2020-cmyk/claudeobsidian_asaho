<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="38" font-size="17" font-weight="700" fill="#0b0b0b">パナソニック コネクト「ConnectAI」2025年度実績</text>
  <text x="30" y="58" font-size="12" fill="#898781">2026年7月29日発表</text>

  <!-- hero stat -->
  <g>
    <rect x="30" y="80" width="280" height="130" rx="8" fill="#2a78d6" opacity="0.08" stroke="#2a78d6"/>
    <text x="170" y="150" font-size="42" font-weight="700" fill="#2a78d6" text-anchor="middle">78.8万時間</text>
    <text x="170" y="175" font-size="12" fill="#52514e" text-anchor="middle">年間削減時間（前年度から倍増）</text>
    <text x="170" y="195" font-size="11" fill="#898781" text-anchor="middle">総労働時間の3.4%に相当</text>
  </g>

  <!-- comparison bars: 2024 vs 2025 -->
  <g font-size="11" fill="#52514e">
    <text x="330" y="100" font-weight="700" fill="#0b0b0b">年度別削減時間の推移</text>
    <text x="330" y="140">2024年度</text>
    <rect x="400" y="122" width="120" height="22" fill="#c3c2b7"/>
    <text x="530" y="140" fill="#0b0b0b">44.8万時間</text>

    <text x="330" y="180">2025年度</text>
    <rect x="400" y="162" width="212" height="22" fill="#2a78d6"/>
    <text x="622" y="180" fill="#0b0b0b" font-weight="700">78.8万時間</text>
  </g>

  <!-- sub stats -->
  <g font-size="11">
    <rect x="330" y="220" width="170" height="80" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="415" y="255" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">361万回</text>
    <text x="415" y="275" fill="#898781" text-anchor="middle">利用回数（前年度比1.6倍）</text>

    <rect x="512" y="220" width="178" height="80" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="601" y="255" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">61%</text>
    <text x="601" y="275" fill="#898781" text-anchor="middle">月間ユニークユーザー率(+12pt)</text>
  </g>
</svg>
