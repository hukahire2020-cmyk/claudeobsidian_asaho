<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="318" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#0b0b0b">米・イラン軍事衝突再燃（2026年9月5日）</text>

  <rect x="28" y="58" width="205" height="98" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="130" y="82" font-size="12" fill="#52514e" text-anchor="middle">CENTCOMが破壊・無力化</text>
  <text x="130" y="122" font-size="30" font-weight="700" fill="#d03b3b" text-anchor="middle">3隻</text>
  <text x="130" y="142" font-size="10.5" fill="#898781" text-anchor="middle">IRGC系原油タンカー</text>

  <rect x="245" y="58" width="205" height="98" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="347" y="82" font-size="12" fill="#52514e" text-anchor="middle">ブレント原油（週間）</text>
  <text x="347" y="122" font-size="30" font-weight="700" fill="#2a78d6" text-anchor="middle">+7.8%</text>
  <text x="347" y="142" font-size="10.5" fill="#898781" text-anchor="middle">WTIは約+10%</text>

  <rect x="462" y="58" width="230" height="98" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="577" y="82" font-size="12" fill="#52514e" text-anchor="middle">米ディーゼル小売価格</text>
  <text x="577" y="122" font-size="26" font-weight="700" fill="#d03b3b" text-anchor="middle">5.85ドル/gal</text>
  <text x="577" y="142" font-size="10.5" fill="#898781" text-anchor="middle">史上最高値</text>

  <text x="28" y="186" font-size="13" font-weight="700" fill="#0b0b0b">経緯（因果チェーン）</text>
  <g font-size="11" text-anchor="middle">
    <rect x="28" y="198" width="200" height="46" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="128" y="217" fill="#0b0b0b">IRGCが米艦艇2隻に</text>
    <text x="128" y="232" fill="#0b0b0b">弾道ミサイル発射</text>

    <rect x="252" y="198" width="200" height="46" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="352" y="217" fill="#0b0b0b">米艦艇は回避、</text>
    <text x="352" y="232" fill="#0b0b0b">人的被害なし</text>

    <rect x="476" y="198" width="216" height="46" rx="8" fill="#fcfcfb" stroke="#d03b3b" stroke-width="1.5"/>
    <text x="584" y="217" fill="#d03b3b" font-weight="700">CENTCOMが報復、</text>
    <text x="584" y="232" fill="#d03b3b" font-weight="700">タンカー3隻を攻撃</text>
  </g>
  <path d="M228 221 h20 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>
  <path d="M452 221 h20 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>

  <rect x="28" y="266" width="664" height="30" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="42" y="285" font-size="11" fill="#898781">出典: CENTCOM公式・CNN・Al Jazeera（2026/9/5）</text>
