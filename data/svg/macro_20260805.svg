<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="34" font-size="17" font-weight="700" fill="#0b0b0b">円は155〜157円台で高止まり、財政では消費減税が新たな火種に</text>
  <text x="28" y="52" font-size="10" fill="#898781">日経平均は8/4終値63,957.53円（前日比+202.63円・+0.32%）</text>

  <rect x="28" y="66" width="320" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="90" font-size="12" font-weight="700" fill="#2a78d6">為替：介入後も一進一退</text>
  <text x="44" y="114" font-size="11" fill="#52514e">7/31協調介入で164円台→155円台へ急伸したが、</text>
  <text x="44" y="134" font-size="11" fill="#52514e">8/4アジア時間は157円台まで戻す場面も。</text>
  <text x="44" y="154" font-size="11" fill="#52514e">財務省は追加介入も辞さない姿勢を維持。</text>
  <text x="44" y="174" font-size="10" fill="#898781">FOMC次回9/15-16／日銀次回9/17-18</text>

  <rect x="372" y="66" width="320" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="388" y="90" font-size="12" font-weight="700" fill="#d03b3b">財政：消費減税が新変数に</text>
  <text x="388" y="114" font-size="11" fill="#52514e">本日にも食料品消費税1%への</text>
  <text x="388" y="134" font-size="11" fill="#52514e">引き下げが閣議決定へ（詳細は1面①）。</text>
  <text x="388" y="154" font-size="11" fill="#52514e">財源は赤字国債に頼らない方針だが、</text>
  <text x="388" y="174" font-size="10" fill="#898781">財政悪化観測が円売り材料になり得る</text>

  <rect x="26" y="200" width="670" height="60" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="42" y="224" font-size="12" fill="#0b0b0b" font-weight="700">役員と話すときの要点：</text>
  <text x="42" y="244" font-size="12" fill="#0b0b0b">「為替は介入で一服したが、今度は税制の減税決定が財政規律への懸念として円相場に跳ね返る番」</text>
</svg>
