<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="36" font-size="17" font-weight="700" fill="#0b0b0b">デジタルハリウッド大学「全学AI基盤」運用開始</text>
  <text x="30" y="56" font-size="12" fill="#898781">2026年9月1日</text>

  <g font-size="11">
    <rect x="30" y="80" width="200" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="130" y="115" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">対象</text>
    <text x="130" y="138" fill="#52514e" text-anchor="middle">全学生・全教職員</text>
    <text x="130" y="156" fill="#898781" text-anchor="middle">テキスト・画像・映像・音楽</text>

    <rect x="250" y="80" width="200" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="350" y="115" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">同時稼働</text>
    <text x="350" y="138" fill="#52514e" text-anchor="middle">「キャンパスポータル」</text>
    <text x="350" y="156" fill="#898781" text-anchor="middle">出席・授業・対話・振り返り一体化</text>

    <rect x="470" y="80" width="220" height="90" rx="8" fill="#2a78d6" opacity="0.08" stroke="#2a78d6"/>
    <text x="580" y="115" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">プライバシー設計</text>
    <text x="580" y="138" fill="#52514e" text-anchor="middle">対話履歴・ノートは</text>
    <text x="580" y="156" fill="#52514e" text-anchor="middle">学生本人のみ閲覧可</text>
  </g>

  <rect x="30" y="195" width="660" height="65" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="222" font-size="12" fill="#52514e" text-anchor="middle">「AIツールの配布」から「対話履歴を含む専用基盤の自前運用」へ</text>
  <text x="360" y="242" font-size="11" fill="#898781" text-anchor="middle">教育・自治体向け提案でもプライバシー設計の説明力が問われる</text>
</svg>
