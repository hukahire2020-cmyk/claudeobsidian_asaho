<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="358" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#0b0b0b">米国、ICC赤根所長ら9裁判官・検察官3人に制裁</text>
  <text x="24" y="60" font-size="12" fill="#898781">制裁発表：2026年8月19日　／　赤根所長の会見：8月26日</text>

  <!-- timeline -->
  <line x1="60" y1="110" x2="660" y2="110" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="120" cy="110" r="7" fill="#d03b3b"/>
  <text x="120" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">8/19</text>
  <text x="120" y="132" text-anchor="middle" font-size="11" fill="#52514e">制裁発表</text>
  <text x="120" y="148" text-anchor="middle" font-size="11" fill="#52514e">資産凍結</text>

  <circle cx="380" cy="110" r="7" fill="#2a78d6"/>
  <text x="380" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">8/26</text>
  <text x="380" y="132" text-anchor="middle" font-size="11" fill="#52514e">赤根所長が</text>
  <text x="380" y="148" text-anchor="middle" font-size="11" fill="#52514e">制裁後初の会見</text>

  <circle cx="620" cy="110" r="7" fill="#898781"/>
  <text x="620" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">今後</text>
  <text x="620" y="132" text-anchor="middle" font-size="11" fill="#52514e">日本政府の対応</text>
  <text x="620" y="148" text-anchor="middle" font-size="11" fill="#52514e">が焦点に</text>

  <line x1="24" y1="176" x2="696" y2="176" stroke="#e1e0d9"/>

  <g font-size="13" fill="#0b0b0b">
    <rect x="24" y="192" width="326" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="40" y="214" font-size="12" fill="#52514e">制裁対象</text>
    <text x="40" y="240" font-size="18" font-weight="700" fill="#d03b3b">裁判官9人＋検察官3人</text>
    <text x="40" y="256" font-size="11" fill="#898781">18人の裁判官の半数、赤根所長を含む</text>

    <rect x="370" y="192" width="326" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="386" y="214" font-size="12" fill="#52514e">日本の立場</text>
    <text x="386" y="240" font-size="16" font-weight="700" fill="#0b0b0b">「大変残念」にとどめる</text>
    <text x="386" y="256" font-size="11" fill="#898781">赤根氏「加盟国は日本をリーダーとして見ている」</text>
  </g>

  <text x="24" y="304" font-size="12" fill="#52514e">日本はICC最大の分担金拠出国 —— 対米関係とICC支持の間で立場表明を迫られる構図</text>

  <text x="24" y="336" font-size="11" fill="#898781">出典：日本経済新聞（8月21日・8月25日）／NHKニュース（8月26日）</text>
</svg>
