<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="36" font-size="17" font-weight="700" fill="#0b0b0b">AMD×Anthropic 戦略提携（2026/7/22発表）</text>
  <text x="24" y="56" font-size="12" fill="#52514e">AI計算基盤の調達構造にNVIDIA以外の選択肢が加わる</text>

  <g>
    <rect x="24" y="76" width="204" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="126" y="106" font-size="12" fill="#52514e" text-anchor="middle">AMDの出資額</text>
    <text x="126" y="150" font-size="30" font-weight="700" fill="#2a78d6" text-anchor="middle">最大50億ドル</text>
    <text x="126" y="172" font-size="11" fill="#898781" text-anchor="middle">達成条件付き</text>
  </g>

  <g>
    <rect x="258" y="76" width="204" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="360" y="106" font-size="12" fill="#52514e" text-anchor="middle">GPU展開規模</text>
    <text x="360" y="150" font-size="30" font-weight="700" fill="#2a78d6" text-anchor="middle">最大2GW</text>
    <text x="360" y="172" font-size="11" fill="#898781" text-anchor="middle">AMD Instinct MI450シリーズ</text>
  </g>

  <g>
    <rect x="492" y="76" width="204" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="594" y="106" font-size="12" fill="#52514e" text-anchor="middle">導入開始</text>
    <text x="594" y="150" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="middle">2027年前半</text>
    <text x="594" y="172" font-size="11" fill="#898781" text-anchor="middle">最初の1GW分から</text>
  </g>

  <!-- structure -->
  <g transform="translate(24,220)">
    <rect x="0" y="0" width="300" height="90" rx="8" fill="#f9f9f7" stroke="#c3c2b7"/>
    <text x="150" y="26" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">AMD → Anthropic</text>
    <text x="150" y="48" font-size="11.5" fill="#52514e" text-anchor="middle">Heliosラックスケール（MI455X GPU・</text>
    <text x="150" y="65" font-size="11.5" fill="#52514e" text-anchor="middle">EPYC「Venice」CPU・Pensando）を提供</text>

    <text x="316" y="50" font-size="20" fill="#898781">⇄</text>

    <rect x="348" y="0" width="324" height="90" rx="8" fill="#f9f9f7" stroke="#c3c2b7"/>
    <text x="510" y="26" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">Anthropic → AMD</text>
    <text x="510" y="48" font-size="11.5" fill="#52514e" text-anchor="middle">数百億ドル規模のAIサーバーチップを</text>
    <text x="510" y="65" font-size="11.5" fill="#52514e" text-anchor="middle">契約期間中に調達</text>
  </g>

  <text x="24" y="342" font-size="12.5" fill="#52514e">論点: NVIDIA一強だった調達構造に、価格交渉力を持てる現実的な代替肢が育ち始めた。</text>

  <text x="24" y="364" font-size="10.5" fill="#898781">出典: AMD公式(7/22)・CNBC(7/22)</text>
</svg>
