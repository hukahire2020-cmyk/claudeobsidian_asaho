<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">競争軸の広がり：モデル → 運用基盤 → ハードウェア</text>
  <text x="24" y="54" font-size="12" fill="#898781">2026年7月の動き</text>

  <line x1="50" y1="110" x2="670" y2="110" stroke="#c3c2b7" stroke-width="2"/>

  <g>
    <circle cx="120" cy="110" r="5" fill="#2a78d6"/>
    <text x="120" y="92" font-size="11" fill="#52514e" text-anchor="middle">7/14</text>
    <text x="120" y="135" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700">OpenAI</text>
    <text x="120" y="152" font-size="11" fill="#52514e" text-anchor="middle">初ハードウェア</text>
    <text x="120" y="167" font-size="10" fill="#898781" text-anchor="middle">画面なしAIスピーカー</text>
  </g>

  <g>
    <circle cx="360" cy="110" r="5" fill="#008300"/>
    <text x="360" y="92" font-size="11" fill="#52514e" text-anchor="middle">7/24</text>
    <text x="360" y="135" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700">Anthropic</text>
    <text x="360" y="152" font-size="11" fill="#52514e" text-anchor="middle">Opus 4.7 fast mode廃止</text>
    <text x="360" y="167" font-size="10" fill="#898781" text-anchor="middle">Sonnet 5が既定モデルに</text>
  </g>

  <g>
    <circle cx="600" cy="110" r="5" fill="#2a78d6"/>
    <text x="600" y="92" font-size="11" fill="#52514e" text-anchor="middle">2027年〜</text>
    <text x="600" y="135" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700">OpenAIスピーカー</text>
    <text x="600" y="152" font-size="11" fill="#52514e" text-anchor="middle">発売予定</text>
    <text x="600" y="167" font-size="10" fill="#898781" text-anchor="middle">io・LoveFrom共同開発</text>
  </g>

  <rect x="24" y="200" width="672" height="105" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="225" font-size="12" fill="#0b0b0b" font-weight="700">OpenAIの初ハードウェア: カメラ・センサー搭載、一部が自ら動く機構</text>
  <text x="44" y="245" font-size="11" fill="#52514e">2025年に約65億ドルで買収した「io」と、ジョニー・アイブ氏の「LoveFrom」が共同開発</text>
  <text x="44" y="265" font-size="11" fill="#52514e">メールなど個人情報を読み込み、持ち主への理解を時間をかけて深める設計と報じられる</text>
  <text x="44" y="288" font-size="10" fill="#898781">出典: Bloomberg(7/14)</text>

  <text x="24" y="325" font-size="10" fill="#898781">「アプリの中のAI」から「生活空間に置かれるAIデバイス」へ競争軸が拡大</text>
</svg>
