<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#0b0b0b">Google「Gemini 3.6 Flash」ファミリー（7/21発表）— 安さ・速さ・エージェント特化で三方向</text>

  <rect x="28" y="58" width="212" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="134" y="82" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Gemini 3.6 Flash</text>
  <text x="134" y="102" font-size="11" fill="#52514e" text-anchor="middle">主力モデル</text>
  <text x="134" y="130" font-size="12" fill="#0b0b0b" text-anchor="middle">入力 $1.50 / 出力 $7.50</text>
  <text x="134" y="148" font-size="12" fill="#0b0b0b" text-anchor="middle">（100万トークンあたり）</text>
  <text x="134" y="170" font-size="10.5" fill="#898781" text-anchor="middle">出力トークン消費 前世代比17%減</text>

  <rect x="254" y="58" width="212" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="82" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Gemini 3.5 Flash-Lite</text>
  <text x="360" y="102" font-size="11" fill="#52514e" text-anchor="middle">最速・大量処理向け</text>
  <text x="360" y="130" font-size="12" fill="#0b0b0b" text-anchor="middle">入力 $0.30 / 出力 $2.50</text>
  <text x="360" y="148" font-size="12" fill="#0b0b0b" text-anchor="middle">（100万トークンあたり）</text>
  <text x="360" y="170" font-size="10.5" fill="#898781" text-anchor="middle">秒間350トークンの高速処理</text>

  <rect x="480" y="58" width="212" height="130" rx="8" fill="#f9f9f7" stroke="#d03b3b"/>
  <text x="586" y="82" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Gemini 3.5 Flash Cyber</text>
  <text x="586" y="102" font-size="11" fill="#52514e" text-anchor="middle">脆弱性の検出・修正特化</text>
  <text x="586" y="140" font-size="13" fill="#d03b3b" text-anchor="middle" font-weight="700">提供先を政府機関・</text>
  <text x="586" y="158" font-size="13" fill="#d03b3b" text-anchor="middle" font-weight="700">認定パートナーに限定</text>
  <text x="586" y="176" font-size="10.5" fill="#898781" text-anchor="middle">悪用リスクを踏まえた措置</text>

  <rect x="28" y="204" width="664" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="42" y="228" font-size="12.5" font-weight="700" fill="#0b0b0b">同じ週の動き: OpenAI「ChatGPT for Small Business」（7/21発表）</text>
  <text x="42" y="250" font-size="12" fill="#52514e">GPT-5.6搭載の多段階エージェント「ChatGPT Work」を軸に、中小企業の会計・マーケ・EC・社内対応を支援</text>
  <text x="42" y="266" font-size="10.5" fill="#898781">大企業だけでなく中小企業もエージェントAIの主戦場になりつつある</text>
</svg>
