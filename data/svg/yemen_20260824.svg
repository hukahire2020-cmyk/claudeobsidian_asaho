<svg viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="458" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="38" font-size="17" font-weight="700" fill="#0b0b0b">イエメン内戦再燃リスク——2022年停戦以来「最も深刻」</text>
  <text x="30" y="58" font-size="12" fill="#898781">経緯タイムライン(フーシ派 vs サウジ支援イエメン政府)</text>

  <line x1="110" y1="90" x2="110" y2="410" stroke="#c3c2b7" stroke-width="2"/>

  <!-- event 1 -->
  <circle cx="110" cy="100" r="6" fill="#2a78d6"/>
  <text x="130" y="97" font-size="12" font-weight="700" fill="#0b0b0b">2022年</text>
  <text x="130" y="115" font-size="12" fill="#52514e">国連仲介による停戦協定が成立</text>

  <!-- event 2 -->
  <circle cx="110" cy="170" r="6" fill="#d03b3b"/>
  <text x="130" y="167" font-size="12" font-weight="700" fill="#0b0b0b">2026年7月</text>
  <text x="130" y="185" font-size="12" fill="#52514e">フーシ派がサウジ・アブハ空港を攻撃</text>
  <text x="130" y="201" font-size="12" fill="#52514e">停戦が事実上崩壊</text>

  <!-- event 3 -->
  <circle cx="110" cy="250" r="6" fill="#d03b3b"/>
  <text x="130" y="247" font-size="12" font-weight="700" fill="#0b0b0b">8月9日</text>
  <text x="130" y="265" font-size="12" fill="#52514e">モカ港のサウジ支援部隊とジザン製油所を</text>
  <text x="130" y="281" font-size="12" fill="#52514e">ミサイル・ドローンで攻撃——死者11人・負傷32人</text>

  <!-- event 4 -->
  <circle cx="110" cy="320" r="6" fill="#d03b3b"/>
  <text x="130" y="317" font-size="12" font-weight="700" fill="#0b0b0b">8月11日</text>
  <text x="130" y="335" font-size="12" fill="#52514e">タンザニア船籍の商船Tihamahを紅海で攻撃</text>
  <text x="130" y="351" font-size="12" fill="#52514e">死者6人</text>

  <!-- event 5 -->
  <circle cx="110" cy="390" r="7" fill="#2a78d6"/>
  <text x="130" y="387" font-size="12" font-weight="700" fill="#0b0b0b">8月13日</text>
  <text x="130" y="405" font-size="12" fill="#52514e">国連イエメン特使グルンドベルグ氏が安保理で</text>
  <text x="130" y="421" font-size="12" fill="#52514e">「2022年停戦以来最も深刻なリスク」と警告</text>

  <rect x="500" y="90" width="190" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="516" y="115" font-size="11" fill="#898781">紅海通過の世界貿易額</text>
  <text x="516" y="142" font-size="22" font-weight="700" fill="#d03b3b">12〜15%</text>
  <text x="516" y="160" font-size="11" fill="#898781">(金額で1兆ドル超)</text>
  <text x="516" y="185" font-size="11" fill="#898781">8月の死者数(3件合計)</text>
  <text x="516" y="207" font-size="18" font-weight="700" fill="#0b0b0b">17人以上</text>
</svg>
