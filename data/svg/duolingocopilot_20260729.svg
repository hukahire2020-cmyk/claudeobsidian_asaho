<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="358" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="36" font-size="17" font-weight="700" fill="#0b0b0b">Duolingo × GitHub Copilot（海外事例）</text>
  <text x="24" y="56" font-size="12" fill="#52514e">「AIが同僚」体制で400超のマイクロサービスを回す</text>

  <g>
    <rect x="24" y="76" width="204" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="126" y="106" font-size="12" fill="#52514e" text-anchor="middle">開発速度</text>
    <text x="126" y="150" font-size="30" font-weight="700" fill="#008300" text-anchor="middle">+25%</text>
    <text x="126" y="172" font-size="11" fill="#898781" text-anchor="middle">不慣れなリポジトリでも</text>
  </g>

  <g>
    <rect x="258" y="76" width="204" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="360" y="106" font-size="12" fill="#52514e" text-anchor="middle">コードレビュー時間</text>
    <text x="360" y="150" font-size="26" font-weight="700" fill="#008300" text-anchor="middle">3h → 1h</text>
    <text x="360" y="172" font-size="11" fill="#898781" text-anchor="middle">中央値ターンアラウンド -67%</text>
  </g>

  <g>
    <rect x="492" y="76" width="204" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="594" y="106" font-size="12" fill="#52514e" text-anchor="middle">プルリクエスト数</text>
    <text x="594" y="150" font-size="30" font-weight="700" fill="#008300" text-anchor="middle">+70%</text>
    <text x="594" y="172" font-size="11" fill="#898781" text-anchor="middle">300人超のエンジニアで運用</text>
  </g>

  <text x="24" y="232" font-size="12.5" fill="#52514e">論点: ソフトウェア開発は「AIが補助する」段階から「開発フローに組み込まれる」段階へ。</text>
  <text x="24" y="254" font-size="12.5" fill="#52514e">開発生産性を測る具体的指標（速度・レビュー時間・PR数）が商談の論点になる。</text>

  <text x="24" y="330" font-size="10.5" fill="#898781">出典: GitHub公式カスタマーストーリー（Duolingo事例）</text>
</svg>
