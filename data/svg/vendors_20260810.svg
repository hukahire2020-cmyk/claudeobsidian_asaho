<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">国内ベンダー動向：調達交渉の自動化と、法人向けAIエージェントの夏投入</text>

  <rect x="40" y="60" width="300" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="60" y="86" font-size="13.5" font-weight="700" fill="#0b0b0b">NEC 調達交渉AIエージェント</text>
  <text x="60" y="112" font-size="22" font-weight="700" fill="#2a78d6">合意達成率95%</text>
  <text x="60" y="134" font-size="12.5" fill="#52514e">約1,300品目の部品調達交渉で</text>
  <text x="60" y="151" font-size="12.5" fill="#52514e">交渉時間を数日→約80秒に短縮</text>
  <text x="60" y="170" font-size="11.5" fill="#898781">2025/12商用化・NECグループへ導入</text>

  <rect x="380" y="60" width="300" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="400" y="86" font-size="13.5" font-weight="700" fill="#0b0b0b">LINEヤフー「Agent i Biz」</text>
  <text x="400" y="112" font-size="18" font-weight="700" fill="#2a78d6">2026年8月提供開始</text>
  <text x="400" y="134" font-size="12.5" fill="#52514e">法人向けAIエージェント。戦略</text>
  <text x="400" y="151" font-size="12.5" fill="#52514e">策定〜施策実行を一気通貫で支援</text>
  <text x="400" y="170" font-size="11.5" fill="#898781">2026/4/20発表（「Agent i」法人版）</text>

  <text x="40" y="225" font-size="12.5" fill="#0b0b0b">個社の交渉・調整業務を丸ごと引き受ける専用AIから、企業が自社チャネルに</text>
  <text x="40" y="248" font-size="12.5" fill="#0b0b0b">組み込める汎用エージェント基盤まで、提供形態の幅が広がっている。</text>
</svg>
