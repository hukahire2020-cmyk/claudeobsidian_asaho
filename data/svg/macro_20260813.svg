<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="34" font-size="17" font-weight="700" fill="#0b0b0b">米CPI鈍化→利上げ観測後退→日経平均3日続伸</text>

  <rect x="20" y="54" width="150" height="72" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="95" y="80" font-size="11" fill="#52514e" text-anchor="middle">米7月CPI</text>
  <text x="95" y="96" font-size="11" fill="#52514e" text-anchor="middle">前年比+3.4%（8/12）</text>
  <text x="95" y="114" font-size="10" fill="#2a78d6" text-anchor="middle">予想通り・やや鈍化</text>

  <text x="182" y="94" font-size="18" fill="#898781">→</text>

  <rect x="196" y="54" width="150" height="72" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="271" y="80" font-size="11" fill="#52514e" text-anchor="middle">FRBの9月</text>
  <text x="271" y="96" font-size="11" fill="#52514e" text-anchor="middle">利上げ観測が後退</text>
  <text x="271" y="114" font-size="10" fill="#52514e" text-anchor="middle">前日の米ハイテク株高</text>

  <text x="358" y="94" font-size="18" fill="#898781">→</text>

  <rect x="372" y="54" width="150" height="72" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="447" y="80" font-size="11" fill="#52514e" text-anchor="middle">AI・半導体株に</text>
  <text x="447" y="96" font-size="11" fill="#52514e" text-anchor="middle">資金流入（東京市場）</text>
  <text x="447" y="114" font-size="10" fill="#52514e" text-anchor="middle">8/13の東京市場</text>

  <text x="534" y="94" font-size="18" fill="#898781">→</text>

  <rect x="548" y="54" width="144" height="72" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="620" y="80" font-size="11" fill="#52514e" text-anchor="middle">日経平均</text>
  <text x="620" y="98" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">3日続伸</text>
  <text x="620" y="116" font-size="10" fill="#52514e" text-anchor="middle">784円高</text>

  <line x1="28" y1="146" x2="692" y2="146" stroke="#c3c2b7"/>

  <text x="28" y="172" font-size="12" font-weight="700" fill="#0b0b0b">日経平均株価</text>
  <text x="28" y="196" font-size="22" font-weight="700" fill="#2a78d6">68,308.59円</text>
  <text x="28" y="214" font-size="11" fill="#898781">8/13終値（前日比+784.53円・+1.16%）</text>
  <text x="28" y="230" font-size="11" fill="#898781">約1か月ぶりに68,000円台を回復／TOPIXは7日続伸で最高値更新</text>

  <text x="400" y="172" font-size="12" font-weight="700" fill="#0b0b0b">ドル円</text>
  <text x="400" y="196" font-size="22" font-weight="700" fill="#2a78d6">159円台半ば</text>
  <text x="400" y="214" font-size="11" fill="#898781">8/13の東京市場で推移</text>
  <text x="400" y="232" font-size="11" fill="#898781">日銀は9月利上げ観測が根強く、銀行株も堅調</text>

  <rect x="28" y="250" width="664" height="66" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="274" font-size="12" font-weight="700" fill="#0b0b0b">役員と話すときの要点：</text>
  <text x="44" y="296" font-size="11.5" fill="#52514e">「米国は利上げ休止の方向、日本は逆に利上げに動きそう——AI・半導体株が買われる一方、</text>
  <text x="44" y="312" font-size="11.5" fill="#52514e">金利差の縮小観測は円高圧力にもなり得る局面」</text>
</svg>
