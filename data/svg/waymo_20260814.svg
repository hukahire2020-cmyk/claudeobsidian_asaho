<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="258" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">Waymo — 週間走行件数と目標（2026年）</text>
  <text x="24" y="54" font-size="12" fill="#52514e">米国6都市以上で展開中・国際展開は東京・ロンドンが最初期候補</text>

  <!-- progress bar: current vs target -->
  <text x="24" y="90" font-size="12" fill="#52514e">現在（週間・7月時点）</text>
  <rect x="220" y="78" width="152" height="18" fill="#a9c8e8"/>
  <text x="384" y="92" font-size="13" font-weight="700" fill="#0b0b0b">約50万件/週</text>

  <text x="24" y="126" font-size="12" fill="#52514e">2026年内目標</text>
  <rect x="220" y="114" width="304" height="18" fill="#2a78d6"/>
  <text x="536" y="128" font-size="13" font-weight="700" fill="#2a78d6">100万件/週</text>
  <line x1="220" y1="74" x2="220" y2="136" stroke="#e1e0d9"/>

  <!-- city stat tiles -->
  <rect x="24" y="156" width="210" height="82" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="129" y="182" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="middle">6+都市</text>
  <text x="129" y="204" font-size="11.5" fill="#52514e" text-anchor="middle">米国内サービス展開エリア</text>
  <text x="129" y="222" font-size="10.5" fill="#898781" text-anchor="middle">7/8に4都市同時追加</text>

  <rect x="248" y="156" width="210" height="82" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="353" y="182" font-size="26" font-weight="700" fill="#008300" text-anchor="middle">20+都市</text>
  <text x="353" y="204" font-size="11.5" fill="#52514e" text-anchor="middle">2026年中の追加展開計画</text>
  <text x="353" y="222" font-size="10.5" fill="#898781" text-anchor="middle">グローバル含む</text>

  <rect x="472" y="156" width="224" height="82" rx="8" fill="#eef4fb" stroke="#c3c2b7"/>
  <text x="584" y="182" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">東京・ロンドン</text>
  <text x="584" y="204" font-size="11.5" fill="#52514e" text-anchor="middle">最初期の国際展開候補地</text>
  <text x="584" y="222" font-size="10.5" fill="#898781" text-anchor="middle">東京は既存タクシー事業者と連携検討</text>
</svg>
