<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="38" font-size="17" font-weight="700" fill="#0b0b0b">🌍 建設業界: 米大手ゼネコンもAI現場効率化が本番稼働</text>
  <text x="30" y="58" font-size="12" fill="#898781">3社の取り組み比較</text>

  <rect x="30" y="85" width="200" height="270" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="46" y="112" font-size="13" font-weight="700" fill="#2a78d6">Turner Construction</text>
  <text x="46" y="140" font-size="11" fill="#52514e">AIセンサー「CraneView」を</text>
  <text x="46" y="156" font-size="11" fill="#52514e">クレーンに設置し稼働を</text>
  <text x="46" y="172" font-size="11" fill="#52514e">リアルタイム可視化</text>
  <text x="46" y="200" font-size="11" fill="#898781">サンディエゴの現場では</text>
  <text x="46" y="216" font-size="11" fill="#898781">クレーン1台を早期撤収し</text>
  <text x="46" y="232" font-size="11" fill="#898781">コスト・工期を削減</text>
  <text x="46" y="264" font-size="11" fill="#898781">安全AI「SafeT Coach」を</text>
  <text x="46" y="280" font-size="11" fill="#898781">業界に無償公開</text>

  <rect x="260" y="85" width="200" height="270" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="276" y="112" font-size="13" font-weight="700" fill="#2a78d6">Bechtel</text>
  <text x="276" y="140" font-size="11" fill="#52514e">AIで数百万通りの工程</text>
  <text x="276" y="156" font-size="11" fill="#52514e">パターンをシミュレーション</text>
  <text x="276" y="184" font-size="11" fill="#898781">大型半導体工場の建設で</text>
  <text x="276" y="200" font-size="11" fill="#898781">トレード順序のリスクを</text>
  <text x="276" y="216" font-size="11" fill="#898781">数週間前に検知し計画変更</text>

  <rect x="490" y="85" width="200" height="270" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="506" y="112" font-size="13" font-weight="700" fill="#2a78d6">Skanska</text>
  <text x="506" y="140" font-size="11" fill="#52514e">AIロボット「Didge」が</text>
  <text x="506" y="156" font-size="11" fill="#52514e">現場画像を自動記録・分析</text>
  <text x="506" y="184" font-size="11" fill="#898781">技術者は検査・記録作業から</text>
  <text x="506" y="200" font-size="11" fill="#898781">解放され、高付加価値業務に</text>
  <text x="506" y="216" font-size="11" fill="#898781">集中できる体制へ</text>

  <text x="30" y="380" font-size="10" fill="#898781">△まとめ系記事による各社事例紹介の集約。個別数値は各社公式資料での確認を推奨</text>
</svg>
