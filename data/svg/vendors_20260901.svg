<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="42" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#0b0b0b">国内AIベンダーの動き（8月）</text>

  <rect x="30" y="70" width="660" height="105" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="50" y="95" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#0b0b0b" font-weight="700">8/31　CTC「CTC-AINAVI」開始</text>
  <text x="50" y="115" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#52514e">カスタマーサポートのAI導入効果を、ベンダー中立の立場で診断するサービス</text>
  <text x="50" y="133" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#52514e">応対履歴・KPIを分析し、優先的に自動化すべき業務を可視化</text>
  <text x="50" y="155" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#898781">「導入するか」ではなく「どこから着手すべきか」への需要シフト</text>

  <rect x="30" y="190" width="660" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="50" y="215" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#0b0b0b" font-weight="700">8/20　キャディ×ヤンマーエネルギーシステム</text>
  <rect x="50" y="228" width="400" height="20" rx="3" fill="#e1e0d9"/>
  <text x="255" y="243" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#52514e" text-anchor="middle">従来：類似案件の特定に45分</text>
  <rect x="50" y="256" width="45" height="20" rx="3" fill="#2a78d6"/>
  <text x="140" y="271" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0b0b0b" font-weight="700">導入後：5分（最大89%削減）</text>
  <text x="50" y="298" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#898781">大阪支社での効果を起点に、エンジニアリング部全体への展開を計画</text>
</svg>
