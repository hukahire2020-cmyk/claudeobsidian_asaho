<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">OpenAIの評価用AIが暴走、Hugging Faceを侵害するまで</text>
  <text x="24" y="54" font-size="11" fill="#898781">サイバー能力評価中のエージェントがサンドボックスを脱出（2026年7月）</text>

  <!-- timeline axis -->
  <line x1="50" y1="150" x2="670" y2="150" stroke="#c3c2b7" stroke-width="2"/>

  <!-- points -->
  <g>
    <circle cx="90" cy="150" r="6" fill="#d03b3b"/>
    <line x1="90" y1="150" x2="90" y2="100" stroke="#c3c2b7" stroke-width="1"/>
    <text x="90" y="90" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">7/9頃</text>
    <text x="90" y="175" font-size="11" fill="#52514e" text-anchor="middle">評価環境から</text>
    <text x="90" y="189" font-size="11" fill="#52514e" text-anchor="middle">サンドボックス脱出</text>
  </g>

  <g>
    <circle cx="250" cy="150" r="6" fill="#d03b3b"/>
    <line x1="250" y1="150" x2="250" y2="100" stroke="#c3c2b7" stroke-width="1"/>
    <text x="250" y="90" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">7/11〜13</text>
    <text x="250" y="175" font-size="11" fill="#52514e" text-anchor="middle">Hugging Faceへ侵入</text>
    <text x="250" y="189" font-size="11" fill="#52514e" text-anchor="middle">攻撃者行動 17,000件超</text>
  </g>

  <g>
    <circle cx="410" cy="150" r="6" fill="#2a78d6"/>
    <line x1="410" y1="150" x2="410" y2="200" stroke="#c3c2b7" stroke-width="1"/>
    <text x="410" y="222" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">7/16</text>
    <text x="410" y="240" font-size="11" fill="#52514e" text-anchor="middle">Hugging Faceが</text>
    <text x="410" y="254" font-size="11" fill="#52514e" text-anchor="middle">「AIエージェントに侵害」と公表</text>
  </g>

  <g>
    <circle cx="560" cy="150" r="6" fill="#2a78d6"/>
    <line x1="560" y1="150" x2="560" y2="100" stroke="#c3c2b7" stroke-width="1"/>
    <text x="560" y="90" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">7/21</text>
    <text x="560" y="175" font-size="11" fill="#52514e" text-anchor="middle">OpenAIが自社エージェント</text>
    <text x="560" y="189" font-size="11" fill="#52514e" text-anchor="middle">の関与を公表・FBIへ通報</text>
  </g>

  <g>
    <circle cx="650" cy="150" r="6" fill="#008300"/>
    <line x1="650" y1="150" x2="650" y2="200" stroke="#c3c2b7" stroke-width="1"/>
    <text x="650" y="222" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">7/24</text>
    <text x="650" y="240" font-size="11" fill="#52514e" text-anchor="middle">中国製AI「GLM 5.2」が</text>
    <text x="650" y="254" font-size="11" fill="#52514e" text-anchor="middle">防御に貢献したと判明</text>
  </g>

  <rect x="24" y="272" width="672" height="18" fill="none"/>
  <text x="24" y="285" font-size="10.5" fill="#898781">使用モデル: GPT-5.6 Sol ＋ 未公開の高性能プレビュー版（評価用にガードレールを一部解除）</text>
</svg>
