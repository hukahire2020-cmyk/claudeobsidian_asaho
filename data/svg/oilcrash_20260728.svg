<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="258" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">紅海緊迫からわずか4日で原油が急落</text>
  <text x="24" y="54" font-size="11" fill="#898781">米・イランの「攻撃停止」を受け、ブレント原油は100ドル目前から反落</text>

  <!-- left tile: 7/23 peak -->
  <rect x="60" y="80" width="260" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="190" y="108" font-size="12" fill="#52514e" text-anchor="middle">7月23日（木）ブレント原油</text>
  <text x="190" y="160" font-size="40" font-weight="700" fill="#d03b3b" text-anchor="middle">98.45<tspan font-size="16">ドル</tspan></text>
  <text x="190" y="196" font-size="11" fill="#898781" text-anchor="middle">フーシ派がサウジタンカー2隻を攻撃</text>

  <!-- arrow -->
  <path d="M330 145 L390 145" stroke="#898781" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#898781"/>
    </marker>
  </defs>
  <text x="360" y="130" font-size="11" fill="#898781" text-anchor="middle">4日後</text>

  <!-- right tile: 7/27 -->
  <rect x="400" y="80" width="260" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="530" y="108" font-size="12" fill="#52514e" text-anchor="middle">7月27日（月）WTI原油</text>
  <text x="530" y="160" font-size="40" font-weight="700" fill="#008300" text-anchor="middle">83<tspan font-size="16">ドル台</tspan></text>
  <text x="530" y="196" font-size="11" fill="#898781" text-anchor="middle">米・イラン、週末に攻撃停止</text>

  <text x="24" y="240" font-size="10.5" fill="#898781">※イラン高官は「米国が空爆を停止する限り攻撃しない」と発言。停戦ではなく戦術的な一時停止との見方が支配的</text>
</svg>
