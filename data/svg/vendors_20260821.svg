  <text x="386" y="208" font-size="11" fill="#52514e">「操作・エラー対応に時間がかかる」</text>
  <text x="386" y="228" font-size="11" fill="#52514e">「環境変化で既存シナリオの保守が難しい」</text>

  <text x="24" y="278" font-size="10.5" fill="#898781">出典: NTT-AT公式(8/19)</text>
