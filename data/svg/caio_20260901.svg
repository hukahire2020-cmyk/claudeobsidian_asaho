<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="42" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#0b0b0b">アップル引越センター、社長直下にCAIOを新設</text>
  <text x="30" y="64" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#898781">労働集約型の引越し業界でも「AIネイティブ」段階へ</text>

  <rect x="60" y="95" width="270" height="180" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="195" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="middle">2026年5月　就任</text>
  <text x="195" y="160" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#52514e" text-anchor="middle">谷 和俊 氏</text>
  <text x="195" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#52514e" text-anchor="middle">初代CAIO（最高AI責任者）</text>
  <text x="195" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#52514e" text-anchor="middle">社長直下で全社AXを主導</text>
  <text x="195" y="240" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#898781" text-anchor="middle">対象：営業・経理・</text>
  <text x="195" y="255" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#898781" text-anchor="middle">バックオフィスの定型業務</text>

  <path d="M 345 185 L 385 185" stroke="#c3c2b7" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c3c2b7"/></marker>
  </defs>

  <rect x="390" y="95" width="270" height="180" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="525" y="150" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#2a78d6" text-anchor="middle">約320時間/月</text>
  <text x="525" y="175" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#52514e" text-anchor="middle">（約2人月分）の省力化</text>
  <text x="525" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#008300" font-weight="700" text-anchor="middle">就任からわずか約3カ月で達成</text>
  <text x="525" y="240" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#898781" text-anchor="middle">2016年〜「ラクニコス」など</text>
  <text x="525" y="255" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#898781" text-anchor="middle">独自ITでDXを先行推進</text>

  <text x="360" y="315" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#898781" text-anchor="middle">出典：LOGI-BIZ online（2026年8月26日）</text>
</svg>
