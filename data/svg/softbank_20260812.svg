<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="318" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0b0b0b">ソフトバンク：AIコーディングツールを統制下に置く「LLM Gateway」</text>
  <text x="28" y="58" font-size="12" fill="#898781">2026年8月7日発表・「AGENTIC STAR」SaaS版に標準搭載</text>

  <rect x="28" y="90" width="180" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="118" y="120" font-size="12" fill="#0b0b0b" text-anchor="middle">エンジニアが使う</text>
  <text x="118" y="140" font-size="12" fill="#0b0b0b" text-anchor="middle">AIコーディングツール</text>

  <text x="220" y="132" font-size="18" fill="#898781">→</text>

  <rect x="240" y="90" width="240" height="70" rx="8" fill="#f9f9f7" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="360" y="116" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">LLM Gateway</text>
  <text x="360" y="136" font-size="11" fill="#52514e" text-anchor="middle">利用ルール遵守／機密情報制限</text>
  <text x="360" y="152" font-size="11" fill="#52514e" text-anchor="middle">利用記録／モデル一元管理／ガードレール</text>

  <text x="492" y="132" font-size="18" fill="#898781">→</text>

  <rect x="512" y="90" width="180" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="602" y="120" font-size="12" fill="#0b0b0b" text-anchor="middle">契約中の</text>
  <text x="602" y="140" font-size="12" fill="#0b0b0b" text-anchor="middle">LLMサービス各種</text>

  <line x1="28" y1="184" x2="692" y2="184" stroke="#c3c2b7"/>
  <text x="28" y="210" font-size="12" fill="#52514e">既存ツールの操作性・開発フローを変えずに導入でき、導入済み企業にも順次適用される。</text>
  <text x="28" y="230" font-size="12" fill="#52514e">「使わせるか」ではなく「使わせた上でどう統制するか」という導入後のガバナンスに焦点を当てた機能。</text>
  <text x="28" y="256" font-size="11" fill="#898781">出典：Impress Cloud Watch（2026/8/7）</text>
</svg>
