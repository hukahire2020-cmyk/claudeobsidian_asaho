<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#0b0b0b">今週の因果チェーン</text>

  <!-- causal chain boxes -->
  <g font-size="12" fill="#0b0b0b">
    <rect x="24" y="58" width="150" height="64" rx="8" fill="#d03b3b" fill-opacity="0.10" stroke="#d03b3b"/>
    <text x="99" y="84" text-anchor="middle" font-weight="700">イラン制裁強化</text>
    <text x="99" y="102" text-anchor="middle" font-size="11" fill="#52514e">経済版Dデー(8/24)</text>

    <text x="182" y="96" font-size="18" fill="#898781">→</text>

    <rect x="200" y="58" width="150" height="64" rx="8" fill="#d03b3b" fill-opacity="0.10" stroke="#d03b3b"/>
    <text x="275" y="84" text-anchor="middle" font-weight="700">中東リスク</text>
    <text x="275" y="102" text-anchor="middle" font-size="11" fill="#52514e">再び意識される</text>

    <text x="358" y="96" font-size="18" fill="#898781">→</text>

    <rect x="376" y="58" width="150" height="64" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6"/>
    <text x="451" y="84" text-anchor="middle" font-weight="700">NVIDIA決算</text>
    <text x="451" y="102" text-anchor="middle" font-size="11" fill="#52514e">市場予想上振れ(8/26)</text>

    <text x="534" y="96" font-size="18" fill="#898781">→</text>

    <rect x="552" y="58" width="144" height="64" rx="8" fill="#008300" fill-opacity="0.10" stroke="#008300"/>
    <text x="624" y="84" text-anchor="middle" font-weight="700">日経平均</text>
    <text x="624" y="102" text-anchor="middle" font-size="11" fill="#52514e">3日続伸</text>
  </g>

  <line x1="24" y1="140" x2="696" y2="140" stroke="#e1e0d9"/>

  <!-- stat panels -->
  <rect x="24" y="156" width="326" height="94" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="40" y="180" font-size="12" fill="#52514e">日経平均株価（8/26終値）</text>
  <text x="40" y="216" font-size="26" font-weight="700" fill="#2a78d6">66,262円16銭</text>
  <text x="40" y="238" font-size="12" fill="#008300">前日比 +405円73銭（+0.62%）3日続伸</text>

  <rect x="370" y="156" width="326" height="94" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="386" y="180" font-size="12" fill="#52514e">ドル円（8/27午前3時時点）</text>
  <text x="386" y="216" font-size="26" font-weight="700" fill="#2a78d6">159円40銭前後</text>
  <text x="386" y="238" font-size="12" fill="#52514e">高値圏で推移</text>

  <rect x="24" y="266" width="672" height="56" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="292" text-anchor="middle" font-size="12" fill="#0b0b0b">NVIDIA決算は取引時間外に判明、株価は時間外で+4%——27日の東京市場でも追い風</text>
  <text x="360" y="310" text-anchor="middle" font-size="11" fill="#898781">半導体・AI関連株に買いが入りやすい局面</text>

  <text x="24" y="358" font-size="11" fill="#898781">出典：財経新聞（8/26）／外為どっとコム（8/26）／NVIDIA公式（8/26）</text>
</svg>
