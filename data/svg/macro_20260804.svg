<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="278" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0b0b0b">因果チェーン：円安 → 協調介入 → 円急伸 → 株安</text>

  <g font-size="11" text-anchor="middle">
    <rect x="28" y="54" width="150" height="50" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="103" y="76" fill="#0b0b0b" font-weight="700">円安進行</text>
    <text x="103" y="92" font-size="10" fill="#52514e">160円台まで下落</text>

    <rect x="196" y="54" width="150" height="50" rx="8" fill="#fcfcfb" stroke="#d03b3b" stroke-width="1.5"/>
    <text x="271" y="76" fill="#d03b3b" font-weight="700">日米協調介入</text>
    <text x="271" y="92" font-size="10" fill="#52514e">7/31実施・8/3公表</text>

    <rect x="364" y="54" width="150" height="50" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="439" y="76" fill="#2a78d6" font-weight="700">円急伸</text>
    <text x="439" y="92" font-size="10" fill="#52514e">155円台へ</text>

    <rect x="532" y="54" width="160" height="50" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="612" y="76" fill="#0b0b0b" font-weight="700">日経平均反落</text>
    <text x="612" y="92" font-size="10" fill="#52514e">8/3 ▲607円</text>
  </g>
  <path d="M178 79 h18 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>
  <path d="M346 79 h18 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>
  <path d="M514 79 h18 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>

  <rect x="28" y="120" width="205" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="130" y="142" font-size="12" fill="#52514e" text-anchor="middle">FOMC（7/29）</text>
  <text x="130" y="172" font-size="18" font-weight="700" fill="#2a78d6" text-anchor="middle">3.50-3.75%据置</text>
  <text x="130" y="192" font-size="10" fill="#898781" text-anchor="middle">3名が利上げ主張し反対票</text>

  <rect x="245" y="120" width="205" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="347" y="142" font-size="12" fill="#52514e" text-anchor="middle">日銀（8/3）</text>
  <text x="347" y="172" font-size="18" font-weight="700" fill="#2a78d6" text-anchor="middle">政策金利据置</text>
  <text x="347" y="192" font-size="10" fill="#898781" text-anchor="middle">10月追加利上げ観測も</text>

  <rect x="462" y="120" width="230" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="577" y="142" font-size="12" fill="#52514e" text-anchor="middle">日経平均（8/3終値）</text>
  <text x="577" y="172" font-size="18" font-weight="700" fill="#d03b3b" text-anchor="middle">63,754.90円</text>
  <text x="577" y="192" font-size="10" fill="#898781" text-anchor="middle">前日比▲607.12円</text>

  <rect x="28" y="214" width="664" height="50" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="42" y="234" font-size="11.5" fill="#0b0b0b" font-weight="700">役員と話すときの要点はこれだけ:</text>
  <text x="42" y="252" font-size="11" fill="#52514e">「為替はもう日銀だけの問題ではない。米国も自国のインフレ対応で円買いに動いた」</text>
</svg>
