  </g>
  <text x="150" y="168" font-size="10.5" fill="#898781">最大の利用目的は「時間の節約」71%（RPR・2026年2月調査、NAR会員225人）</text>

  <text x="28" y="196" font-size="13" font-weight="700" fill="#0b0b0b">Compass「AI Assistant」（2026/7/21発表）の機能</text>
  <g font-size="11" text-anchor="middle">
    <rect x="28" y="208" width="160" height="42" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
