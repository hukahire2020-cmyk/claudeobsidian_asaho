<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#0b0b0b">米不動産仲介、AI活用率82%へ——Compassも「AI Assistant」統合</text>

  <text x="28" y="66" font-size="12" fill="#52514e">米国エージェントのAI活用率（RPR調査）</text>
  <g font-size="11">
    <rect x="150" y="76" width="500" height="20" rx="4" fill="#f0efe9"/>
    <rect x="150" y="76" width="75" height="20" rx="4" fill="#c3c2b7"/>
    <text x="140" y="91" text-anchor="end" fill="#52514e">2023</text>
    <text x="235" y="91" fill="#0b0b0b" font-weight="700">15%</text>

    <rect x="150" y="104" width="500" height="20" rx="4" fill="#f0efe9"/>
    <rect x="150" y="104" width="340" height="20" rx="4" fill="#898781"/>
