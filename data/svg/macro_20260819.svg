<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">AI・半導体株の調整が、日米韓台に連鎖</text>

  <!-- causal chain boxes -->
  <g font-size="11">
    <rect x="24" y="60" width="150" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="99" y="90" text-anchor="middle" fill="#0b0b0b">8/18 米</text>
    <text x="99" y="106" text-anchor="middle" fill="#52514e">半導体株安</text>

    <path d="M178 95 L204 95" stroke="#c3c2b7" stroke-width="2" marker-end="url(#a2)"/>

    <rect x="208" y="60" width="150" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="283" y="86" text-anchor="middle" fill="#0b0b0b">SBG・アドバンテスト</text>
    <text x="283" y="104" text-anchor="middle" fill="#52514e">等に利益確定売り</text>

    <path d="M362 95 L388 95" stroke="#c3c2b7" stroke-width="2" marker-end="url(#a2)"/>

    <rect x="392" y="60" width="150" height="70" rx="8" fill="#fdecec" stroke="#d03b3b"/>
    <text x="467" y="86" text-anchor="middle" fill="#d03b3b" font-weight="700">日経平均</text>
    <text x="467" y="104" text-anchor="middle" fill="#d03b3b" font-weight="700">2,134円安</text>

    <path d="M546 95 L572 95" stroke="#c3c2b7" stroke-width="2" marker-end="url(#a2)"/>

    <rect x="576" y="60" width="120" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="636" y="86" text-anchor="middle" fill="#0b0b0b">KOSPI・台湾</text>
    <text x="636" y="104" text-anchor="middle" fill="#52514e">加権指数も下落</text>
  </g>
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c3c2b7"/>
    </marker>
  </defs>

  <!-- stat row -->
  <rect x="24" y="160" width="330" height="110" rx="8" fill="#f9f9f7"/>
  <text x="44" y="188" font-size="12" fill="#52514e">日経平均終値（8/19）</text>
  <text x="44" y="222" font-size="24" font-weight="700" fill="#d03b3b">65,326.42円</text>
  <text x="44" y="246" font-size="12" fill="#d03b3b">前日比 ▲2,134.31円（-3.16%）</text>

  <rect x="366" y="160" width="330" height="110" rx="8" fill="#f9f9f7"/>
  <text x="386" y="188" font-size="12" fill="#52514e">ドル円（8/19朝）</text>
  <text x="386" y="222" font-size="24" font-weight="700" fill="#0b0b0b">159円台半ば</text>
  <text x="386" y="246" font-size="12" fill="#52514e">中東不安・金利高でドル需要底堅く</text>
</svg>
