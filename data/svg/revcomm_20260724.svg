<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="278" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#0b0b0b">レブコム — 「AI Native経営体制」への3職同時新設（2026/7/23発表）</text>

  <rect x="28" y="58" width="664" height="34" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="80" font-size="13" fill="#52514e" text-anchor="middle">シリーズB資金調達（33.5億円）を機に経営体制を再設計</text>

  <g font-size="12" text-anchor="middle">
    <rect x="28" y="106" width="205" height="120" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="130" y="130" font-weight="700" fill="#2a78d6">CAIO</text>
    <text x="130" y="150" font-size="10.5" fill="#0b0b0b">最高AI責任者</text>
    <text x="130" y="168" font-size="10.5" fill="#52514e">橋本泰一氏</text>
    <text x="130" y="188" font-size="10" fill="#898781">プロダクト・社内業務への</text>
    <text x="130" y="202" font-size="10" fill="#898781">AI組み込みを主導</text>

    <rect x="245" y="106" width="205" height="120" rx="8" fill="#fcfcfb" stroke="#008300" stroke-width="1.5"/>
    <text x="347" y="130" font-weight="700" fill="#008300">CXO</text>
    <text x="347" y="150" font-size="10.5" fill="#0b0b0b">最高変革責任者</text>
    <text x="347" y="168" font-size="10.5" fill="#52514e">重城聡美氏</text>
    <text x="347" y="188" font-size="10" fill="#898781">生成AI時代に合わせた</text>
    <text x="347" y="202" font-size="10" fill="#898781">全社変革を推進</text>

    <rect x="462" y="106" width="230" height="120" rx="8" fill="#fcfcfb" stroke="#d03b3b" stroke-width="1.5"/>
    <text x="577" y="130" font-weight="700" fill="#d03b3b">CPAO</text>
    <text x="577" y="150" font-size="10.5" fill="#0b0b0b">最高人事AI責任者</text>
    <text x="577" y="168" font-size="10.5" fill="#52514e">乾将豪氏</text>
    <text x="577" y="188" font-size="10" fill="#898781">評価制度・業務プロセスを</text>
    <text x="577" y="202" font-size="10" fill="#898781">人とAIの協働前提で再設計</text>
  </g>

  <rect x="28" y="238" width="664" height="28" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="42" y="257" font-size="11.5" fill="#0b0b0b" font-weight="700">目指す姿:「AIを使う会社」ではなく「人とAIがチームとして成果を出す組織」</text>
</svg>
