  <text x="316" y="231" font-size="11" fill="#52514e">Nvidia基準 1.0x</text>
  <rect x="220" y="240" width="270" height="20" fill="#2a78d6"/>
  <text x="496" y="255" font-size="12" font-weight="700" fill="#2a78d6">Jalapeño 2.1〜4.1x</text>

  <rect x="24" y="290" width="672" height="66" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="315" font-size="12" fill="#0b0b0b" font-weight="700">2026年8月25日・Hot Chips会議で公表（OpenAI×Broadcom共同開発）</text>
  <text x="44" y="337" font-size="11" fill="#52514e">設計開始からテープアウトまで9カ月。年内後半に自社モデルでの実運用開始を予定</text>
