  <text x="316" y="101" font-size="11" fill="#52514e">Nvidia基準 1.0x</text>
  <rect x="220" y="110" width="153" height="20" fill="#2a78d6"/>
  <text x="379" y="125" font-size="12" font-weight="700" fill="#2a78d6">Jalapeño 1.5〜1.9x</text>

  <text x="24" y="165" font-size="12" fill="#52514e">応答レイテンシ短縮（低いほど高速）</text>
  <rect x="220" y="151" width="90" height="20" fill="#c3c2b7"/>
  <text x="316" y="166" font-size="11" fill="#52514e">Nvidia基準 1.0x</text>
  <rect x="220" y="175" width="234" height="20" fill="#2a78d6"/>
  <text x="460" y="190" font-size="12" font-weight="700" fill="#2a78d6">Jalapeño 1.7〜3.6x高速</text>

  <text x="24" y="230" font-size="12" fill="#52514e">対話型ワークロード性能</text>
