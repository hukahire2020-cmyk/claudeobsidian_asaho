<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0b0b0b">Gemini 3.8 Flash 発表（9/2）</text>
  <text x="28" y="58" font-size="12" fill="#52514e">6週間で3回目のFlashモデル更新、料金は2027年から倍額へ</text>

  <rect x="24" y="80" width="326" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="187" y="102" font-size="12" fill="#52514e" text-anchor="middle">料金（〜2026/12/31）</text>
  <text x="187" y="134" font-size="19" font-weight="700" fill="#2a78d6" text-anchor="middle">入力$0.75／出力$3.75</text>
  <text x="187" y="154" font-size="11" fill="#898781" text-anchor="middle">100万トークンあたり</text>

  <rect x="368" y="80" width="328" height="90" rx="8" fill="#f9f9f7" stroke="#d03b3b" stroke-width="1.5"/>
  <text x="532" y="102" font-size="12" fill="#52514e" text-anchor="middle">料金（2027/1/1〜）</text>
  <text x="532" y="134" font-size="19" font-weight="700" fill="#d03b3b" text-anchor="middle">入力$1.50／出力$7.50</text>
  <text x="532" y="154" font-size="11" fill="#898781" text-anchor="middle">2倍に改定予定</text>

  <rect x="24" y="184" width="672" height="56" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="42" y="206" font-size="12.5" font-weight="700" fill="#0b0b0b">特徴</text>
  <text x="42" y="224" font-size="11.5" fill="#0b0b0b">テキスト・画像・音声・動画・PDF対応／コンテキスト100万トークン／長時間コーディング・自律エージェント向けに調整</text>

  <rect x="24" y="250" width="672" height="34" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="42" y="272" font-size="11.5" fill="#0b0b0b">防御特化版「Cyber」は政府機関・重要インフラ向け優先アクセス制度「Fairwind Program」経由のみで提供</text>

  <text x="28" y="296" font-size="11" fill="#898781">出典: ★Google公式ブログ (9/2)</text>
