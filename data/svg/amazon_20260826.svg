<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="318" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">Amazon「DeepFleet」——ロボット群を1つの頭脳で最適化</text>

  <rect x="24" y="60" width="210" height="200" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="129" y="90" font-size="12" fill="#52514e" text-anchor="middle">稼働ロボット台数</text>
  <text x="129" y="145" font-size="30" font-weight="700" fill="#2a78d6" text-anchor="middle">52万台</text>
  <text x="129" y="168" font-size="12" fill="#0b0b0b" text-anchor="middle">超（全世界の倉庫）</text>

  <rect x="254" y="60" width="210" height="200" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="359" y="90" font-size="12" fill="#52514e" text-anchor="middle">移動時間の改善</text>
  <text x="359" y="145" font-size="30" font-weight="700" fill="#008300" text-anchor="middle">10%</text>
  <text x="359" y="168" font-size="12" fill="#0b0b0b" text-anchor="middle">AI基盤モデルで最適化</text>

  <rect x="484" y="60" width="212" height="200" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="590" y="90" font-size="12" fill="#52514e" text-anchor="middle">年間コスト削減効果</text>
  <text x="590" y="145" font-size="28" font-weight="700" fill="#0b0b0b" text-anchor="middle">$40億</text>
  <text x="590" y="168" font-size="12" fill="#0b0b0b" text-anchor="middle">ロボット運用全体で</text>

  <text x="24" y="292" font-size="11" fill="#898781">出典: Amazon公式（aboutamazon.com）／Supply Chain Dive　※DeepFleetはロボット群の移動経路を横断的に最適化するAI基盤モデル</text>
</svg>
