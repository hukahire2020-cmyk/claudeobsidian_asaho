<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="258" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">Uber Japan × 日の丸交通 ロボタクシー運行パートナーシップ</text>
  <text x="24" y="54" font-size="12" fill="#52514e">2026年8月13日発表・東京で2026年後半に試験運行開始</text>

  <!-- role split diagram -->
  <rect x="24" y="72" width="320" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="184" y="94" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">日の丸交通（運行主体）</text>
  <text x="184" y="116" font-size="11.5" fill="#52514e" text-anchor="middle">車両管理・車両基地運営</text>
  <text x="184" y="134" font-size="11.5" fill="#52514e" text-anchor="middle">メンテナンス・充電</text>
  <text x="184" y="152" font-size="11.5" fill="#52514e" text-anchor="middle">初期はセーフティドライバー同乗</text>

  <rect x="368" y="72" width="328" height="100" rx="8" fill="#eef4fb" stroke="#c3c2b7"/>
  <text x="532" y="94" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Uber（プラットフォーム）</text>
  <text x="532" y="116" font-size="11.5" fill="#52514e" text-anchor="middle">配車アプリ・運行支援ツール</text>
  <text x="532" y="134" font-size="11.5" fill="#52514e" text-anchor="middle">車両: 日産リーフ</text>
  <text x="532" y="152" font-size="11.5" fill="#2a78d6" text-anchor="middle" font-weight="700">Wayve「AI Driver」搭載</text>

  <!-- timeline strip -->
  <line x1="60" y1="216" x2="660" y2="216" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="100" cy="216" r="5" fill="#898781"/>
  <text x="100" y="200" font-size="11.5" fill="#52514e" text-anchor="middle">2026年3月</text>
  <text x="100" y="236" font-size="11" fill="#0b0b0b" text-anchor="middle">Uber×Wayve×日産 協業発表</text>

  <circle cx="360" cy="216" r="7" fill="#d03b3b"/>
  <text x="360" y="198" font-size="12" font-weight="700" fill="#d03b3b" text-anchor="middle">8月13日（今回）</text>
  <text x="360" y="236" font-size="11" fill="#0b0b0b" text-anchor="middle">日の丸交通と運行提携</text>

  <circle cx="600" cy="216" r="5" fill="#008300"/>
  <text x="600" y="200" font-size="11.5" fill="#008300" text-anchor="middle">2026年後半</text>
  <text x="600" y="236" font-size="11" fill="#0b0b0b" text-anchor="middle">東京で試験運行開始</text>
</svg>
