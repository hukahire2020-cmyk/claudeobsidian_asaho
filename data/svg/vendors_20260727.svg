<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="258" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">国内ベンダー2社の動き（7/22〜24）</text>

  <rect x="24" y="56" width="322" height="180" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="84" font-size="13" font-weight="700" fill="#0b0b0b">NEC「Agentic AI共同研究会」第3期</text>
  <text x="44" y="106" font-size="11" fill="#898781">7月24日発表</text>
  <text x="44" y="146" font-size="30" font-weight="700" fill="#2a78d6">27行庫</text>
  <text x="44" y="168" font-size="11" fill="#898781">参加金融機関数</text>
  <text x="44" y="196" font-size="11" fill="#0b0b0b">新設WGで「AI Readyデータ」</text>
  <text x="44" y="212" font-size="11" fill="#0b0b0b">（部門横断のデータ連携）を検討</text>

  <rect x="374" y="56" width="322" height="180" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="394" y="84" font-size="13" font-weight="700" fill="#0b0b0b">ソフトバンク「GaranAI」β版</text>
  <text x="394" y="106" font-size="11" fill="#898781">7月22日提供開始</text>
  <text x="394" y="146" font-size="20" font-weight="700" fill="#008300">報道各社データを</text>
  <text x="394" y="168" font-size="20" font-weight="700" fill="#008300">復元困難な形で提供</text>
  <text x="394" y="196" font-size="11" fill="#0b0b0b">共同通信・産経・毎日等が参画</text>
  <text x="394" y="212" font-size="11" fill="#0b0b0b">正式提供は2027年1月以降予定</text>
</svg>
