<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0b0b0b">Anthropic、国防総省との対立の渦中でCuéllar氏を起用</text>

  <line x1="50" y1="90" x2="670" y2="90" stroke="#c3c2b7" stroke-width="2"/>
  <g font-size="10.5" text-anchor="middle">
    <circle cx="70" cy="90" r="6" fill="#52514e"/>
    <text x="70" y="76" fill="#52514e">'25.7</text>
    <text x="70" y="112" fill="#0b0b0b">機密NW利用</text>
    <text x="70" y="126" fill="#0b0b0b">承認を協議</text>

    <circle cx="220" cy="90" r="6" fill="#d03b3b"/>
    <text x="220" y="76" fill="#52514e">'26.2</text>
    <text x="220" y="112" fill="#0b0b0b">条件対立で</text>
    <text x="220" y="126" fill="#0b0b0b">交渉決裂</text>

    <circle cx="370" cy="90" r="6" fill="#d03b3b"/>
    <text x="370" y="76" fill="#52514e">3月</text>
    <text x="370" y="112" fill="#0b0b0b">「サプライチェーン</text>
    <text x="370" y="126" fill="#0b0b0b">リスク」に認定</text>

    <circle cx="500" cy="90" r="6" fill="#d03b3b"/>
    <text x="500" y="76" fill="#52514e">6月</text>
    <text x="500" y="112" fill="#0b0b0b">輸出規制</text>
    <text x="500" y="126" fill="#0b0b0b">命令</text>

    <circle cx="650" cy="90" r="7" fill="#2a78d6"/>
    <text x="650" y="76" fill="#2a78d6" font-weight="700">8/4</text>
    <text x="650" y="112" fill="#0b0b0b" font-weight="700">Cuéllar氏を</text>
    <text x="650" y="126" fill="#0b0b0b" font-weight="700">CGAOに起用</text>
  </g>

  <rect x="28" y="160" width="330" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="193" y="184" font-size="12" fill="#52514e" text-anchor="middle">新設ポスト</text>
  <text x="193" y="222" font-size="20" font-weight="700" fill="#2a78d6" text-anchor="middle">初代 Chief Global</text>
  <text x="193" y="244" font-size="20" font-weight="700" fill="#2a78d6" text-anchor="middle">Affairs Officer</text>

  <rect x="368" y="160" width="324" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="530" y="184" font-size="12" fill="#52514e" text-anchor="middle">起用された人物</text>
  <text x="530" y="216" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">元カリフォルニア州最高裁判事</text>
  <text x="530" y="238" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">カーネギー国際平和財団 前会長</text>

  <text x="28" y="288" font-size="12.5" fill="#0b0b0b">📍 国防総省との訴訟が続くさなか、司法・政策の経験を持つ人物を政府渉外トップに起用。</text>
  <rect x="28" y="300" width="664" height="26" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="42" y="317" font-size="11" fill="#898781">出典: Anthropic公式（8/4）</text>
</svg>
