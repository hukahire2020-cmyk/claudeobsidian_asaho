<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="318" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0b0b0b">物流業界初、AIがロボットへ作業指示</text>
  <text x="28" y="58" font-size="12" fill="#52514e">セイノー情報サービス「ロジスティクス・エージェント」（9/3発表）</text>

  <!-- flow diagram -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="24" y="86" width="190" height="72" rx="8" fill="#f9f9f7" stroke="#c3c2b7"/>
    <text x="119" y="110" fill="#0b0b0b" font-weight="700">現場データ</text>
    <text x="119" y="128" fill="#52514e">入出荷・在庫・バース</text>
    <text x="119" y="143" fill="#52514e">作業進捗・稼働実績</text>

    <rect x="264" y="86" width="192" height="72" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="360" y="112" fill="#2a78d6" font-weight="700">ロジスティクス・</text>
    <text x="360" y="130" fill="#2a78d6" font-weight="700">エージェント</text>
    <text x="360" y="146" fill="#52514e">状況分析・判断（AI）</text>

    <rect x="506" y="86" width="190" height="72" rx="8" fill="#f9f9f7" stroke="#c3c2b7"/>
    <text x="601" y="112" fill="#0b0b0b" font-weight="700">ロボット（AMR）</text>
    <text x="601" y="130" fill="#52514e">搬送先の自動指示</text>
    <text x="601" y="146" fill="#52514e">「kachaka Pro」等</text>
  </g>
  <path d="M214 122 h44 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>
  <path d="M456 122 h44 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>

  <rect x="24" y="182" width="672" height="68" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="42" y="204" font-size="12.5" font-weight="700" fill="#0b0b0b">物流業界初</text>
  <text x="42" y="226" font-size="11.5" fill="#0b0b0b">「いつ・どこへ・何を優先して動かすか」という現場の判断をAIが担い、ロボットへの指示まで自動化</text>
  <text x="42" y="244" font-size="11" fill="#898781">現時点では展示会でのデモンストレーション段階。実運用の数値は未発表</text>

  <rect x="24" y="260" width="672" height="34" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="42" y="282" font-size="11.5" fill="#0b0b0b">国際物流総合展2026（9/8〜11・東京ビッグサイト）でデモを実施中</text>

  <text x="28" y="308" font-size="11" fill="#898781">出典: ★セイノー情報サービス公式プレスリリース (9/3)</text>
</svg>
