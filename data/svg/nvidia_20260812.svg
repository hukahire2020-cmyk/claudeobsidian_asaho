<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0b0b0b">Nvidiaが6社と提携、5000億ドル超の融資基盤を構築</text>
  <text x="28" y="58" font-size="12" fill="#898781">2026年8月10日発表・非拘束のMOU（正式契約は今後個別に）</text>

  <rect x="28" y="78" width="300" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="178" y="130" font-size="40" font-weight="700" fill="#2a78d6" text-anchor="middle">$500B+</text>
  <text x="178" y="155" font-size="13" fill="#52514e" text-anchor="middle">第三者資本を動員する計画</text>
  <text x="178" y="175" font-size="11" fill="#898781" text-anchor="middle">（AI計算インフラの資金調達専用）</text>

  <rect x="348" y="78" width="344" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="368" y="102" font-size="12" fill="#52514e" font-weight="700">提携6社（すべて金融大手）</text>
  <text x="368" y="126" font-size="12" fill="#0b0b0b">Apollo Global Management</text>
  <text x="368" y="146" font-size="12" fill="#0b0b0b">BlackRock ／ Blackstone</text>
  <text x="368" y="166" font-size="12" fill="#0b0b0b">Brookfield ／ Goldman Sachs ／ KKR</text>
  <text x="368" y="188" font-size="11" fill="#898781">CEOフアン氏「6社全てが応じた」</text>

  <line x1="28" y1="222" x2="692" y2="222" stroke="#c3c2b7"/>
  <text x="28" y="248" font-size="13" font-weight="700" fill="#0b0b0b">狙い：コンピュートを「投資可能な資産」に</text>
  <text x="28" y="270" font-size="12" fill="#52514e">顧客企業が自己のバランスシートを使わずに、独立した融資プラットフォーム経由で</text>
  <text x="28" y="290" font-size="12" fill="#52514e">Nvidia計算インフラを調達できる仕組みを整備。個別融資は各社が案件ごとに審査。</text>

  <rect x="28" y="312" width="664" height="46" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="340" font-size="12" fill="#0b0b0b" font-weight="700">Jensen Huang CEO（CNBC・8/10）：</text>
  <text x="44" y="340" font-size="12" fill="#52514e" dx="220">"NVIDIA compute is revenue. NVIDIA compute is uniquely suited for this role"</text>
</svg>
