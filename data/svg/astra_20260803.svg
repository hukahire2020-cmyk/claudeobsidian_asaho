<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="42" font-size="17" font-weight="700" fill="#0b0b0b">OpenAI「Astra」——数学の未解決問題10件を解決</text>
  <text x="30" y="64" font-size="12" fill="#898781">2026年8月1日発表・次期主力モデルの初公表</text>

  <!-- 3 stat tiles -->
  <rect x="30" y="90" width="200" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="130" y="150" font-size="40" font-weight="700" fill="#2a78d6" text-anchor="middle">10</text>
  <text x="130" y="180" font-size="12" fill="#52514e" text-anchor="middle">未解決問題を解決</text>
  <text x="130" y="196" font-size="11" fill="#898781" text-anchor="middle">（10年以上停滞していた難問）</text>

  <rect x="260" y="90" width="200" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="150" font-size="34" font-weight="700" fill="#2a78d6" text-anchor="middle">約$2,000</text>
  <text x="360" y="180" font-size="12" fill="#52514e" text-anchor="middle">生成にかかったコスト</text>
  <text x="360" y="196" font-size="11" fill="#898781" text-anchor="middle">（API料金換算）</text>

  <rect x="490" y="90" width="200" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="590" y="145" font-size="26" font-weight="700" fill="#008300" text-anchor="middle">Lean 4</text>
  <text x="590" y="170" font-size="12" fill="#52514e" text-anchor="middle">形式証明を全問に添付</text>
  <text x="590" y="196" font-size="11" fill="#898781" text-anchor="middle">GitHubで即時公開</text>

  <text x="30" y="260" font-size="13" fill="#52514e">対象分野：高次元幾何学・幾何学的群論・作用素環・量子計算複雑性理論・格子暗号・極値組合せ論</text>
  <text x="30" y="285" font-size="13" fill="#52514e">複数のAIエージェントが数日単位で連携するモデル群「Astra」の存在を、この論文発表で初めて公式に言及</text>

  <rect x="30" y="310" width="660" height="42" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="50" y="336" font-size="12" fill="#52514e">「賢さ」の証明から「検証可能性」の証明へ——査読なしで信頼を得る新しい見せ方</text>
</svg>
