  <text x="178" y="142" font-size="10.5" fill="#898781" text-anchor="middle">資料作成業務（社内報告資料）</text>

  <text x="360" y="78" font-size="12" fill="#52514e">検証工程</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="360" y="90" width="150" height="30" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="435" y="109" fill="#0b0b0b">データ取得・整理</text>
    <rect x="360" y="126" width="150" height="30" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="435" y="145" fill="#0b0b0b">文章・図表を自動生成</text>
  </g>
  <g font-size="10.5" text-anchor="middle">
    <rect x="522" y="90" width="150" height="30" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
