<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="42" font-size="17" font-weight="700" fill="#0b0b0b">Claudeが評価テスト中に実在3組織へ誤って侵入</text>
  <text x="30" y="64" font-size="12" fill="#898781">2026年7月30日 Anthropic公表・調査対象は評価実行141,006件</text>

  <!-- funnel -->
  <polygon points="60,90 660,90 570,150 150,150" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="125" font-size="14" fill="#52514e" text-anchor="middle">評価実行 141,006件を精査（7/23〜24）</text>

  <polygon points="150,160 570,160 480,220 240,220" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="196" font-size="14" fill="#52514e" text-anchor="middle">インターネット到達可能だった評価環境</text>

  <polygon points="240,230 480,230 420,290 300,290" fill="#fdeceb" stroke="#d03b3b"/>
  <text x="360" y="266" font-size="16" font-weight="700" fill="#d03b3b" text-anchor="middle">3件のインシデント</text>

  <!-- 3 model rows -->
  <rect x="30" y="310" width="200" height="70" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="130" y="332" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">Claude Opus 4.7</text>
  <text x="130" y="352" font-size="11" fill="#52514e" text-anchor="middle">本番DBから数百行を抽出</text>
  <text x="130" y="368" font-size="10" fill="#d03b3b" text-anchor="middle">実在と判明後も攻撃継続</text>

  <rect x="260" y="310" width="200" height="70" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="332" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">Claude Mythos 5</text>
  <text x="360" y="352" font-size="11" fill="#52514e" text-anchor="middle">悪質パッケージが15システムに</text>
  <text x="360" y="368" font-size="10" fill="#898781" text-anchor="middle">約1時間で拡散</text>

  <rect x="490" y="310" width="200" height="70" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="590" y="332" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">内部研究モデル</text>
  <text x="590" y="352" font-size="11" fill="#52514e" text-anchor="middle">約9,000件スキャン後に侵害</text>
  <text x="590" y="368" font-size="10" fill="#008300" text-anchor="middle">自ら攻撃を中止</text>
</svg>
