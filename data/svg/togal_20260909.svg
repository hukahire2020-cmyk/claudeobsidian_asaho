<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="38" font-size="17" font-weight="700" fill="#0b0b0b">Coastal Construction × Togal.AI 導入実績</text>
  <text x="30" y="58" font-size="12" fill="#898781">フロリダの大手建設会社、110件超のプロジェクトに適用（2025年実績）</text>

  <!-- stat tiles row -->
  <rect x="35" y="80" width="150" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="110" y="115" font-size="24" font-weight="700" fill="#2a78d6" text-anchor="middle">50〜65%</text>
  <text x="110" y="136" font-size="11" fill="#52514e" text-anchor="middle">プレコン全体の</text>
  <text x="110" y="150" font-size="11" fill="#52514e" text-anchor="middle">工数削減</text>

  <rect x="195" y="80" width="150" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="270" y="108" font-size="15" font-weight="700" fill="#008300" text-anchor="middle">32〜40h</text>
  <text x="270" y="124" font-size="11" fill="#898781" text-anchor="middle">→</text>
  <text x="270" y="142" font-size="15" font-weight="700" fill="#008300" text-anchor="middle">13〜20h</text>
  <text x="270" y="162" font-size="11" fill="#52514e" text-anchor="middle">初期概算(ROM)</text>

  <rect x="355" y="80" width="150" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="430" y="115" font-size="22" font-weight="700" fill="#2a78d6" text-anchor="middle">140〜230h</text>
  <text x="430" y="136" font-size="11" fill="#52514e" text-anchor="middle">プロジェクト</text>
  <text x="430" y="150" font-size="11" fill="#52514e" text-anchor="middle">あたり削減時間</text>

  <rect x="515" y="80" width="170" height="100" rx="8" fill="#f9f9f7" stroke="#d03b3b"/>
  <text x="600" y="122" font-size="22" font-weight="700" fill="#d03b3b" text-anchor="middle">約320万ドル</text>
  <text x="600" y="145" font-size="11" fill="#52514e" text-anchor="middle">2025年の年間削減効果</text>

  <!-- company growth bar -->
  <text x="35" y="215" font-size="12.5" font-weight="700" fill="#0b0b0b">同社の売上推移</text>
  <text x="90" y="248" font-size="11.5" fill="#52514e">2023年</text>
  <rect x="150" y="234" width="190" height="20" rx="4" fill="#c3c2b7"/>
  <text x="350" y="249" font-size="12" font-weight="700" fill="#0b0b0b">9億6,060万ドル</text>

  <text x="90" y="280" font-size="11.5" fill="#52514e">2025年</text>
  <rect x="150" y="266" width="350" height="20" rx="4" fill="#2a78d6"/>
  <text x="510" y="281" font-size="12" font-weight="700" fill="#2a78d6">17億7,000万ドル（約84%増）</text>

  <text x="360" y="322" font-size="10.5" fill="#898781" text-anchor="middle">出典: Togal.AI公式ケーススタディ（Coastal Construction）</text>
</svg>
