<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">紅海リスクと原油価格の推移</text>
  <text x="24" y="54" font-size="12" fill="#898781">米・イラン緊張緩和とフーシ派単独攻撃が交錯</text>

  <!-- timeline axis -->
  <line x1="50" y1="120" x2="670" y2="120" stroke="#c3c2b7" stroke-width="2"/>

  <!-- points -->
  <g>
    <circle cx="90" cy="120" r="5" fill="#d03b3b"/>
    <text x="90" y="100" font-size="11" fill="#52514e" text-anchor="middle">7/23</text>
    <text x="90" y="145" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700">$98.45</text>
    <text x="90" y="160" font-size="10" fill="#898781" text-anchor="middle">ピーク</text>
  </g>
  <g>
    <circle cx="250" cy="120" r="5" fill="#2a78d6"/>
    <text x="250" y="100" font-size="11" fill="#52514e" text-anchor="middle">7/25-26</text>
    <text x="250" y="145" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700">米イラン</text>
    <text x="250" y="160" font-size="10" fill="#898781" text-anchor="middle">13夜連続空爆停止</text>
  </g>
  <g>
    <circle cx="400" cy="170" r="5" fill="#008300"/>
    <text x="400" y="150" font-size="11" fill="#52514e" text-anchor="middle">7/24-27</text>
    <text x="400" y="195" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700">$83台</text>
    <text x="400" y="210" font-size="10" fill="#898781" text-anchor="middle">緊張緩和で反落</text>
  </g>
  <g>
    <circle cx="540" cy="120" r="5" fill="#d03b3b"/>
    <text x="540" y="100" font-size="11" fill="#52514e" text-anchor="middle">7/28</text>
    <text x="540" y="145" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700">NCC Ghazal</text>
    <text x="540" y="160" font-size="10" fill="#898781" text-anchor="middle">4隻目タンカー攻撃</text>
  </g>
  <g>
    <circle cx="650" cy="105" r="5" fill="#d03b3b"/>
    <text x="650" y="85" font-size="11" fill="#52514e" text-anchor="middle">7/29</text>
    <text x="650" y="130" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700">$84.94</text>
    <text x="650" y="145" font-size="10" fill="#898781" text-anchor="middle">+4.11%反発</text>
  </g>

  <!-- price line -->
  <polyline points="90,120 250,120 400,170 540,120 650,105" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- bottom box: AI detection -->
  <rect x="24" y="250" width="672" height="105" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="278" font-size="13" font-weight="700" fill="#0b0b0b">Windwardの AIリスクモデルが攻撃2日前から検知</text>
  <text x="44" y="300" font-size="11" fill="#52514e">NCC Ghazalは7/26からAISブラックアウト・複数回の瀬取り・目的地の頻繁な変更を繰り返していた</text>
  <text x="44" y="320" font-size="11" fill="#52514e">→ 行動データに基づくAIリスクスコアが、攻撃前に標的化リスクを高評価</text>
  <text x="44" y="340" font-size="10" fill="#898781">出典: Al Jazeera(7/28) / gCaptain(7/28) / Windward公式X(7/28) / TradingKey(7/29)</text>
</svg>
