<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="38" font-size="17" font-weight="700" fill="#0b0b0b">国内AIベンダーの動き（9/7発表・2件）</text>

  <rect x="35" y="65" width="310" height="240" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="190" y="92" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">テリロジーサービスウェア</text>
  <text x="190" y="110" font-size="12" fill="#52514e" text-anchor="middle">業務自動化AIエージェント「palton AI」</text>

  <rect x="55" y="130" width="270" height="1" fill="#e1e0d9"/>

  <text x="65" y="155" font-size="11.5" fill="#0b0b0b" font-weight="600">・確実な操作 → 従来の自動化技術</text>
  <text x="65" y="175" font-size="11.5" fill="#0b0b0b" font-weight="600">・柔軟な判断 → AIが担当</text>
  <text x="65" y="198" font-size="11" fill="#52514e">ログイン・重要データ処理などの</text>
  <text x="65" y="214" font-size="11" fill="#52514e">誤操作が許されない領域は自動化ロジックに委ね、</text>
  <text x="65" y="230" font-size="11" fill="#52514e">AI単独の暴走リスクを抑える設計</text>

  <text x="190" y="270" font-size="12" font-weight="700" fill="#2a78d6" text-anchor="middle">2026年10月1日 提供開始</text>
  <text x="190" y="288" font-size="10.5" fill="#898781" text-anchor="middle">先行トライアル予約受付中</text>

  <rect x="375" y="65" width="310" height="240" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="530" y="92" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">BIPROGY × サーバーワークス × G-gen</text>
  <text x="530" y="110" font-size="12" fill="#52514e" text-anchor="middle">クラウド・生成AI活用支援で業務提携</text>

  <rect x="395" y="130" width="270" height="1" fill="#e1e0d9"/>

  <text x="405" y="155" font-size="11.5" fill="#0b0b0b" font-weight="600">BIPROGY：業種知見・顧客基盤</text>
  <text x="405" y="175" font-size="11.5" fill="#0b0b0b" font-weight="600">サーバーワークス：AWS専門性</text>
  <text x="405" y="195" font-size="11.5" fill="#0b0b0b" font-weight="600">G-gen：Google Cloud専門性</text>
  <text x="405" y="218" font-size="11" fill="#52514e">構想策定〜実装・運用まで一体で支援</text>

  <text x="530" y="270" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="middle">5年後 年間100億円規模</text>
  <text x="530" y="288" font-size="10.5" fill="#898781" text-anchor="middle">3社合計の協業売上目標</text>

  <text x="360" y="322" font-size="10.5" fill="#898781" text-anchor="middle">出典: テリロジーサービスウェア公式・PR TIMES(9/7) ／ サーバーワークス公式(9/7)</text>
</svg>
