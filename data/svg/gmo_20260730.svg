<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">GMOインターネットグループ：代表がグループCAIOを兼務</text>
  <text x="24" y="54" font-size="12" fill="#898781">2026年7月13日発表</text>

  <!-- org box -->
  <rect x="230" y="80" width="260" height="80" rx="8" fill="#2a78d6"/>
  <text x="360" y="110" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">熊谷正寿</text>
  <text x="360" y="130" font-size="11" fill="#ffffff" text-anchor="middle">グループ代表 会長兼社長執行役員CEO</text>
  <text x="360" y="148" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">＋ グループCAIO 兼務</text>

  <line x1="360" y1="160" x2="360" y2="185" stroke="#c3c2b7" stroke-width="2"/>

  <!-- four scope boxes -->
  <g>
    <rect x="60" y="185" width="140" height="70" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="130" y="210" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">AI戦略</text>
    <text x="130" y="228" font-size="10" fill="#52514e" text-anchor="middle">全社方針の策定</text>
  </g>
  <g>
    <rect x="220" y="185" width="140" height="70" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="290" y="210" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">導入推進</text>
    <text x="290" y="228" font-size="10" fill="#52514e" text-anchor="middle">グループ横断展開</text>
  </g>
  <g>
    <rect x="380" y="185" width="140" height="70" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="450" y="210" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">ガバナンス</text>
    <text x="450" y="228" font-size="10" fill="#52514e" text-anchor="middle">リスク・統制</text>
  </g>
  <g>
    <rect x="540" y="185" width="120" height="70" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="600" y="210" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">人材育成</text>
    <text x="600" y="228" font-size="10" fill="#52514e" text-anchor="middle">業務変革</text>
  </g>

  <line x1="130" y1="185" x2="360" y2="160" stroke="#c3c2b7" stroke-width="1.5"/>
  <line x1="290" y1="185" x2="360" y2="160" stroke="#c3c2b7" stroke-width="1.5"/>
  <line x1="450" y1="185" x2="360" y2="160" stroke="#c3c2b7" stroke-width="1.5"/>
  <line x1="600" y1="185" x2="360" y2="160" stroke="#c3c2b7" stroke-width="1.5"/>

  <rect x="60" y="275" width="600" height="45" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="302" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="700">目標: 2027年11月までに「ハイパーオートメーション」へ移行</text>

  <text x="24" y="330" font-size="10" fill="#898781">出典: GMOインターネットグループ公式(7/13)</text>
</svg>
