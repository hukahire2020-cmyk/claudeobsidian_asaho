<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="40" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#0b0b0b">中東リスク再燃 → インフレ懸念 → 円安圧力</text>

  <!-- chain boxes -->
  <rect x="30" y="70" width="150" height="60" rx="6" fill="#f9f9f7" stroke="#d03b3b"/>
  <text x="105" y="95" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">ホルムズ海峡で</text>
  <text x="105" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">対イラン攻撃再開(8/30)</text>

  <path d="M 185 100 L 210 100" stroke="#c3c2b7" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="215" y="70" width="130" height="60" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="280" y="95" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">中東供給リスク</text>
  <text x="280" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">再燃</text>

  <path d="M 350 100 L 375 100" stroke="#c3c2b7" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="380" y="70" width="150" height="60" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="455" y="95" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">FRBウォーシュ議長</text>
  <text x="455" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">「利上げ排除せず」(8/28)</text>

  <path d="M 535 100 L 560 100" stroke="#c3c2b7" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="565" y="70" width="125" height="60" rx="6" fill="#f9f9f7" stroke="#2a78d6"/>
  <text x="627" y="95" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">日経反落・</text>
  <text x="627" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">円160円接近</text>

  <defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c3c2b7"/></marker></defs>

  <rect x="30" y="155" width="660" height="115" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="50" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#0b0b0b" font-weight="700">日経平均：8/31終値 66,311.93円（前週末比93.63円安）半導体・AI株中心に売り</text>
  <text x="50" y="202" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#0b0b0b" font-weight="700">ドル円：8/31午前に一時160円20銭まで上昇後、介入警戒で159円80銭前後へ</text>
  <text x="50" y="224" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#52514e">財務省は7〜8月に計15兆3993億円の円買い・ドル売り介入を実施（過去最大）</text>
  <text x="50" y="246" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#2a78d6" font-weight="700">次回FOMCは9月15-16日。市場の利上げ織り込みは割れたまま</text>
</svg>
