  <text x="600" y="207" font-size="13" font-weight="700" fill="#0b0b0b">8,800人</text>

  <line x1="150" y1="90" x2="150" y2="220" stroke="#e1e0d9" stroke-width="1"/>

  <!-- stat tiles -->
  <rect x="30" y="255" width="210" height="110" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
