<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#0b0b0b">紅海に戦線拡大——フーシ派のサウジタンカー攻撃と原油急伸</text>

  <g font-size="12" text-anchor="middle">
    <rect x="28" y="58" width="200" height="56" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="128" y="80" font-weight="700" fill="#0b0b0b">7月中旬</text>
    <text x="128" y="99" font-size="10.5" fill="#52514e">フーシ派、サウジ港湾の海上封鎖を宣言</text>

    <rect x="260" y="58" width="200" height="56" rx="8" fill="#fcfcfb" stroke="#d03b3b" stroke-width="1.5"/>
    <text x="360" y="80" font-weight="700" fill="#d03b3b">7/22〜23</text>
    <text x="360" y="99" font-size="10.5" fill="#52514e">サウジ籍タンカー2隻をミサイル・ドローン攻撃</text>

    <rect x="492" y="58" width="200" height="56" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="592" y="80" font-weight="700" fill="#2a78d6">7/23</text>
    <text x="592" y="99" font-size="10.5" fill="#52514e">ブレント原油 98.45ドルへ急伸</text>
  </g>
  <path d="M228 86 h24 m-8 -6 8 6 -8 6" stroke="#898781" stroke-width="2" fill="none"/>
  <path d="M460 86 h24 m-8 -6 8 6 -8 6" stroke="#898781" stroke-width="2" fill="none"/>

  <rect x="28" y="130" width="150" height="94" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="103" y="152" font-size="12" fill="#52514e" text-anchor="middle">ブレント原油</text>
  <text x="103" y="188" font-size="26" font-weight="700" fill="#d03b3b" text-anchor="middle">$98.45</text>
  <text x="103" y="208" font-size="10.5" fill="#898781" text-anchor="middle">7/23・週初比</text>

  <rect x="186" y="130" width="150" height="94" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="261" y="152" font-size="12" fill="#52514e" text-anchor="middle">7月の値上がり幅</text>
  <text x="261" y="188" font-size="26" font-weight="700" fill="#d03b3b" text-anchor="middle">約4割高</text>
  <text x="261" y="208" font-size="10.5" fill="#898781" text-anchor="middle">月初 約90ドルから</text>

  <rect x="344" y="130" width="150" height="94" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="419" y="152" font-size="12" fill="#52514e" text-anchor="middle">WTI原油</text>
  <text x="419" y="188" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="middle">90ドル台</text>
  <text x="419" y="208" font-size="10.5" fill="#898781" text-anchor="middle">約1カ月ぶり</text>

  <rect x="502" y="130" width="190" height="94" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="597" y="152" font-size="12" fill="#52514e" text-anchor="middle">バブエルマンデブ海峡</text>
  <text x="597" y="188" font-size="24" font-weight="700" fill="#2a78d6" text-anchor="middle">12〜15%</text>
  <text x="597" y="208" font-size="10.5" fill="#898781" text-anchor="middle">世界海上貿易のシェア</text>

  <rect x="28" y="240" width="664" height="40" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="42" y="258" font-size="11.5" fill="#0b0b0b" font-weight="700">当事者が「イラン単独」から「イラン＋フーシ派」へ拡大——紅海・アラビア半島全域にリスクが波及</text>
  <text x="42" y="274" font-size="10.5" fill="#898781">Encelia号・Layla号を攻撃、船首炎上も乗組員に人的被害なしと報道</text>
</svg>
