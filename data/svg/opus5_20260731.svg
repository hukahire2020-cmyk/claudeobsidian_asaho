  <text x="24" y="54" font-size="12" fill="#898781">2026年7月24日公開（Anthropic公式）</text>

  <!-- price comparison tiles -->
  <rect x="24" y="72" width="320" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="184" y="94" font-size="11" fill="#898781" text-anchor="middle">Claude Opus 5</text>
  <text x="184" y="128" font-size="26" fill="#2a78d6" text-anchor="middle" font-weight="700">$5 / $25（百万トークン）</text>
  <text x="184" y="146" font-size="10" fill="#898781" text-anchor="middle">入力 / 出力（Opus 4.8と同額）</text>

  <rect x="376" y="72" width="320" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
