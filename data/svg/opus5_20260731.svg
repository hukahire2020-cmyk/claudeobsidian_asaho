  <text x="700" y="200" font-size="11" fill="#0b0b0b" font-weight="700" text-anchor="end">99.5%</text>

  <text x="24" y="228" font-size="12" font-weight="700" fill="#0b0b0b">Frontier-Bench v0.1（ソフトウェアエンジニアリング）—— Opus 4.8比</text>
  <rect x="24" y="236" width="672" height="16" rx="3" fill="#e1e0d9"/>
