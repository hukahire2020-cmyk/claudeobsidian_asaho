<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#0b0b0b">ChatGPT Work、要ログインサイトの作業も代行可能に</text>
  <text x="24" y="60" font-size="12" fill="#898781">2026年8月25日発表（Plus・Pro・Business対象）</text>

  <g font-size="12" fill="#0b0b0b">
    <rect x="24" y="86" width="200" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="124" y="112" text-anchor="middle" font-size="22">①</text>
    <text x="124" y="138" text-anchor="middle" font-weight="700">ユーザーが</text>
    <text x="124" y="156" text-anchor="middle" font-weight="700">専用フォームでログイン</text>

    <text x="234" y="136" font-size="18" fill="#898781">→</text>

    <rect x="260" y="86" width="200" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="360" y="112" text-anchor="middle" font-size="22">②</text>
    <text x="360" y="138" text-anchor="middle" font-weight="700">セッションを維持</text>
    <text x="360" y="156" text-anchor="middle" font-size="11" fill="#52514e">AIはID・パスワードを見ない</text>

    <text x="470" y="136" font-size="18" fill="#898781">→</text>

    <rect x="496" y="86" width="200" height="90" rx="8" fill="#2a78d6" fill-opacity="0.10" stroke="#2a78d6"/>
    <text x="596" y="112" text-anchor="middle" font-size="22">③</text>
    <text x="596" y="138" text-anchor="middle" font-weight="700">要ログイン作業を</text>
    <text x="596" y="156" text-anchor="middle" font-weight="700">AIが代行</text>
  </g>

  <line x1="24" y1="196" x2="696" y2="196" stroke="#e1e0d9"/>

  <text x="24" y="224" font-size="13" font-weight="700" fill="#0b0b0b">代行できる作業の例</text>
  <rect x="24" y="238" width="672" height="46" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="266" text-anchor="middle" font-size="12" fill="#52514e">賃貸契約の手続き　／　通院予約　／　会員サイトでの各種申請作業</text>

  <text x="24" y="320" font-size="11" fill="#898781">出典：ITmedia NEWS（8月26日）／窓の杜（8月26日）</text>
</svg>
