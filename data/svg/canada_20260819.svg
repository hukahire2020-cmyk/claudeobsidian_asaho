<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">対カナダ50%関税、発動0時間前で3日間停止</text>

  <!-- funnel / chain of 3 stages -->
  <g>
    <rect x="40" y="70" width="190" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="135" y="96" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">7月20日</text>
    <text x="135" y="118" font-size="11" fill="#52514e" text-anchor="middle">対カナダ50%追加関税を</text>
    <text x="135" y="134" font-size="11" fill="#52514e" text-anchor="middle">発表（500品目超）</text>

    <path d="M235 115 L265 115" stroke="#c3c2b7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="270" y="70" width="190" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="365" y="96" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">8月19日午前0時1分</text>
    <text x="365" y="118" font-size="11" fill="#52514e" text-anchor="middle">（米東部時間）</text>
    <text x="365" y="134" font-size="11" fill="#52514e" text-anchor="middle">発動予定だった</text>

    <path d="M465 115 L495 115" stroke="#c3c2b7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="500" y="70" width="180" height="90" rx="8" fill="#eef4fb" stroke="#2a78d6"/>
    <text x="590" y="96" font-size="12" font-weight="700" fill="#2a78d6" text-anchor="middle">8月18日</text>
    <text x="590" y="118" font-size="11" fill="#0b0b0b" text-anchor="middle">土壇場で3日間の</text>
    <text x="590" y="134" font-size="11" fill="#0b0b0b" text-anchor="middle">発動停止を表明</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c3c2b7"/>
    </marker>
  </defs>

  <rect x="24" y="200" width="672" height="70" rx="8" fill="#f9f9f7"/>
  <text x="44" y="228" font-size="12" fill="#52514e">対象品目：ワイン・乳製品・木製家具など約200億ドル（約3兆2,000億円）相当</text>
  <text x="44" y="250" font-size="12" fill="#52514e">トランプ大統領：「文書の最終確定を条件に、カナダと合意したため」停止と説明</text>
</svg>
