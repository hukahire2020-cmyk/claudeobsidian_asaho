<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="38" font-size="17" font-weight="700" fill="#0b0b0b">Gemini 3.8 Flash / 3.8 Flash Cyber——3週間で3度目の更新</text>
  <text x="30" y="58" font-size="12" fill="#898781">2026年9月3日発表</text>

  <!-- timeline of release cadence -->
  <text x="30" y="90" font-size="12" font-weight="700" fill="#0b0b0b">Flashモデルの更新ペース</text>
  <line x1="40" y1="115" x2="680" y2="115" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="120" cy="115" r="5" fill="#898781"/>
  <text x="120" y="140" font-size="11" text-anchor="middle" fill="#52514e">3.7 Flash</text>
  <circle cx="400" cy="115" r="7" fill="#2a78d6"/>
  <text x="400" y="140" font-size="11" text-anchor="middle" fill="#2a78d6" font-weight="700">3週間後</text>
  <circle cx="620" cy="115" r="7" fill="#2a78d6"/>
  <text x="620" y="140" font-size="11" text-anchor="middle" fill="#0b0b0b" font-weight="700">3.8 Flash / Cyber</text>
  <text x="620" y="156" font-size="10" text-anchor="middle" fill="#898781">9/3</text>

  <!-- two model comparison -->
  <g>
    <rect x="30" y="180" width="320" height="130" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="50" y="205" font-size="13" font-weight="700" fill="#0b0b0b">Gemini 3.8 Flash</text>
    <text x="50" y="228" font-size="11" fill="#52514e">DeepSWE v1.1（長時間コーディング評価）</text>
    <text x="50" y="244" font-size="11" fill="#52514e">で大型フロンティアモデルの多くを上回る</text>
    <text x="50" y="270" font-size="11" fill="#52514e">料金: 入力$0.75 / 出力$3.75（100万トークン）</text>
    <text x="50" y="288" font-size="11" fill="#898781">＝3.7 Flashと同一料金</text>
  </g>
  <g>
    <rect x="370" y="180" width="320" height="130" rx="8" fill="#d03b3b" opacity="0.06" stroke="#d03b3b"/>
    <text x="390" y="205" font-size="13" font-weight="700" fill="#0b0b0b">Gemini 3.8 Flash Cyber</text>
    <text x="390" y="228" font-size="11" fill="#52514e">脆弱性検出・自動パッチ適用に特化</text>
    <text x="390" y="252" font-size="11" fill="#52514e">「Fairwind Program」経由で提供</text>
    <text x="390" y="270" font-size="11" fill="#52514e">政府機関・重要インフラ事業者・</text>
    <text x="390" y="288" font-size="11" fill="#52514e">ソフトウェアメンテナーに優先アクセス</text>
  </g>
</svg>
