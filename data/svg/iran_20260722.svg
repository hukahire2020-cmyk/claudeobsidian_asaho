<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#0b0b0b">イラン戦争 144日目 — 戦線がサウジ沖まで拡大</text>
  <!-- left: timeline -->
  <rect x="28" y="60" width="330" height="212" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="48" y="86" font-size="13" font-weight="700" fill="#0b0b0b">経緯</text>
  <line x1="60" y1="100" x2="60" y2="250" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="60" cy="106" r="4" fill="#d03b3b"/>
  <text x="74" y="110" font-size="11.5" fill="#0b0b0b">2/28 開戦</text>
  <circle cx="60" cy="140" r="4" fill="#898781"/>
  <text x="74" y="144" font-size="11.5" fill="#0b0b0b">4/8 一時停戦</text>
  <circle cx="60" cy="174" r="4" fill="#898781"/>
  <text x="74" y="178" font-size="11.5" fill="#0b0b0b">6/17 停戦覚書署名</text>
  <circle cx="60" cy="208" r="4" fill="#d03b3b"/>
  <text x="74" y="212" font-size="11.5" fill="#0b0b0b">7/8 停戦崩壊・再空爆</text>
  <circle cx="60" cy="242" r="4.5" fill="#d03b3b"/>
  <text x="74" y="240" font-size="11.5" font-weight="700" fill="#d03b3b">7/21 フーシ派がサウジ沖封鎖</text>
  <text x="74" y="255" font-size="10.5" fill="#898781">10日間停戦案を協議中・未合意</text>
  <!-- right: stat tiles -->
  <rect x="374" y="60" width="318" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="394" y="86" font-size="12.5" font-weight="700" fill="#0b0b0b">米戦費（7/21時点）</text>
  <text x="394" y="135" font-size="30" font-weight="700" fill="#d03b3b">375億ドル</text>
  <text x="394" y="152" font-size="11" fill="#52514e">開戦以来の累計・約6兆円相当</text>
  <rect x="374" y="172" width="318" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="394" y="198" font-size="12.5" font-weight="700" fill="#0b0b0b">サウジ原油積み出し（2週間）</text>
  <text x="394" y="247" font-size="30" font-weight="700" fill="#d03b3b">▲34%</text>
  <text x="394" y="264" font-size="11" fill="#52514e">フーシ派の海上封鎖宣言後</text>
</svg>
