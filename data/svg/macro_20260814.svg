<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="238" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">国際政治×マクロ経済 — 因果チェーン（2026年8月14日）</text>

  <!-- causal chain boxes -->
  <rect x="24" y="60" width="150" height="56" rx="6" fill="#eef4fb" stroke="#c3c2b7"/>
  <text x="99" y="84" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">米CPI・PPI</text>
  <text x="99" y="102" font-size="11" fill="#52514e" text-anchor="middle">揃って鈍化</text>

  <path d="M 178 88 L 200 88" stroke="#898781" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="206" y="60" width="150" height="56" rx="6" fill="#eef4fb" stroke="#c3c2b7"/>
  <text x="281" y="84" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">FRB早期利上げ</text>
  <text x="281" y="102" font-size="11" fill="#52514e" text-anchor="middle">観測が後退</text>

  <path d="M 360 88 L 382 88" stroke="#898781" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="388" y="60" width="150" height="56" rx="6" fill="#eef4fb" stroke="#c3c2b7"/>
  <text x="463" y="84" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">AI・半導体株</text>
  <text x="463" y="102" font-size="11" fill="#52514e" text-anchor="middle">米・日で資金流入</text>

  <path d="M 542 88 L 564 88" stroke="#898781" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="570" y="60" width="126" height="56" rx="6" fill="#2a78d6" opacity="0.12" stroke="#2a78d6"/>
  <text x="633" y="84" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="700">日経平均</text>
  <text x="633" y="102" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="700">一時69,000円台</text>

  <!-- bottom data strip -->
  <rect x="24" y="144" width="672" height="72" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="168" font-size="12" fill="#52514e">日経平均: 一時1,000円超上昇 → 69,000円台</text>
  <text x="44" y="190" font-size="12" fill="#52514e">ドル円: 159円台半ばで推移</text>
  <text x="400" y="168" font-size="12" font-weight="700" fill="#0b0b0b">役員と話すときの要点</text>
  <text x="400" y="190" font-size="11.5" fill="#52514e">インフレ鈍化でAI・半導体株優勢の地合い</text>

  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#898781"/>
    </marker>
  </defs>
</svg>
