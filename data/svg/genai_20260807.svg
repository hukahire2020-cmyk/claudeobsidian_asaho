<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0b0b0b">株価は調整、しかし設備投資は上方修正——クラウド大手のcapex</text>

  <text x="28" y="70" font-size="12.5" font-weight="700" fill="#52514e">2026年通期 設備投資（capex）見通しの上方修正</text>

  <text x="28" y="98" font-size="12" fill="#0b0b0b">Amazon（AWS）</text>
  <rect x="150" y="86" width="182" height="18" rx="4" fill="#e1e0d9"/>
  <text x="240" y="99" font-size="10.5" fill="#52514e" text-anchor="middle">従来 2,000億ドル</text>
