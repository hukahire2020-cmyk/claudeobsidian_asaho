<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="258" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">因果チェーン：紅海リスクとNVIDIA決算の綱引き</text>

  <!-- chain boxes -->
  <rect x="24" y="60" width="150" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="99" y="88" font-size="11" fill="#0b0b0b" text-anchor="middle">フーシ派が</text>
  <text x="99" y="104" font-size="11" fill="#0b0b0b" text-anchor="middle">サウジタンカー攻撃</text>
  <text x="99" y="122" font-size="11" fill="#d03b3b" text-anchor="middle">(紅海封鎖継続)</text>
  <text x="182" y="106" font-size="18" fill="#898781">→</text>

  <rect x="198" y="60" width="150" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="273" y="88" font-size="11" fill="#0b0b0b" text-anchor="middle">供給不安と米イラン</text>
  <text x="273" y="104" font-size="11" fill="#0b0b0b" text-anchor="middle">緊張緩和観測が</text>
  <text x="273" y="122" font-size="11" fill="#0b0b0b" text-anchor="middle">綱引き</text>
  <text x="356" y="106" font-size="18" fill="#898781">→</text>

  <rect x="372" y="60" width="150" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="447" y="88" font-size="11" fill="#0b0b0b" text-anchor="middle">原油は高値圏でも</text>
  <text x="447" y="104" font-size="11" fill="#0b0b0b" text-anchor="middle">方向感を欠く</text>
  <text x="447" y="122" font-size="11" fill="#2a78d6" text-anchor="middle">(Brent 約$92)</text>
  <text x="530" y="106" font-size="18" fill="#898781">→</text>

  <rect x="546" y="60" width="150" height="80" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="621" y="88" font-size="11" fill="#0b0b0b" text-anchor="middle">NVIDIA決算(8/26)</text>
  <text x="621" y="104" font-size="11" fill="#0b0b0b" text-anchor="middle">控え日本株は</text>
  <text x="621" y="122" font-size="11" fill="#008300" text-anchor="middle">様子見（+328円）</text>

  <rect x="24" y="165" width="672" height="76" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="190" font-size="12" fill="#0b0b0b" font-weight="700">ドル円 159円44〜45銭（8/25、前日比0.29円円安）</text>
  <text x="44" y="212" font-size="12" fill="#0b0b0b" font-weight="700">日経平均 65,856円43銭（8/25終値、前日比+328円34銭）</text>
  <text x="44" y="230" font-size="11" fill="#898781">出典: みんかぶ・日本経済新聞（8/25）</text>
</svg>
