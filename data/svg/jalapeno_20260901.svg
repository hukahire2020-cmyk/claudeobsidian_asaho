<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="718" height="378" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="42" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#0b0b0b">OpenAI自社チップ「Jalapeño」実測結果</text>
  <text x="30" y="64" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#898781">Nvidia GB200/GB300比（InferenceXベンチマーク・3モデル平均レンジ）</text>

  <!-- throughput bar -->
  <text x="60" y="105" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#0b0b0b" font-weight="700">電力あたりスループット</text>
  <rect x="60" y="112" width="300" height="24" rx="4" fill="#e1e0d9"/>
  <text x="150" y="129" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#52514e" text-anchor="middle">Nvidia比 1.0倍（基準）</text>
  <rect x="60" y="146" width="540" height="24" rx="4" fill="#2a78d6"/>
  <text x="330" y="163" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Jalapeño：1.5〜1.9倍</text>

  <!-- latency bar (inverted: lower is better, shown as shorter bar) -->
  <text x="60" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#0b0b0b" font-weight="700">エンドツーエンド遅延（短いほど良い）</text>
  <rect x="60" y="217" width="540" height="24" rx="4" fill="#e1e0d9"/>
  <text x="330" y="234" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#52514e" text-anchor="middle">Nvidia比 1.0倍（基準）</text>
  <rect x="60" y="251" width="160" height="24" rx="4" fill="#008300"/>
  <text x="140" y="268" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">最大3.6分の1</text>

  <rect x="60" y="295" width="600" height="60" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="80" y="316" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#52514e">2026年8月25日、Hot Chips 2026にて公式発表。GPT-OSS 120B・DeepSeek R1 670B・</text>
  <text x="80" y="334" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#52514e">Kimi K2.5 1Tの3モデルで測定。Broadcomと共同開発の推論特化ASIC。</text>
</svg>
