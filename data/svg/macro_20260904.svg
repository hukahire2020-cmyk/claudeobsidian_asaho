<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="36" font-size="17" font-weight="700" fill="#0b0b0b">日銀利上げ観測 → 円高・株高の因果チェーン（9/4）</text>

  <g font-size="11" fill="#0b0b0b">
    <rect x="30" y="70" width="150" height="70" rx="6" fill="#f9f9f7" stroke="#c3c2b7"/>
    <text x="105" y="98" text-anchor="middle">日銀9月利上げ</text>
    <text x="105" y="114" text-anchor="middle">観測 約8割</text>
    <text x="105" y="130" text-anchor="middle" fill="#898781">0.25%→1.25%</text>
    <path d="M184 105 L206 105" stroke="#898781" stroke-width="2" marker-end="url(#arrow3)"/>

    <rect x="210" y="70" width="150" height="70" rx="6" fill="#f9f9f7" stroke="#c3c2b7"/>
    <text x="285" y="98" text-anchor="middle">円買い優勢</text>
    <text x="285" y="114" text-anchor="middle" fill="#2a78d6" font-weight="700">ドル円155円台</text>
    <text x="285" y="130" text-anchor="middle" fill="#898781">約1カ月ぶり高値</text>
    <path d="M364 105 L386 105" stroke="#898781" stroke-width="2" marker-end="url(#arrow3)"/>

    <rect x="390" y="70" width="150" height="70" rx="6" fill="#f9f9f7" stroke="#c3c2b7"/>
    <text x="465" y="98" text-anchor="middle">米ISM非製造業</text>
    <text x="465" y="114" text-anchor="middle">55.4（予想上振れ）</text>
    <text x="465" y="130" text-anchor="middle" fill="#898781">＋半導体株買い戻し</text>
    <path d="M544 105 L566 105" stroke="#898781" stroke-width="2" marker-end="url(#arrow3)"/>

    <rect x="570" y="70" width="120" height="70" rx="6" fill="#008300" opacity="0.10" stroke="#008300"/>
    <text x="630" y="98" text-anchor="middle" font-weight="700" fill="#008300">日経平均</text>
    <text x="630" y="118" text-anchor="middle" font-weight="700" fill="#008300">+806円</text>
    <text x="630" y="134" text-anchor="middle" fill="#898781">65,020円</text>
  </g>
  <defs>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#898781"/>
    </marker>
  </defs>

  <rect x="30" y="180" width="660" height="90" rx="6" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="50" y="208" font-size="12" font-weight="700" fill="#0b0b0b">役員と話すときの要点はこれだけ</text>
  <text x="50" y="234" font-size="12" fill="#52514e">日銀の利上げ確度が上がり、円は主要通貨の中でも強含みに転じつつある。</text>
  <text x="50" y="254" font-size="12" fill="#52514e">輸入コストは軽くなる一方、円安を追い風にしてきた外需企業の増益ペースは鈍り始める。</text>
</svg>
