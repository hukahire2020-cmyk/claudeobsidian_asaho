<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="34" font-size="17" font-weight="700" fill="#0b0b0b">オープンエイト：AIオーケストレーション事業を開始</text>

  <rect x="28" y="54" width="200" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="128" y="94" font-size="24" font-weight="700" fill="#2a78d6" text-anchor="middle">3,200万件+</text>
  <text x="128" y="116" font-size="11.5" fill="#52514e" text-anchor="middle">蓄積ビジネス</text>
  <text x="128" y="132" font-size="11.5" fill="#52514e" text-anchor="middle">コンテキストデータ</text>

  <rect x="260" y="54" width="200" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="94" font-size="24" font-weight="700" fill="#008300" text-anchor="middle">50万本+</text>
  <text x="360" y="116" font-size="11.5" fill="#52514e" text-anchor="middle">「Video BRAIN」で</text>
  <text x="360" y="132" font-size="11.5" fill="#52514e" text-anchor="middle">作成されたビジネス動画</text>

  <rect x="492" y="54" width="200" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="592" y="94" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="middle">約半数</text>
  <text x="592" y="116" font-size="11.5" fill="#52514e" text-anchor="middle">日経225構成企業の</text>
  <text x="592" y="132" font-size="11.5" fill="#52514e" text-anchor="middle">顧客基盤を含む</text>

  <line x1="28" y1="176" x2="692" y2="176" stroke="#c3c2b7"/>

  <text x="28" y="200" font-size="12" font-weight="700" fill="#0b0b0b">2026年8月11日発表：第一弾サービス「8AI Studio」</text>
  <text x="28" y="224" font-size="11.5" fill="#52514e">蓄積データを基盤に、目的に応じて最適なAIを自動選択・生成</text>
  <text x="28" y="244" font-size="11.5" fill="#52514e">企業の情報資産をAI活用へつなぐ新たなAI基盤として展開</text>
  <text x="28" y="270" font-size="11" fill="#898781">出典: オープンエイト公式（8/11）</text>
</svg>
