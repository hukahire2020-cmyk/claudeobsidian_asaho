<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="318" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">北方領土訪問から大使呼び出しまで、6日間の経緯</text>

  <!-- timeline -->
  <line x1="60" y1="90" x2="660" y2="90" stroke="#c3c2b7" stroke-width="2"/>

  <!-- point 1 -->
  <circle cx="100" cy="90" r="6" fill="#d03b3b"/>
  <text x="100" y="70" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">8/12-13</text>
  <text x="100" y="120" font-size="11" fill="#52514e" text-anchor="middle">プーチン氏が</text>
  <text x="100" y="134" font-size="11" fill="#52514e" text-anchor="middle">択捉島を初訪問</text>

  <!-- point 2 -->
  <circle cx="280" cy="90" r="6" fill="#2a78d6"/>
  <text x="280" y="70" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">8/13</text>
  <text x="280" y="120" font-size="11" fill="#52514e" text-anchor="middle">高市首相が</text>
  <text x="280" y="134" font-size="11" fill="#52514e" text-anchor="middle">「強く抗議」を表明</text>

  <!-- point 3 -->
  <circle cx="460" cy="90" r="6" fill="#d03b3b"/>
  <text x="460" y="70" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">8/17</text>
  <text x="460" y="120" font-size="11" fill="#52514e" text-anchor="middle">ラブロフ外相が</text>
  <text x="460" y="134" font-size="11" fill="#52514e" text-anchor="middle">日本大使の呼び出しを表明</text>

  <!-- point 4 -->
  <circle cx="620" cy="90" r="6" fill="#d03b3b"/>
  <text x="620" y="70" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">8/18</text>
  <text x="620" y="120" font-size="11" fill="#52514e" text-anchor="middle">武藤大使が</text>
  <text x="620" y="134" font-size="11" fill="#52514e" text-anchor="middle">露外務省で抗議受領</text>

  <rect x="24" y="180" width="672" height="110" rx="8" fill="#f9f9f7"/>
  <text x="44" y="208" font-size="12" font-weight="700" fill="#0b0b0b">ロシア側の発言（8/17-18）</text>
  <text x="44" y="232" font-size="12" fill="#52514e">ラブロフ外相：「プーチン氏がロシア領内を訪問できないという発言は</text>
  <text x="44" y="250" font-size="12" fill="#52514e">到底容認できず、礼節の一線を越えている」</text>
  <text x="44" y="272" font-size="12" fill="#d03b3b" font-weight="700">ガルージン外務次官：「（ロシアには）適切な対抗措置を取る権利がある」</text>
</svg>
