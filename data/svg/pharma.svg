  <rect x="28" y="122" width="260" height="44" rx="4" fill="#3987e5"/>
  <text x="48" y="149" font-size="13" font-weight="700" fill="#ffffff">最終段階の試験へ 15〜20本（2026年中）</text>
  <rect x="28" y="174" width="120" height="44" rx="4" fill="#1c5cab"/>
  <text x="48" y="201" font-size="13" font-weight="700" fill="#ffffff">承認 0本</text>
