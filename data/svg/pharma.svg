  <rect x="490" y="70" width="202" height="148" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="510" y="96" font-size="12.5" font-weight="700" fill="#0b0b0b">FDAのルールの線引き</text>
  <text x="510" y="122" font-size="11.5" fill="#52514e">「分子をどう発明したかは</text>
  <text x="510" y="139" font-size="11.5" fill="#52514e">問わない。安全性・有効性の</text>
