<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="38" font-size="17" font-weight="700" fill="#0b0b0b">国際政治×マクロ経済——因果チェーン</text>
  <text x="30" y="58" font-size="12" fill="#898781">2026年8月時点</text>

  <!-- causal chain boxes -->
  <rect x="20" y="90" width="150" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="95" y="115" font-size="11" text-anchor="middle" fill="#0b0b0b" font-weight="700">米関税拡大</text>
  <text x="95" y="133" font-size="10" text-anchor="middle" fill="#52514e">ドローン232条</text>
  <text x="95" y="147" font-size="10" text-anchor="middle" fill="#52514e">(9月発動)</text>

  <text x="180" y="130" font-size="18" fill="#c3c2b7">→</text>

  <rect x="200" y="90" width="150" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="275" y="115" font-size="11" text-anchor="middle" fill="#0b0b0b" font-weight="700">実効関税率高止まり</text>
  <text x="275" y="140" font-size="15" text-anchor="middle" fill="#d03b3b" font-weight="700">17.9〜18.0%</text>

  <text x="360" y="130" font-size="18" fill="#c3c2b7">→</text>

  <rect x="380" y="90" width="150" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="455" y="115" font-size="11" text-anchor="middle" fill="#0b0b0b" font-weight="700">インフレ長期化観測</text>
  <text x="455" y="133" font-size="10" text-anchor="middle" fill="#52514e">FRB利下げ</text>
  <text x="455" y="147" font-size="10" text-anchor="middle" fill="#52514e">ペース抑制</text>

  <text x="540" y="130" font-size="18" fill="#c3c2b7">→</text>

  <rect x="560" y="90" width="140" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="630" y="115" font-size="11" text-anchor="middle" fill="#0b0b0b" font-weight="700">ドル高・円安</text>
  <text x="630" y="140" font-size="14" text-anchor="middle" fill="#2a78d6" font-weight="700">159円接近</text>

  <!-- market tiles -->
  <rect x="30" y="200" width="200" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="46" y="225" font-size="11" fill="#898781">ドル円(8/21 NY終値)</text>
  <text x="46" y="255" font-size="22" font-weight="700" fill="#0b0b0b">158.95〜159.05円</text>

  <rect x="250" y="200" width="200" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="266" y="225" font-size="11" fill="#898781">日経平均(8/21終値)</text>
  <text x="266" y="255" font-size="20" font-weight="700" fill="#0b0b0b">66,016.36円</text>
  <text x="266" y="273" font-size="11" fill="#d03b3b">前日比 -200.43円</text>

  <rect x="470" y="200" width="220" height="90" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="486" y="225" font-size="11" fill="#898781">次回会合</text>
  <text x="486" y="250" font-size="13" fill="#0b0b0b">FOMC 9/15-16</text>
  <text x="486" y="270" font-size="13" fill="#0b0b0b">日銀 9/18</text>

  <rect x="30" y="315" width="660" height="48" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="46" y="343" font-size="12" fill="#52514e">役員と話すときの要点: 米国の高関税は一時的な交渉カードではなく恒常水準として定着しつつある</text>
</svg>
