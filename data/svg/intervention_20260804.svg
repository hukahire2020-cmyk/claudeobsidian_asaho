<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#0b0b0b">28年ぶりの日米協調介入——円は160円台から155円台へ急伸</text>

  <g font-size="12" text-anchor="middle">
    <rect x="28" y="58" width="200" height="56" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="128" y="80" font-weight="700" fill="#0b0b0b">7月中〜下旬</text>
    <text x="128" y="99" font-size="10.5" fill="#52514e">円安進行、ドル円160円台まで下落</text>

    <rect x="260" y="58" width="200" height="56" rx="8" fill="#fcfcfb" stroke="#d03b3b" stroke-width="1.5"/>
    <text x="360" y="80" font-weight="700" fill="#d03b3b">7/31 NY時間</text>
    <text x="360" y="99" font-size="10.5" fill="#52514e">日米協調で円買い・ドル売り介入実施</text>

    <rect x="492" y="58" width="200" height="56" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="592" y="80" font-weight="700" fill="#2a78d6">8/3</text>
    <text x="592" y="99" font-size="10.5" fill="#52514e">片山財務相が談話発表、円155円台へ</text>
  </g>
  <path d="M228 86 h24 m-8 -6 8 6 -8 6" stroke="#898781" stroke-width="2" fill="none"/>
  <path d="M460 86 h24 m-8 -6 8 6 -8 6" stroke="#898781" stroke-width="2" fill="none"/>

  <rect x="28" y="130" width="150" height="94" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="103" y="152" font-size="12" fill="#52514e" text-anchor="middle">介入の位置づけ</text>
  <text x="103" y="185" font-size="22" font-weight="700" fill="#d03b3b" text-anchor="middle">28年ぶり</text>
  <text x="103" y="208" font-size="10.5" fill="#898781" text-anchor="middle">円買い協調介入は1998年以来</text>

  <rect x="186" y="130" width="150" height="94" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="261" y="152" font-size="12" fill="#52514e" text-anchor="middle">ドル円（8/3高値）</text>
  <text x="261" y="188" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="middle">155円台</text>
  <text x="261" y="208" font-size="10.5" fill="#898781" text-anchor="middle">約3カ月ぶり水準</text>

  <rect x="344" y="130" width="150" height="94" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="419" y="152" font-size="12" fill="#52514e" text-anchor="middle">日経平均（8/3終値）</text>
  <text x="419" y="188" font-size="24" font-weight="700" fill="#d03b3b" text-anchor="middle">▲607円</text>
  <text x="419" y="208" font-size="10.5" fill="#898781" text-anchor="middle">63,754.90円・3日ぶり反落</text>

  <rect x="502" y="130" width="190" height="94" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="597" y="152" font-size="12" fill="#52514e" text-anchor="middle">介入の主体</text>
  <text x="597" y="185" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="middle">財務省＋米財務省</text>
  <text x="597" y="208" font-size="10.5" fill="#898781" text-anchor="middle">NY連銀がユーロ売り・円買いで参加</text>

  <rect x="28" y="240" width="664" height="40" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="42" y="258" font-size="11.5" fill="#0b0b0b" font-weight="700">財務省「更なる協調介入も躊躇しない」——単独介入では止められない局面に</text>
  <text x="42" y="274" font-size="10.5" fill="#898781">出典: 財務省・片山財務大臣談話（2026/8/3）</text>
</svg>
