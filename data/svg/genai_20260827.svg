<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#0b0b0b">OpenAI「o3」モデルサンセット——90日間の移行猶予を経て正式引退</text>

  <line x1="60" y1="140" x2="660" y2="140" stroke="#c3c2b7" stroke-width="2"/>

  <circle cx="100" cy="140" r="8" fill="#2a78d6"/>
  <text x="100" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">5月28日</text>
  <text x="100" y="168" text-anchor="middle" font-size="12" fill="#52514e">廃止方針を発表</text>
  <text x="100" y="184" text-anchor="middle" font-size="11" fill="#898781">90日間の移行猶予開始</text>

  <circle cx="380" cy="140" r="9" fill="#d03b3b"/>
  <text x="380" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">8月26日</text>
  <text x="380" y="168" text-anchor="middle" font-size="12" fill="#52514e">ChatGPTから正式引退</text>
  <text x="380" y="184" text-anchor="middle" font-size="11" fill="#898781">猶予期間終了</text>

  <circle cx="620" cy="140" r="8" fill="#c3c2b7"/>
  <text x="620" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">12月11日</text>
  <text x="620" y="168" text-anchor="middle" font-size="12" fill="#52514e">API提供終了予定</text>
  <text x="620" y="184" text-anchor="middle" font-size="11" fill="#898781">gpt-5.6-solへ移行</text>

  <rect x="24" y="216" width="672" height="72" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#0b0b0b">GPT-5.6ファミリーが多くのワークロードで既定モデルに</text>
  <text x="360" y="268" text-anchor="middle" font-size="12" fill="#52514e">旧世代モデルの整理とAPI仕様統合が並行して進行</text>

  <text x="24" y="320" font-size="11" fill="#898781">出典：Forkast（8/26）／OpenAI Deprecations公式ドキュメント</text>
</svg>
