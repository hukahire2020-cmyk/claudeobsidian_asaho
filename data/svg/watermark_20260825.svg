<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">Claudeの生成テキストに電子透かしを標準搭載</text>
  <text x="24" y="54" font-size="12" fill="#898781">2026年8月2日以降のリリースモデルから適用</text>

  <!-- flow -->
  <rect x="30" y="90" width="150" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="105" y="118" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">Claudeが</text>
  <text x="105" y="136" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">テキストを生成</text>

  <path d="M185 125 L235 125" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="240" y="90" width="180" height="70" rx="8" fill="#f9f9f7" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="330" y="112" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">SynthID Text方式で</text>
  <text x="330" y="130" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">単語選択パターンに</text>
  <text x="330" y="148" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">機械可読な印を埋込</text>

  <path d="M425 125 L475 125" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="480" y="90" width="190" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="575" y="112" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">署名付き来歴情報を</text>
  <text x="575" y="130" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">ファイルに付与</text>
  <text x="575" y="148" font-size="11" fill="#52514e" text-anchor="middle">（目視では見えない）</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2a78d6"/>
    </marker>
  </defs>

  <rect x="24" y="190" width="672" height="110" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="48" y="218" font-size="13" font-weight="700" fill="#0b0b0b">目的: EU AI法の透明性義務への対応</text>
  <text x="48" y="242" font-size="12" fill="#52514e">・AIチャットとの対話は利用者に明示する義務</text>
  <text x="48" y="262" font-size="12" fill="#52514e">・AI生成の画像・音声・動画には「AI製」とわかる印が必要</text>
  <text x="48" y="282" font-size="12" fill="#52514e">・Anthropicは「他社も追随する」との見方を提示</text>

  <text x="24" y="322" font-size="10" fill="#898781">出典: GIGAZINE (8/17) / Business Insider Japan (8月)</text>
</svg>
