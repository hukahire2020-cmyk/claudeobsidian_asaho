  <text x="340" y="137" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">5〜10人のクルーで半日以上</text>

  <text x="28" y="176" font-size="12" fill="#0b0b0b">Gemini（Nano Banana）・Veoによる生成AI</text>
  <rect x="28" y="184" width="40" height="34" rx="6" fill="#2a78d6"/>
  <text x="120" y="205" font-size="14" font-weight="700" fill="#2a78d6">1人・5〜10分</text>

  <rect x="28" y="234" width="200" height="86" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="128" y="256" font-size="12" fill="#52514e" text-anchor="middle">運営体制</text>
  <text x="128" y="292" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="middle">1,000店舗超を</text>
  <text x="128" y="312" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="middle">社員500人以下</text>

  <rect x="240" y="234" width="200" height="86" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="340" y="256" font-size="12" fill="#52514e" text-anchor="middle">アプリ通知開封率</text>
  <text x="340" y="300" font-size="30" font-weight="700" fill="#008300" text-anchor="middle">1.5倍</text>

  <rect x="452" y="234" width="240" height="86" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
