<svg viewBox="0 0 720 366" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="364" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
