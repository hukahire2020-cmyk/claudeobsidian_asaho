<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="358" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" stroke-width="1"/>
  <text x="24" y="34" font-size="17" font-weight="bold" fill="#0b0b0b">Salesforce: Agentforce導入でサポート人員を9,000人→5,000人へ</text>
  <text x="24" y="54" font-size="11" fill="#898781">出典: CNBC・The Register・TechRadar（ベニオフCEO発言）</text>

  <!-- Bar chart -->
  <line x1="120" y1="290" x2="600" y2="290" stroke="#c3c2b7"/>

  <rect x="180" y="90" width="110" height="200" rx="4" fill="#898781"/>
  <text x="235" y="80" font-size="20" font-weight="bold" fill="#0b0b0b" text-anchor="middle">9,000人</text>
  <text x="235" y="310" font-size="12" fill="#52514e" text-anchor="middle">2025年初頭</text>

  <rect x="430" y="179" width="110" height="111" rx="4" fill="#2a78d6"/>
  <text x="485" y="169" font-size="20" font-weight="bold" fill="#2a78d6" text-anchor="middle">5,000人</text>
  <text x="485" y="310" font-size="12" fill="#52514e" text-anchor="middle">現在</text>

  <!-- arrow -->
  <path d="M 300 190 L 420 190" stroke="#d03b3b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d03b3b"/>
    </marker>
  </defs>
  <text x="360" y="178" font-size="11" fill="#d03b3b" text-anchor="middle">▲44%減</text>

  <line x1="24" y1="322" x2="696" y2="322" stroke="#e1e0d9"/>
  <text x="24" y="344" font-size="11.5" fill="#52514e">対応比率: AIエージェント <tspan font-weight="bold" fill="#2a78d6">50%</tspan> / 人間 50%　　サポートコスト <tspan font-weight="bold" fill="#008300">▲17%</tspan></text>
</svg>
