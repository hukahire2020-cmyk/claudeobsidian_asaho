<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="418" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">米イラン紛争、再び激化——原油急伸・日経平均は全面安</text>
  <text x="24" y="54" font-size="11" fill="#898781">2026年2月開戦から半年、停戦と再燃を繰り返す</text>

  <!-- timeline -->
  <line x1="50" y1="110" x2="670" y2="110" stroke="#c3c2b7" stroke-width="2"/>
  <!-- node 1 -->
  <circle cx="90" cy="110" r="6" fill="#898781"/>
  <text x="90" y="95" font-size="11" fill="#52514e" text-anchor="middle">2/28</text>
  <text x="90" y="135" font-size="11" fill="#0b0b0b" text-anchor="middle">米・イスラエル</text>
  <text x="90" y="149" font-size="11" fill="#0b0b0b" text-anchor="middle">がイラン攻撃開始</text>
  <!-- node 2 -->
  <circle cx="270" cy="110" r="6" fill="#898781"/>
  <text x="270" y="95" font-size="11" fill="#52514e" text-anchor="middle">7/22-23</text>
  <text x="270" y="135" font-size="11" fill="#0b0b0b" text-anchor="middle">フーシ派が</text>
  <text x="270" y="149" font-size="11" fill="#0b0b0b" text-anchor="middle">サウジタンカー攻撃</text>
  <!-- node 3 -->
  <circle cx="450" cy="110" r="7" fill="#d03b3b"/>
  <text x="450" y="95" font-size="11" fill="#52514e" text-anchor="middle" font-weight="700">8/30</text>
  <text x="450" y="135" font-size="11" fill="#0b0b0b" text-anchor="middle">米中央軍がララク島の</text>
  <text x="450" y="149" font-size="11" fill="#0b0b0b" text-anchor="middle">イラン発射台を攻撃</text>
  <!-- node 4 -->
  <circle cx="630" cy="110" r="8" fill="#d03b3b"/>
  <text x="630" y="95" font-size="11" fill="#d03b3b" text-anchor="middle" font-weight="700">9/1-2</text>
  <text x="630" y="135" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">結婚式場に破片直撃</text>
  <text x="630" y="149" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">4人死亡・50人超負傷</text>

  <!-- stat tiles -->
  <rect x="24" y="185" width="205" height="200" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="215" font-size="11" fill="#52514e">ブレント原油先物（9/2）</text>
  <text x="44" y="255" font-size="34" font-weight="700" fill="#d03b3b">96.18<tspan font-size="15" fill="#52514e">ドル/bbl</tspan></text>
  <text x="44" y="278" font-size="11" fill="#898781">前日+約5%、5週間ぶり高値</text>
  <text x="44" y="296" font-size="11" fill="#898781">WTIは91.65ドル</text>

  <rect x="257" y="185" width="205" height="200" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="277" y="215" font-size="11" fill="#52514e">日経平均株価（9/2終値）</text>
  <text x="277" y="255" font-size="30" font-weight="700" fill="#d03b3b">64,325円</text>
  <text x="277" y="278" font-size="13" fill="#d03b3b" font-weight="700">前日比 -1,889円70銭</text>
  <text x="277" y="296" font-size="11" fill="#898781">3日続落・全33業種が下落</text>

  <rect x="490" y="185" width="206" height="200" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="510" y="215" font-size="11" fill="#52514e">国内長期金利（10年債）</text>
  <text x="510" y="255" font-size="30" font-weight="700" fill="#2a78d6">3.015<tspan font-size="15" fill="#52514e">%</tspan></text>
  <text x="510" y="278" font-size="11" fill="#898781">1996年9月以来の高水準</text>
  <text x="510" y="296" font-size="11" fill="#898781">原油高・地政学リスクを警戒</text>

  <text x="24" y="405" font-size="10" fill="#898781">出典: AFP／jp.investing.com／財経新聞（各9/1-9/2）</text>
</svg>
