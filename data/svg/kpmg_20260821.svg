<svg viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="318" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#0b0b0b">KPMGジャパン: AIコンサル人材を800人へ倍増</text>
  <text x="24" y="60" font-size="12" fill="#52514e">日本経済新聞 2026年8月19日報道 — 新組織「KPMG AiX」新設</text>

  <rect x="24" y="82" width="220" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="134" y="128" font-size="30" font-weight="800" fill="#2a78d6" text-anchor="middle">800人</text>
  <text x="134" y="150" font-size="11.5" fill="#52514e" text-anchor="middle">2029年までのAI専門</text>
  <text x="134" y="166" font-size="11.5" fill="#52514e" text-anchor="middle">コンサルタント目標（倍増）</text>

  <rect x="256" y="82" width="220" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="366" y="128" font-size="30" font-weight="800" fill="#0b0b0b" text-anchor="middle">7社</text>
  <text x="366" y="150" font-size="11.5" fill="#52514e" text-anchor="middle">「KPMG AiX」に横断参加</text>
  <text x="366" y="166" font-size="11.5" fill="#52514e" text-anchor="middle">（アドバイザリー・あずさ監査法人等）</text>

  <rect x="488" y="82" width="208" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="592" y="128" font-size="30" font-weight="800" fill="#008300" text-anchor="middle">3経路</text>
  <text x="592" y="150" font-size="11.5" fill="#52514e" text-anchor="middle">新卒・中途・社内</text>
  <text x="592" y="166" font-size="11.5" fill="#52514e" text-anchor="middle">リスキリングで増員</text>

  <rect x="24" y="200" width="672" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="226" font-size="12.5" fill="#0b0b0b" font-weight="600">AIで業務が効率化された結果生じる余剰人員も</text>
  <text x="44" y="248" font-size="12.5" fill="#0b0b0b" font-weight="600">リスキリングの上でグループ内へ再配置する方針</text>

  <text x="24" y="298" font-size="10.5" fill="#898781">出典: 日本経済新聞(8/19)</text>
</svg>
