<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="358" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#0b0b0b">Stripe、OpenRouterを買収</text>
  <text x="24" y="60" font-size="12" fill="#52514e">2026年8月19日確認 — AIインフラで記録的M&amp;A</text>

  <!-- hero stat -->
  <rect x="24" y="82" width="330" height="110" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="189" y="130" font-size="40" font-weight="800" fill="#2a78d6" text-anchor="middle">$7.5B~</text>
  <text x="189" y="155" font-size="12" fill="#52514e" text-anchor="middle">買収額（NYT報道／創業者$15億・投資家$60億）</text>
  <text x="189" y="172" font-size="10.5" fill="#898781" text-anchor="middle">Axios報道では$8億ドル超（主に株式）</text>

  <rect x="366" y="82" width="330" height="110" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="531" y="122" font-size="30" font-weight="800" fill="#0b0b0b" text-anchor="middle">400+ / 80+</text>
  <text x="531" y="145" font-size="12" fill="#52514e" text-anchor="middle">ルーティング対象モデル数 / 提供元プロバイダー数</text>
  <text x="531" y="167" font-size="21" font-weight="700" fill="#008300" text-anchor="middle">1,000万人超</text>
  <text x="531" y="182" font-size="10.5" fill="#898781" text-anchor="middle">OpenRouterの世界ユーザー数</text>

  <text x="24" y="222" font-size="12.5" font-weight="700" fill="#0b0b0b">狙い</text>
  <text x="24" y="242" font-size="12" fill="#0b0b0b">決済インフラ（Stripe）× AIモデルのルーティング最適化（OpenRouter）を統合</text>
  <text x="24" y="262" font-size="12" fill="#52514e">「リクエストをインテリジェントにルーティングし、トークンを効率的に使う」ことで</text>
  <text x="24" y="280" font-size="12" fill="#52514e">企業の収益性最大化を支援——Stripe公式コメント</text>

  <rect x="24" y="298" width="672" height="1" fill="#e1e0d9"/>
  <text x="24" y="322" font-size="11.5" fill="#52514e">対象モデルにはAnthropic・Google・OpenAI各社の製品も含まれる（特定ベンダー非依存の設計）</text>
  <text x="24" y="344" font-size="10.5" fill="#898781">出典: Stripe公式ニュースルーム / CNBC(8/19) / TechCrunch(8/16)</text>
</svg>
