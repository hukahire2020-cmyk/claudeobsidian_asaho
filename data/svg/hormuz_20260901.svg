<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="718" height="358" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="30" y="42" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="17" font-weight="700" fill="#0b0b0b">ホルムズ海峡危機 半年の推移</text>
  <text x="30" y="64" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#898781">2026年2月開戦から、機雷除去完了の直後に再び軍事行動へ</text>

  <line x1="60" y1="200" x2="660" y2="200" stroke="#c3c2b7" stroke-width="2"/>

  <!-- Event 1 -->
  <circle cx="100" cy="200" r="6" fill="#d03b3b"/>
  <line x1="100" y1="200" x2="100" y2="150" stroke="#e1e0d9" stroke-width="1"/>
  <text x="100" y="140" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">2/28</text>
  <text x="100" y="230" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#52514e" text-anchor="middle">米・イスラエルが</text>
  <text x="100" y="245" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#52514e" text-anchor="middle">イラン攻撃、開戦</text>

  <!-- Event 2 -->
  <circle cx="270" cy="200" r="6" fill="#d03b3b"/>
  <line x1="270" y1="200" x2="270" y2="150" stroke="#e1e0d9" stroke-width="1"/>
  <text x="270" y="140" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">7/22-23</text>
  <text x="270" y="230" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#52514e" text-anchor="middle">フーシ派がサウジ</text>
  <text x="270" y="245" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#52514e" text-anchor="middle">タンカー2隻を攻撃</text>

  <!-- Event 3 -->
  <circle cx="450" cy="200" r="6" fill="#008300"/>
  <line x1="450" y1="200" x2="450" y2="150" stroke="#e1e0d9" stroke-width="1"/>
  <text x="450" y="140" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">8月下旬</text>
  <text x="450" y="230" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#52514e" text-anchor="middle">米軍、海峡航路の</text>
  <text x="450" y="245" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#52514e" text-anchor="middle">機雷除去を完了</text>

  <!-- Event 4 -->
  <circle cx="620" cy="200" r="7" fill="#2a78d6"/>
  <line x1="620" y1="200" x2="620" y2="150" stroke="#e1e0d9" stroke-width="1"/>
  <text x="620" y="140" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">8/30</text>
  <text x="620" y="230" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0b0b0b" font-weight="700" text-anchor="middle">米、ララク島の</text>
  <text x="620" y="245" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#0b0b0b" font-weight="700" text-anchor="middle">発射台2基を攻撃</text>

  <rect x="60" y="280" width="600" height="56" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="80" y="303" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#52514e">機雷除去＝沈静化のサイン、と読めた矢先の攻撃再開。</text>
  <text x="80" y="321" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#52514e">理由は「イランがロケットへの機雷搭載準備を確認」（米中央軍）。約1カ月ぶりの軍事行動。</text>
</svg>
