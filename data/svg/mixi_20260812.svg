<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0b0b0b">MIXI：AI活用率99%超えでCAIOを新設</text>
  <text x="28" y="58" font-size="12" fill="#898781">2026年7月31日発表・CAIO 村瀨龍馬氏（前CTO）</text>

  <rect x="28" y="78" width="220" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="138" y="132" font-size="34" font-weight="700" fill="#2a78d6" text-anchor="middle">99%超</text>
  <text x="138" y="156" font-size="12" fill="#52514e" text-anchor="middle">全社AI活用率</text>

  <rect x="260" y="78" width="220" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="370" y="132" font-size="30" font-weight="700" fill="#008300" text-anchor="middle">約10億円</text>
  <text x="370" y="156" font-size="12" fill="#52514e" text-anchor="middle">年間コスト削減規模</text>

  <rect x="492" y="78" width="200" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="592" y="122" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">CAIO新設</text>
  <text x="592" y="146" font-size="12" fill="#52514e" text-anchor="middle">村瀨龍馬氏</text>
  <text x="592" y="164" font-size="11" fill="#898781" text-anchor="middle">取締役上級執行役員</text>
  <text x="592" y="182" font-size="11" fill="#898781" text-anchor="middle">（前CTO）</text>

  <line x1="28" y1="216" x2="692" y2="216" stroke="#c3c2b7"/>
  <text x="28" y="242" font-size="13" font-weight="700" fill="#0b0b0b">転換の狙い</text>
  <text x="28" y="264" font-size="12" fill="#52514e">「AIを使うこと」が全社に定着した段階から、「AIで事業価値を創出すること」へ。</text>
  <text x="28" y="284" font-size="12" fill="#52514e">CAIOが全社AI戦略・ガバナンス・AIネイティブな組織づくりを横断的に統括する。</text>
  <text x="28" y="308" font-size="11" fill="#898781">出典：MIXI公式プレスリリース（2026/7/31）</text>
</svg>
