    <rect x="162" y="200" width="126" height="40" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="225" y="224" fill="#0b0b0b">軽量物運搬</text>
    <rect x="296" y="200" width="126" height="40" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="359" y="224" fill="#0b0b0b">配茶機操作</text>
    <rect x="430" y="200" width="126" height="40" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="493" y="224" fill="#0b0b0b">下膳補助</text>
    <rect x="564" y="200" width="128" height="40" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="628" y="224" fill="#0b0b0b">体操進行</text>
