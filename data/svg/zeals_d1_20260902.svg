<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="278" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#0b0b0b">ジールス「D1」病院実証実験（2026/8/26〜28・重工大須病院）</text>

  <rect x="28" y="58" width="150" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="103" y="82" font-size="12" fill="#52514e" text-anchor="middle">延べ稼働時間</text>
  <text x="103" y="124" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="middle">35時間</text>
  <text x="103" y="144" font-size="10" fill="#898781" text-anchor="middle">3日間</text>

  <rect x="188" y="58" width="150" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="263" y="82" font-size="12" fill="#52514e" text-anchor="middle">検証業務数</text>
  <text x="263" y="124" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="middle">5業務</text>
  <text x="263" y="144" font-size="10" fill="#898781" text-anchor="middle">全項目完遂</text>

  <rect x="348" y="58" width="150" height="100" rx="8" fill="#f9f9f7" stroke="#008300" stroke-width="1.5"/>
  <text x="423" y="82" font-size="12" fill="#52514e" text-anchor="middle">接触・転倒</text>
  <text x="423" y="124" font-size="26" font-weight="700" fill="#008300" text-anchor="middle">ゼロ件</text>
  <text x="423" y="144" font-size="10" fill="#898781" text-anchor="middle">安全性を実証</text>

  <rect x="508" y="58" width="184" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="600" y="82" font-size="12" fill="#52514e" text-anchor="middle">想定価格</text>
  <text x="600" y="124" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="middle">500万円〜</text>
  <text x="600" y="144" font-size="10" fill="#898781" text-anchor="middle">1体あたり</text>

  <text x="28" y="188" font-size="13" font-weight="700" fill="#0b0b0b">検証した5つの院内業務</text>
