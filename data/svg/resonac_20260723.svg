<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#0b0b0b">レゾナック・ホールディングス — 現場発AIエージェントの全社展開（2026/7/15発表）</text>

  <rect x="28" y="58" width="150" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="103" y="82" font-size="12" fill="#52514e" text-anchor="middle">生成AI活用率</text>
  <text x="103" y="122" font-size="30" font-weight="700" fill="#2a78d6" text-anchor="middle">95%</text>
  <text x="103" y="142" font-size="10.5" fill="#898781" text-anchor="middle">対象2,405名</text>

  <rect x="186" y="58" width="150" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="261" y="82" font-size="12" fill="#52514e" text-anchor="middle">月間削減時間</text>
  <text x="261" y="122" font-size="30" font-weight="700" fill="#2a78d6" text-anchor="middle">9万</text>
  <text x="261" y="142" font-size="10.5" fill="#898781" text-anchor="middle">時間／月</text>

  <rect x="344" y="58" width="150" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="419" y="82" font-size="12" fill="#52514e" text-anchor="middle">金額換算</text>
  <text x="419" y="122" font-size="30" font-weight="700" fill="#2a78d6" text-anchor="middle">4.7億円</text>
  <text x="419" y="142" font-size="10.5" fill="#898781" text-anchor="middle">相当／月</text>

  <rect x="502" y="58" width="190" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="597" y="82" font-size="12" fill="#52514e" text-anchor="middle">導入から成果まで</text>
  <text x="597" y="122" font-size="24" font-weight="700" fill="#2a78d6" text-anchor="middle">約半年</text>
  <text x="597" y="142" font-size="10.5" fill="#898781" text-anchor="middle">2025年10月導入開始</text>

  <text x="28" y="184" font-size="13" font-weight="700" fill="#0b0b0b">個別業務での短縮効果</text>
  <text x="28" y="206" font-size="12" fill="#52514e">危険予知活動（安全教育）の作業時間</text>
  <text x="330" y="206" font-size="13" font-weight="700" fill="#d03b3b">従来比 約1/60</text>
  <text x="28" y="228" font-size="12" fill="#52514e">化学品法規制教育の教材作成時間</text>
  <text x="330" y="228" font-size="13" font-weight="700" fill="#d03b3b">従来比 約1/5</text>

  <rect x="28" y="244" width="664" height="40" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="42" y="262" font-size="11.5" fill="#0b0b0b" font-weight="700">独自モデル：①本社が生成AIを提供 → ②現場でAIエージェントが自然発生 → ③本社が標準化・全社展開</text>
  <text x="42" y="278" font-size="10.5" fill="#898781">トップダウンとボトムアップを融合したサイクルを継続的に回す方式</text>
</svg>
