<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="36" font-size="17" font-weight="700" fill="#0b0b0b">国内AIベンダーの動き（2026/7/28発表）</text>

  <g>
    <rect x="24" y="56" width="672" height="112" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="44" y="82" font-size="13" font-weight="700" fill="#0b0b0b">KDDI × Google AI Futures Fund</text>
    <text x="44" y="106" font-size="11.5" fill="#52514e">「AIスタートアップ支援プログラム」開始。Gemini等への早期アクセス、Google Cloudクレジット、</text>
    <text x="44" y="126" font-size="11.5" fill="#52514e">堺データセンターの主権AI検証環境「Gemini on GDC」、GPUクラウドを提供</text>
    <text x="44" y="150" font-size="11" fill="#898781">出典: KDDI公式</text>
  </g>

  <g>
    <rect x="24" y="182" width="672" height="112" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="44" y="208" font-size="13" font-weight="700" fill="#0b0b0b">Shippio</text>
    <text x="44" y="232" font-size="11.5" fill="#52514e">貿易プラットフォームに「請求項目のAI自動タグ付け機能」を追加。事業者ごとに名称が異なる</text>
    <text x="44" y="252" font-size="11.5" fill="#52514e">国際輸送費用をAIが自動分類し、分析用データ（CSV）として出力</text>
    <text x="44" y="276" font-size="11" fill="#898781">出典: Shippio公式（LNEWS報道経由で確認）</text>
  </g>

  <text x="24" y="322" font-size="12" fill="#52514e">論点: 大手は「育成の土台」、専業は「特定業務の精度」——役割分業が進む</text>
</svg>
