<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="34" font-size="17" font-weight="700" fill="#0b0b0b">米Abridge：アンビエントAI「Best in KLAS 2026」首位</text>

  <rect x="28" y="54" width="200" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="128" y="94" font-size="30" font-weight="700" fill="#2a78d6" text-anchor="middle">250+</text>
  <text x="128" y="116" font-size="11.5" fill="#52514e" text-anchor="middle">導入した医療システム数</text>
  <text x="128" y="134" font-size="10.5" fill="#898781" text-anchor="middle">大規模・複雑な医療機関中心</text>

  <rect x="260" y="54" width="200" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="360" y="94" font-size="26" font-weight="700" fill="#008300" text-anchor="middle">8,000万件+</text>
  <text x="360" y="116" font-size="11.5" fill="#52514e" text-anchor="middle">年間サポート見込み</text>
  <text x="360" y="134" font-size="10.5" fill="#898781" text-anchor="middle">臨床会話の件数</text>

  <rect x="492" y="54" width="200" height="100" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="592" y="94" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="middle">78%</text>
  <text x="592" y="116" font-size="11.5" fill="#52514e" text-anchor="middle">Sutter Healthの臨床医が</text>
  <text x="592" y="134" font-size="10.5" fill="#898781" text-anchor="middle">業務満足度の向上を実感</text>

  <line x1="28" y1="176" x2="692" y2="176" stroke="#c3c2b7"/>

  <text x="28" y="200" font-size="12" font-weight="700" fill="#0b0b0b">Best in KLAS 2026（2026年2月4日発表）</text>
  <text x="28" y="224" font-size="11.5" fill="#52514e">アンビエントAI（音声記録AI）分野で、顧客評価に基づき首位に選出</text>
  <text x="28" y="244" font-size="11.5" fill="#52514e">Culture・Loyalty・Relationship・Valueの各項目でA+評価</text>
  <text x="28" y="270" font-size="11" fill="#898781">出典: Abridge公式（2/4）</text>
</svg>
