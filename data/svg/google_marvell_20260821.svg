<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="358" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#0b0b0b">Google、Marvell株を最大122億ドル取得できる権利</text>
  <text x="24" y="60" font-size="12" fill="#52514e">契約締結 2026/7/29・開示 2026/8/19 — AIカスタム半導体で提携深化</text>

  <rect x="24" y="82" width="215" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="131" y="132" font-size="30" font-weight="800" fill="#2a78d6" text-anchor="middle">$12.2B</text>
  <text x="131" y="154" font-size="11.5" fill="#52514e" text-anchor="middle">ワラント取得上限額</text>
  <text x="131" y="172" font-size="11.5" fill="#52514e" text-anchor="middle">（新株予約権）</text>
  <text x="131" y="190" font-size="10" fill="#898781" text-anchor="middle">2033年まで有効</text>

  <rect x="252" y="82" width="215" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="359" y="132" font-size="30" font-weight="800" fill="#0b0b0b" text-anchor="middle">約5,900万株</text>
  <text x="359" y="154" font-size="11.5" fill="#52514e" text-anchor="middle">対象株数</text>
  <text x="359" y="172" font-size="11.5" fill="#52514e" text-anchor="middle">行使価格 $206.58/株</text>
  <text x="359" y="190" font-size="10" fill="#898781" text-anchor="middle">初年度は約140万株のみ行使可</text>

  <rect x="480" y="82" width="216" height="120" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="588" y="132" font-size="30" font-weight="800" fill="#008300" text-anchor="middle">+10%</text>
  <text x="588" y="154" font-size="11.5" fill="#52514e" text-anchor="middle">発表後のMarvell株価上昇</text>
  <text x="588" y="176" font-size="10" fill="#898781" text-anchor="middle">購入額$5億ごとに</text>
  <text x="588" y="190" font-size="10" fill="#898781" text-anchor="middle">行使可能枠が段階的に拡大</text>

  <text x="24" y="228" font-size="12.5" font-weight="700" fill="#0b0b0b">対象となるカスタム半導体</text>
  <g font-size="11" fill="#0b0b0b">
    <rect x="24" y="240" width="140" height="28" rx="14" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="94" y="258" text-anchor="middle">TPU関連技術</text>
    <rect x="172" y="240" width="150" height="28" rx="14" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="247" y="258" text-anchor="middle">推論アクセラレータ</text>
    <rect x="330" y="240" width="150" height="28" rx="14" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="405" y="258" text-anchor="middle">メモリコントローラー</text>
    <rect x="488" y="240" width="180" height="28" rx="14" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="578" y="258" text-anchor="middle">ネットワーク部品ほか</text>
  </g>

  <rect x="24" y="284" width="672" height="1" fill="#e1e0d9"/>
  <text x="24" y="308" font-size="11.5" fill="#52514e">株式取得を伴う「出資的」な半導体提携——AI大手による計算資源の囲い込みが一段と進む</text>
  <text x="24" y="330" font-size="10.5" fill="#898781">出典: CNBC(8/19) / Yahoo Finance=Bloomberg(8/19)、規制当局への提出書類</text>
</svg>
