<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">NTTデータ×NTTドコモビジネス: フロンティアAIサイバーリスク対応サービス</text>
  <text x="24" y="54" font-size="12" fill="#898781">2026年7月7日発表・7月31日（本日）提供開始</text>

  <!-- pipeline funnel -->
  <g>
    <rect x="24" y="80" width="128" height="60" rx="6" fill="#f9f9f7" stroke="#2a78d6"/>
    <text x="88" y="106" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">脅威・脆弱性</text>
    <text x="88" y="124" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">の発見</text>
  </g>
  <text x="160" y="115" font-size="14" fill="#c3c2b7" text-anchor="middle">→</text>
  <g>
    <rect x="168" y="80" width="128" height="60" rx="6" fill="#f9f9f7" stroke="#2a78d6"/>
    <text x="232" y="106" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">影響評価・</text>
    <text x="232" y="124" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">優先度判断</text>
  </g>
  <text x="304" y="115" font-size="14" fill="#c3c2b7" text-anchor="middle">→</text>
  <g>
    <rect x="312" y="80" width="128" height="60" rx="6" fill="#f9f9f7" stroke="#2a78d6"/>
    <text x="376" y="106" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">修復方針の</text>
    <text x="376" y="124" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">策定</text>
  </g>
  <text x="448" y="115" font-size="14" fill="#c3c2b7" text-anchor="middle">→</text>
  <g>
    <rect x="456" y="80" width="128" height="60" rx="6" fill="#f9f9f7" stroke="#2a78d6"/>
    <text x="520" y="106" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">修復対応</text>
  </g>
  <text x="592" y="115" font-size="14" fill="#c3c2b7" text-anchor="middle">→</text>
  <g>
    <rect x="600" y="80" width="96" height="60" rx="6" fill="#f9f9f7" stroke="#008300"/>
    <text x="648" y="106" font-size="11" fill="#0b0b0b" text-anchor="middle" font-weight="700">継続運用</text>
  </g>

  <rect x="24" y="160" width="672" height="55" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="182" font-size="12" font-weight="700" fill="#0b0b0b">AIの分析結果を「NTTDATA-CERT」等の専門組織が二段構えで検証</text>
  <text x="44" y="202" font-size="11" fill="#52514e">1万システム超のミッションクリティカル運用知見を組み合わせ、限られた人員での対応を支援</text>

  <rect x="24" y="228" width="672" height="42" rx="21" fill="#2a78d6"/>
  <text x="360" y="254" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">複数のフロンティアAI技術を評価・検証した上で採用</text>

  <text x="24" y="292" font-size="10" fill="#898781">出典: NTTドコモビジネス公式(7/7) / NTTデータグループ公式(7/7)</text>
</svg>
