<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#0b0b0b">消費税、1989年の導入以来初の引き下げへ——食料品8%→1%</text>

  <rect x="28" y="58" width="300" height="110" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="178" y="82" font-size="12" fill="#52514e" text-anchor="middle">食料品の消費税率（2027年4月〜2年間）</text>
  <text x="90" y="135" font-size="30" font-weight="700" fill="#898781" text-anchor="middle">8%</text>
  <path d="M120 128 h30 m-8 -6 8 6 -8 6" stroke="#2a78d6" stroke-width="2.5" fill="none"/>
  <text x="230" y="135" font-size="34" font-weight="700" fill="#2a78d6" text-anchor="middle">1%</text>
  <text x="178" y="155" font-size="10.5" fill="#898781" text-anchor="middle">残り1%相当は現金給付で「実質ゼロ化」</text>

  <rect x="344" y="58" width="348" height="110" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="518" y="82" font-size="12" fill="#52514e" text-anchor="middle">自民党内の賛否（7/31合同会議）</text>
  <rect x="380" y="100" width="220" height="18" rx="3" fill="#e1e0d9"/>
  <rect x="380" y="100" width="190" height="18" rx="3" fill="#2a78d6"/>
  <text x="380" y="135" font-size="20" font-weight="700" fill="#2a78d6">65人賛成</text>
  <text x="520" y="135" font-size="20" font-weight="700" fill="#898781">9人反対</text>
  <text x="518" y="155" font-size="10.5" fill="#898781" text-anchor="middle">75人発言・中立1人</text>

  <text x="28" y="196" font-size="13" font-weight="700" fill="#0b0b0b">決定までのスケジュール</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="28" y="208" width="150" height="42" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="103" y="227" font-weight="700" fill="#0b0b0b">7/30</text>
    <text x="103" y="243" font-size="10" fill="#52514e">首相が正式表明</text>
    <rect x="196" y="208" width="150" height="42" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="271" y="227" font-weight="700" fill="#0b0b0b">8/3</text>
    <text x="271" y="243" font-size="10" fill="#52514e">党内で事実上了承</text>
    <rect x="364" y="208" width="150" height="42" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="439" y="227" font-weight="700" fill="#2a78d6">8/5目標</text>
    <text x="439" y="243" font-size="10" fill="#52514e">総務会了承・閣議決定</text>
    <rect x="532" y="208" width="160" height="42" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="612" y="227" font-weight="700" fill="#0b0b0b">秋</text>
    <text x="612" y="243" font-size="10" fill="#52514e">臨時国会に法案提出</text>
  </g>
  <path d="M178 229 h18 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>
  <path d="M346 229 h18 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>
  <path d="M514 229 h18 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>

  <rect x="28" y="266" width="664" height="24" rx="6" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="42" y="282" font-size="10.5" fill="#898781">出典: 首相官邸・自民党合同会議、時事ドットコム（2026/7/30・8/3）</text>
</svg>
