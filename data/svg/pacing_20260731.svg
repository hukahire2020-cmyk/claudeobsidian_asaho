<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="338" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">「Pacing the Frontier」公開書簡——署名者の内訳</text>
  <text x="24" y="54" font-size="12" fill="#898781">2026年7月28日発表・1,100人超が署名（実名867人・匿名267人）</text>

  <!-- horizontal bar chart of signatories by company -->
  <text x="24" y="90" font-size="11" fill="#52514e">Anthropic</text>
  <rect x="120" y="78" width="400" height="18" rx="3" fill="#2a78d6"/>
  <text x="530" y="92" font-size="12" fill="#0b0b0b" font-weight="700">533人</text>

  <text x="24" y="122" font-size="11" fill="#52514e">OpenAI</text>
  <rect x="120" y="110" width="248" height="18" rx="3" fill="#c3c2b7"/>
  <text x="378" y="124" font-size="12" fill="#0b0b0b" font-weight="700">330人</text>

  <text x="24" y="154" font-size="11" fill="#52514e">Google</text>
  <rect x="120" y="142" width="143" height="18" rx="3" fill="#c3c2b7"/>
  <text x="273" y="156" font-size="12" fill="#0b0b0b" font-weight="700">191人</text>

  <text x="24" y="186" font-size="11" fill="#52514e">Meta</text>
  <rect x="120" y="174" width="47" height="18" rx="3" fill="#c3c2b7"/>
  <text x="177" y="188" font-size="12" fill="#0b0b0b" font-weight="700">62人</text>

  <!-- key signatories box -->
  <rect x="24" y="212" width="672" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="44" y="234" font-size="12" font-weight="700" fill="#0b0b0b">主な署名者</text>
  <text x="44" y="254" font-size="11" fill="#52514e">Anthropic CEO ダリオ・アモデイ氏／共同創業者 ジャレッド・カプラン氏・ジャック・クラーク氏</text>
  <text x="44" y="272" font-size="11" fill="#52514e">OpenAI チーフサイエンティスト ジャクブ・パチョッキ氏</text>

  <!-- key point box -->
  <rect x="24" y="292" width="672" height="0" fill="none"/>
  <text x="24" y="318" font-size="11" fill="#0b0b0b" font-weight="700">求めているのは「即時停止」ではなく「速度を制御できる国際的な仕組み」の整備</text>

  <text x="24" y="333" font-size="10" fill="#898781">出典: Pacing the Frontier声明・署名者リスト(7/28) / CNN Business(7/28)</text>
</svg>
