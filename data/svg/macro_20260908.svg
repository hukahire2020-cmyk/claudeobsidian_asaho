<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="298" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="28" y="40" font-size="17" font-weight="700" fill="#0b0b0b">国際政治×マクロ経済 — 今週の因果チェーン</text>

  <g font-size="11" text-anchor="middle">
    <rect x="16" y="58" width="150" height="56" rx="8" fill="#fcfcfb" stroke="#d03b3b" stroke-width="1.5"/>
    <text x="91" y="80" fill="#d03b3b" font-weight="700">ベッセント発言＋</text>
    <text x="91" y="96" fill="#d03b3b" font-weight="700">日銀機動的利上げ</text>

    <rect x="182" y="58" width="140" height="56" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="252" y="80" fill="#0b0b0b">円キャリー</text>
    <text x="252" y="96" fill="#0b0b0b">巻き戻し</text>

    <rect x="338" y="58" width="160" height="56" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="418" y="80" fill="#0b0b0b">1週間で160→</text>
    <text x="418" y="96" fill="#0b0b0b">152円台へ急伸</text>

    <rect x="514" y="58" width="190" height="56" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="609" y="80" fill="#2a78d6" font-weight="700">日経平均1,130円安</text>
    <text x="609" y="96" fill="#2a78d6" font-weight="700">日銀9/17-18利上げ観測↑</text>
  </g>
  <path d="M166 86 h16 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>
  <path d="M322 86 h16 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>
  <path d="M498 86 h16 m-6 -5 6 5 -6 5" stroke="#898781" stroke-width="2" fill="none"/>

  <rect x="24" y="132" width="205" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="126" y="154" font-size="12" fill="#52514e" text-anchor="middle">ドル円（9/8午前）</text>
  <text x="126" y="184" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="middle">152.88円</text>

  <rect x="241" y="132" width="220" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="351" y="154" font-size="12" fill="#52514e" text-anchor="middle">日経平均（9/8終値）</text>
  <text x="351" y="184" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="middle">65,269円33銭（-1.70%）</text>

  <rect x="473" y="132" width="219" height="70" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="583" y="154" font-size="12" fill="#52514e" text-anchor="middle">FOMC（9/15-16）</text>
  <text x="583" y="184" font-size="18" font-weight="700" fill="#2a78d6" text-anchor="middle">利下げ休止も視野</text>

  <rect x="24" y="218" width="668" height="54" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="42" y="240" font-size="12.5" font-weight="700" fill="#0b0b0b">役員と話すときの要点はこれだけ</text>
  <text x="42" y="258" font-size="11.5" fill="#52514e">介入も相場急変動もなく、政策発言だけで円が1週間で7円動く時代——為替前提は四半期ごとに見直す必要がある</text>

  <text x="28" y="290" font-size="11" fill="#898781">出典: 財経新聞・日本証券新聞・日銀高田審議委員講演資料（2026/9/2-9/8）</text>
</svg>
