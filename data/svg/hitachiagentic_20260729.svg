<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="36" font-size="17" font-weight="700" fill="#0b0b0b">日立「Agentic AI Integration Platform」（2026/7/24発表）</text>
  <text x="24" y="56" font-size="12" fill="#52514e">SI全工程にAIエージェントを組み込み、生産性を実証</text>

  <!-- horizontal bars comparing productivity multiples -->
  <g transform="translate(24,84)">
    <text x="0" y="14" font-size="12" fill="#52514e">要件定義工程（OT領域の実務作業）</text>
    <rect x="0" y="22" width="600" height="26" rx="4" fill="#f9f9f7" stroke="#e1e0d9"/>
    <rect x="0" y="22" width="600" height="26" rx="4" fill="#2a78d6"/>
    <text x="612" y="41" font-size="16" font-weight="700" fill="#2a78d6">240倍</text>
  </g>

  <g transform="translate(24,140)">
    <text x="0" y="14" font-size="12" fill="#52514e">設計〜テスト工程（自社パッケージ機能拡張）</text>
    <rect x="0" y="22" width="500" height="26" rx="4" fill="#f9f9f7" stroke="#e1e0d9"/>
    <rect x="0" y="22" width="500" height="26" rx="4" fill="#2a78d6" opacity="0.85"/>
    <text x="512" y="41" font-size="16" font-weight="700" fill="#2a78d6">約200倍</text>
  </g>

  <g transform="translate(24,196)">
    <text x="0" y="14" font-size="12" fill="#52514e">全工程の目標（2027年度）</text>
    <rect x="0" y="22" width="60" height="26" rx="4" fill="#f9f9f7" stroke="#e1e0d9"/>
    <rect x="0" y="22" width="60" height="26" rx="4" fill="#008300"/>
    <text x="72" y="41" font-size="16" font-weight="700" fill="#008300">+30%</text>
  </g>

  <g>
    <rect x="24" y="250" width="672" height="86" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
    <text x="44" y="274" font-size="12.5" font-weight="600" fill="#0b0b0b">主な適用領域（先行公表分）</text>
    <text x="44" y="298" font-size="11.5" fill="#52514e">MS&amp;ADインシュアランス グループ・共栄火災海上保険・JCB・静岡銀行・みずほFG など</text>
    <text x="44" y="318" font-size="11.5" fill="#52514e">今後は金融・公共・エネルギー・鉄道など社会インフラ領域へ適用を計画</text>
  </g>

  <text x="24" y="362" font-size="12.5" fill="#52514e">論点: 「AIエージェントがどこまでSI工程を代替できるか」が大手SIerの提案力を左右する。</text>

  <text x="24" y="386" font-size="10.5" fill="#898781">出典: 日立製作所公式(7/24)・ASCII(7/24)</text>
</svg>
