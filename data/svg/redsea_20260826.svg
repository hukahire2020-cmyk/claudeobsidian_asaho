<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="10" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
  <text x="24" y="34" font-size="17" font-weight="700" fill="#0b0b0b">紅海封鎖の拡大——非国家主体による攻撃の連鎖</text>

  <!-- timeline -->
  <line x1="50" y1="90" x2="670" y2="90" stroke="#c3c2b7" stroke-width="2"/>
  <circle cx="90" cy="90" r="6" fill="#2a78d6"/>
  <text x="90" y="70" font-size="12" fill="#52514e" text-anchor="middle">7月22-23日</text>
  <text x="90" y="112" font-size="11" fill="#0b0b0b" text-anchor="middle" width="120">Encelia号・Layla号</text>
  <text x="90" y="126" font-size="11" fill="#0b0b0b" text-anchor="middle">被弾（前号既報）</text>

  <circle cx="360" cy="90" r="6" fill="#2a78d6"/>
  <text x="360" y="70" font-size="12" fill="#52514e" text-anchor="middle">7月</text>
  <text x="360" y="112" font-size="11" fill="#0b0b0b" text-anchor="middle">フーシ派がサウジへの</text>
  <text x="360" y="126" font-size="11" fill="#0b0b0b" text-anchor="middle">「海上封鎖」を宣言</text>

  <circle cx="630" cy="90" r="7" fill="#d03b3b"/>
  <text x="630" y="70" font-size="12" fill="#d03b3b" font-weight="700" text-anchor="middle">8月24日</text>
  <text x="630" y="112" font-size="11" fill="#0b0b0b" text-anchor="middle">超大型タンカー「Amzan」</text>
  <text x="630" y="126" font-size="11" fill="#0b0b0b" text-anchor="middle">ミサイル攻撃で出火</text>

  <!-- stat tiles -->
  <rect x="24" y="170" width="200" height="180" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="124" y="200" font-size="12" fill="#52514e" text-anchor="middle">Amzan積載能力</text>
  <text x="124" y="250" font-size="34" font-weight="700" fill="#d03b3b" text-anchor="middle">200万</text>
  <text x="124" y="272" font-size="13" fill="#0b0b0b" text-anchor="middle">バレル（原油換算）</text>
  <text x="124" y="300" font-size="11" fill="#898781" text-anchor="middle">ヤンブ沖63海里で被弾</text>
  <text x="124" y="316" font-size="11" fill="#898781" text-anchor="middle">乗員は全員無事</text>

  <rect x="248" y="170" width="200" height="180" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="348" y="200" font-size="12" fill="#52514e" text-anchor="middle">紅海の重要性</text>
  <text x="348" y="250" font-size="34" font-weight="700" fill="#2a78d6" text-anchor="middle">12-15%</text>
  <text x="348" y="272" font-size="13" fill="#0b0b0b" text-anchor="middle">世界海上貿易が通過</text>
  <text x="348" y="300" font-size="11" fill="#898781" text-anchor="middle">バブエルマンデブ海峡</text>
  <text x="348" y="316" font-size="11" fill="#898781" text-anchor="middle">経由（金額で1兆ドル超）</text>

  <rect x="472" y="170" width="200" height="180" rx="8" fill="#f9f9f7" stroke="#e1e0d9"/>
  <text x="572" y="200" font-size="12" fill="#52514e" text-anchor="middle">ブレント原油(8/25)</text>
  <text x="572" y="250" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="middle">$91.90</text>
  <text x="572" y="272" font-size="13" fill="#0b0b0b" text-anchor="middle">/バレル前後で始値</text>
  <text x="572" y="300" font-size="11" fill="#898781" text-anchor="middle">供給不安と外交進展観測が</text>
  <text x="572" y="316" font-size="11" fill="#898781" text-anchor="middle">綱引きし方向感を欠く</text>
</svg>
